<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stress-Recovery Oscillation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&amp;family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">

</head>
<body>
<div class="wrap page">
  <header>
    <nav class="crumbs" aria-label="Back to the map"><a href="../index.html">← Playbook</a></nav>
    <h1>Stress-Recovery Oscillation</h1>
    <div class="meta"><span>I · Energy</span><span class="by">Jim Loehr</span></div>
    <p class="does">Designing recovery rituals to oscillate between stress and renewal.</p>
    <div class="cmd"><code>/aligned:use-framework stress-recovery-oscillation</code><button type="button" class="copy">Copy</button></div>
  </header>

</div>
<script>
// On a narrow screen the graph scrolls sideways; start at the right, where this framework is.
var graphBox = document.querySelector(".graph-box");
if (graphBox) graphBox.scrollLeft = graphBox.scrollWidth;
document.addEventListener("click", function (event) {
  var button = event.target.closest("button.copy");
  if (!button) return;
  var code = button.parentNode.querySelector("code");
  var text = code.textContent;
  function show(label) {
    button.textContent = label;
    setTimeout(function () { button.textContent = "Copy"; }, 1500);
  }
  function selectText() {
    var range = document.createRange();
    range.selectNodeContents(code);
    var selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    show("Selected");
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { show("Copied"); }, selectText);
  } else {
    selectText();
  }
});
</script>
</body>
</html>
