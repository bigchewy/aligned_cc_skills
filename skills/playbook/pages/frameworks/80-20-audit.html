<body>
<div class="wrap page">
  <header>
    <nav class="crumbs" aria-label="Back to the map"><a href="../index.html">← Playbook</a></nav>
    <h1>80/20 Audit</h1>
    <div class="meta"><span>I · Focus</span><span class="by">Tim Ferriss</span></div>
    <p class="does">A ruthless Pareto analysis of their work and life to identify what to double down on and what to eliminate.</p>
    <div class="cmd"><code>/aligned:use-framework 80-20-audit</code><button type="button" class="copy">Copy</button></div>
  </header>
  <section>
    <h2>Helps to have</h2>
    <ul class="docs">
      <li><span class="doc">business goals</span><span class="from">from <a href="proximate-objectives.html">Proximate Objectives</a></span></li>
    </ul>
  </section>
</div>
<script>
// On a narrow screen the graph scrolls sideways; start at the right, where this framework is.
var graphBox = document.querySelector(".graph-box");
if (graphBox) graphBox.scrollLeft = graphBox.scrollWidth;
document.addEventListener("click", function (event) {
  var button = event.target.closest("button.copy");
  if (!button) return;
  var code = button.parentNode.querySelector("code");
  var text = code.textContent;
  function show(label) {
    button.textContent = label;
    setTimeout(function () { button.textContent = "Copy"; }, 1500);
  }
  function selectText() {
    var range = document.createRange();
    range.selectNodeContents(code);
    var selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    show("Selected");
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { show("Copied"); }, selectText);
  } else {
    selectText();
  }
});
</script>
</body>
</html>
