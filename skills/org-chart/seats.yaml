# The org chart data. The only file a person edits.
#
# scripts/generate-org-chart.py reads this file and the two registries, checks
# them, and builds the pages in skills/org-chart/pages/. Every framework and
# advisor in the registries must sit on a seat or in holding.
#
# departments: list order sets column order on the charts.
# seats: list order sets order within a column and the previous/next links.
#   people: typical headcount at 100 people, per chart. A seat appears only on
#     the charts it lists. 0 means not on the payroll.
#   reports_to: a seat id, or {b2b: id, b2c: id} when it differs by chart.
#   coverage: covered | thin | none, set by hand and checked by the build.
#   jobs: what the CEO needs done. One framework per job; `also` lists other
#     frameworks for the same job.
#   also_ask: advisors with no framework on this seat.
#   missing: required when coverage is thin or none.

departments:
  - id: lead
    name: Leadership team
  - id: product
    name: Product and design
  - id: eng
    name: Engineering
  - id: mkt
    name: Marketing
  - id: sales
    name: Sales
  - id: cust
    name: Customers
  - id: people
    name: People
  - id: ops
    name: Finance, legal, and operations

seats:
  # ---------------------------------------------------------------- Leadership team
  - id: ceo
    dept: lead
    name: CEO
    people: {b2b: 1, b2c: 1}
    coverage: covered
    does: Sets the strategy, builds the leadership team, and makes the calls nobody else can make.
    jobs:
      - do: Write a strategy that names what is hard and what you will do about it
        framework: kernel-of-good-strategy
        also: [finding-the-crux, proximate-objectives, lifecycle-strategy, blue-ocean-value-props, working-backwards]
      - do: Make the big calls, and know which ones you can undo
        framework: type-1-type-2-decisions
        also: [believability-weighted-decision-making, first-principles-thinking, fear-setting, regret-minimization]
      - do: Decide whether to change course or keep going
        framework: pivot-or-persevere
        also: [do-things-that-dont-scale, earnestness-filter]
      - do: Find why a problem keeps coming back
        framework: root-cause-analysis
        also: [6-step-process]
      - do: Look at your own part in what keeps going wrong
        framework: 100-percent-responsibility
        also: [above-below-the-line, pillars-of-integrity]
      - do: Spend your week on the work only you can do
        framework: zone-of-genius
        also: [80-20-audit, personal-resource-allocation]

  - id: board
    dept: lead
    name: Board and fundraising
    people: {b2b: 0, b2c: 0}
    dotted: true
    coverage: none
    does: Raises money, reports to investors, and runs the board meetings.
    jobs: []
    missing: Raising a venture round, running a board meeting with investors, and building the board deck.

  - id: coo
    dept: lead
    name: COO or chief of staff
    people: {b2b: 1, b2c: 1}
    reports_to: ceo
    coverage: covered
    does: Runs the operating rhythm of weekly updates and monthly reviews, and fixes processes that break.
    jobs:
      - do: Replace status meetings with a written weekly update
        framework: mochary-weekly-check-in
      - do: Run a monthly review that ends in decisions
        framework: chj-operating-review
      - do: Put a weekly leadership meeting in place and get feedback on it
        framework: leadership-meeting
      - do: Fix a process that keeps breaking
        framework: the-algorithm
        also: [6-step-process]
      - do: Turn a service your team delivers by hand into a package clients can buy
        framework: proven-process
    also_ask: []

  # ---------------------------------------------------------------- Product and design
  - id: head-of-product
    dept: product
    name: Head of product
    people: {b2b: 1, b2c: 1}
    reports_to: ceo
    coverage: covered
    does: Decides what the product does, what it stops doing, and what gets built this quarter.
    jobs:
      - do: Decide what the team builds next quarter
        framework: frame-shape-bet
      - do: Cut a feature list down to the half that matters
        framework: getting-real-cut
        also: [focus-through-saying-no, four-quadrant-focus]
      - do: Find out what customers hire the product to do
        framework: jobs-to-be-done
      - do: Decide what the product does that no rival does
        framework: blue-ocean-value-props
      - do: Start from what the customer sees and work back to the build
        framework: working-backwards
    also_ask: [garry-tan]

  - id: product-managers
    dept: product
    name: Product managers
    people: {b2b: 4, b2c: 6}
    reports_to: head-of-product
    coverage: covered
    does: Find out what customers need, scope the work, and decide when a feature is done.
    jobs:
      - do: Test your riskiest guess before you build
        framework: leap-of-faith-assumptions
        also: [build-measure-learn, launch-bet]
      - do: Find out which problems customers will pay to solve
        framework: customer-problem-presentation
        also: [earlyvangelists, four-market-types]
      - do: Map what the user does start to finish, and slice the first release
        framework: user-story-map
      - do: Check whether customers would miss the product if it went away
        framework: product-market-fit-test
      - do: Find out why users don't do what the product asks
        framework: 3b-behavioral-design
    also_ask: [jason-fried, paul-graham]

  - id: product-designers
    dept: product
    name: Product designers
    people: {b2b: 4, b2c: 6}
    reports_to: head-of-product
    coverage: covered
    does: Design the screens, keep the design system consistent, and make the product easy to use.
    jobs:
      - do: Write the design rules every screen follows
        framework: design-principles
        also: [logic-check]
      - do: Turn a rough flow into real screens
        framework: breadboard-to-pages
      - do: List every pattern the app already uses
        framework: interface-inventory
      - do: Find the steps where users stall or quit
        framework: 3b-behavioral-design
    also_ask: [steve-krug]

  - id: user-researcher
    dept: product
    name: User researcher
    people: {b2b: 1, b2c: 1}
    reports_to: head-of-product
    coverage: covered
    does: Runs customer interviews and usability tests and tells the team what they learned.
    jobs:
      - do: Run customer interviews that test what you think the problem is
        framework: customer-problem-presentation
      - do: Find out what job customers hire the product for
        framework: jobs-to-be-done
      - do: Study how users decide, apart from what they say
        framework: 3b-behavioral-design
    also_ask: []

