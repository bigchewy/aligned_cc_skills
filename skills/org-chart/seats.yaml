        framework: performance-standards-by-level
    also_ask: [matt-mochary]
    missing: Running one-on-ones, giving feedback week to week, and hiring engineers.

  - id: software-engineers
    dept: eng
    name: Software engineers
    people: {b2b: 26, b2c: 30}
