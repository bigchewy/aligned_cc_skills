<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{ORG_NAME} — Brand Review</title>
  <style>
    /* THEME — emitted by render_review.py from review-data.json theme.palette/fonts */
    {FONT_FACES_CSS}
    :root {
{PALETTE_VARS_CSS}
    }

    /* ── Reset / base ── */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body, system-ui, -apple-system, "Segoe UI", sans-serif);
      background: var(--background, #faf9f7);
      color: var(--text-primary, #1a1a1a);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* ── Site header ── */
    .site-header {
      background: var(--primary, #1e1b4b);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 32px;
    }
    .site-header img.logo { height: 34px; width: auto; object-fit: contain; }
    .wordmark { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; }
    .header-org {
      font-size: 0.9rem;
      opacity: 0.65;
      margin-left: auto;
      font-weight: 400;
    }

    /* ── Sticky area nav ── */
    .area-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface, #f5f3ef);
      border-bottom: 2px solid var(--border, #e5e7eb);
      display: flex;
      overflow-x: auto;
      padding: 0 24px;
      -webkit-overflow-scrolling: touch;
    }
    .area-nav::-webkit-scrollbar { height: 4px; }
    .area-nav::-webkit-scrollbar-track { background: transparent; }
    .area-nav::-webkit-scrollbar-thumb { background: var(--border, #e5e7eb); border-radius: 2px; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 12px 16px;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-secondary, #555);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: color 120ms, border-color 120ms;
    }
    .nav-btn:hover { color: var(--text-primary, #1a1a1a); }
    .nav-btn.active { color: var(--accent, #ff6900); border-bottom-color: var(--accent, #ff6900); }

    /* Grade chips in nav */
    .grade-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 99px;
      font-feature-settings: 'tnum';
      min-width: 32px;
    }
    .g1 { background: #fef2f2; color: #b91c1c; }
    .g2 { background: #fff7ed; color: #c2410c; }
    .g3 { background: #fef9c3; color: #a16207; }
    .g4 { background: #f0fdf4; color: #16a34a; }
    .g5 { background: #ecfdf5; color: #047857; }

    /* ── Panel container ── */
    .panels { padding: 32px; max-width: 900px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Section header ── */
    .section-eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-muted, #6b7280);
      margin: 0 0 8px;
    }
    .section-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }
    .section-head h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
      line-height: 1.2;
    }
    .grade-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      font-feature-settings: 'tnum';
    }
    .grade-badge.g1 { background: #fef2f2; color: #b91c1c; }
    .grade-badge.g2 { background: #fff7ed; color: #c2410c; }
    .grade-badge.g3 { background: #fef9c3; color: #a16207; }
    .grade-badge.g4 { background: #f0fdf4; color: #16a34a; }
    .grade-badge.g5 { background: #ecfdf5; color: #047857; }

    .section-summary {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-secondary, #555);
      margin: 0 0 24px;
      max-width: 680px;
    }

    /* ── Overview — readout cards ── */
    .readout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }
    @media (max-width: 640px) {
      .readout-grid { grid-template-columns: 1fr; }
    }
    .readout-card {
      background: var(--surface, #f5f3ef);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .rc-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted, #6b7280);
      margin: 0 0 6px;
    }
    .readout-card p { font-size: 0.88rem; margin: 0; line-height: 1.6; }

    /* ── Provided / Needed columns ── */
    .signal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }
    @media (max-width: 540px) {
      .signal-grid { grid-template-columns: 1fr; }
    }
    .signal-card {
      background: var(--surface, #f5f3ef);
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .sc-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted, #6b7280);
      margin: 0 0 8px;
    }
    .signal-card ul { margin: 0; padding-left: 16px; }
    .signal-card li { font-size: 0.87rem; line-height: 1.55; margin-bottom: 3px; color: var(--text-primary, #1a1a1a); }

    /* ── Open questions ── */
    .oq-section-heading {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted, #6b7280);
      margin: 0 0 10px;
    }
    .oq-list { list-style: none; padding: 0; margin: 0 0 28px; }
    .oq-item {
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 8px;
      background: var(--surface, #f5f3ef);
    }
    .oq-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; flex-wrap: wrap; }
    .oq-id {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted, #6b7280);
      font-family: var(--font-mono, Menlo, monospace);
    }
    .oq-impact {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .p0 { background: #fef2f2; color: #b91c1c; }
    .p1 { background: #fff7ed; color: #c2410c; }
    .p2 { background: #f0f9ff; color: #0369a1; }
    .oq-question { font-size: 0.9rem; font-weight: 500; margin: 0 0 5px; line-height: 1.5; }
    .oq-why { font-size: 0.82rem; color: var(--text-secondary, #555); margin: 0; line-height: 1.55; }

    /* ── Divider ── */
    .panel-divider { border: none; border-top: 1px solid var(--divider, #e5e7eb); margin: 24px 0; }
  </style>
</head>
<body>

<header class="site-header">
  {HEADER_BRAND}
  <span class="header-org">{ORG_NAME} — Brand Review</span>
</header>

<nav class="area-nav" role="navigation" aria-label="Brand areas">
  {NAV_TABS}
</nav>

<main class="panels" id="panels">
  {SECTION_PANELS}
</main>

<script>
(function () {
  var panels = document.querySelectorAll('.panel');
  var navBtns = document.querySelectorAll('.nav-btn');

  function activate(id) {
    panels.forEach(function (p) { p.classList.toggle('active', p.dataset.section === id); });
    navBtns.forEach(function (b) { b.classList.toggle('active', b.dataset.section === id); });
    history.replaceState(null, '', '#' + id);
  }

  navBtns.forEach(function (b) {
    b.addEventListener('click', function () { activate(b.dataset.section); });
  });

  var hash = location.hash.slice(1);
  var firstId = navBtns[0] ? navBtns[0].dataset.section : '';
  var hasPanel = hash && document.querySelector('.panel[data-section="' + hash + '"]');
  activate(hasPanel ? hash : firstId);
})();
</script>
</body>
</html>
