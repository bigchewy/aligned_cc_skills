<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540">
  <!--
    The kill list on its own page: reference layout for the
    kernel-of-good-strategy framework's kill-list page, in the same style
    as kernel-one-page-example.svg. Content is REM Medical's strategy
    kernel (a sleep-medicine company that no longer exists), used with its
    founder's permission. The kill list itself was not on the original
    page and is illustrative: it shows the format, not REM Medical's
    actual decisions.

    Page one is what the company is doing. This page is what it has
    decided not to do, and the two never share a wall.

    Swap every line of text for the user's locked lines; keep the boxes.
    Four to seven rows. Each row is a name, about five words, and its
    re-entry condition, about twelve words. Colors and font are a neutral
    default; replace them with the project's design-principles.md tokens
    when one exists.
  -->
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="540" fill="#faf9f7"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#1a1a1a" font-size="22" font-weight="700" letter-spacing="2">REM MEDICAL STRATEGY KERNEL</text>
  <text x="600" y="68" text-anchor="middle" fill="#1e2847" font-size="12" font-weight="700" letter-spacing="1">KILL LIST</text>

  <!-- ============================================================ -->
  <!-- WHY THIS PAGE EXISTS -->
  <!-- ============================================================ -->
  <text x="600" y="106" text-anchor="middle" fill="#555555" font-size="14">A refusal without a re-entry condition gets reopened in a hallway six months later.</text>
  <text x="600" y="126" text-anchor="middle" fill="#555555" font-size="14">Each line here closes a door and puts a condition on the handle.</text>

  <!-- ============================================================ -->
  <!-- THE LIST: name column, re-entry column -->
  <!-- ============================================================ -->
  <rect x="40" y="152" width="1120" height="348" rx="12" ry="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Column headers -->
  <text x="72" y="186" fill="#1e2847" font-size="11" font-weight="700" letter-spacing="1">NOT NOW</text>
  <text x="560" y="186" fill="#1e2847" font-size="11" font-weight="700" letter-spacing="1">COMES BACK WHEN</text>
  <line x1="64" y1="200" x2="1136" y2="200" stroke="#1e2847" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="72" y="242" fill="#1e2847" font-size="16">&#215;</text>
  <text x="96" y="242" fill="#1a1a1a" font-size="16" font-weight="700">In-lab beds in existing markets</text>
  <text x="560" y="242" fill="#555555" font-size="14">In-lab utilization above 85% for two straight quarters</text>
  <line x1="64" y1="268" x2="1136" y2="268" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="72" y="310" fill="#1e2847" font-size="16">&#215;</text>
  <text x="96" y="310" fill="#1a1a1a" font-size="16" font-weight="700">Price cuts to win referrals</text>
  <text x="560" y="310" fill="#555555" font-size="14">A referral source names price as the reason they left</text>
  <line x1="64" y1="336" x2="1136" y2="336" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="72" y="378" fill="#1e2847" font-size="16">&#215;</text>
  <text x="96" y="378" fill="#1a1a1a" font-size="16" font-weight="700">Consumer sleep products</text>
  <text x="560" y="378" fill="#555555" font-size="14">Two occupational-health clients ask for them</text>
  <line x1="64" y1="404" x2="1136" y2="404" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Row 4 -->
  <text x="72" y="446" fill="#1e2847" font-size="16">&#215;</text>
  <text x="96" y="446" fill="#1a1a1a" font-size="16" font-weight="700">Acquiring other sleep labs</text>
  <text x="560" y="446" fill="#555555" font-size="14">A results-based payer contract is signed and needs capacity</text>
  <line x1="64" y1="472" x2="1136" y2="472" stroke="#e5e7eb" stroke-width="1"/>

</svg>
