let activeCategory = 'all';
let collapsedCategories = new Set();

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === 'className') node.className = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2).toLowerCase(), v);
      else node.setAttribute(k, v);
    });
  }
  if (children !== undefined) {
    if (typeof children === 'string') node.textContent = children;
    else if (Array.isArray(children)) children.forEach(c => { if (c) node.appendChild(c); });
    else if (children instanceof Node) node.appendChild(children);
  }
  return node;
}

function getCategories() {
  const cats = {};
  frameworks.forEach(f => {
    cats[f.category] = (cats[f.category] || 0) + 1;
  });
  return Object.entries(cats).sort((a, b) => b[1] - a[1]);
}

function renderFilterPills() {
  const container = document.getElementById('filter-pills');
  container.replaceChildren();
  const cats = getCategories();
  const filters = [{ key: 'all', label: 'All (' + frameworks.length + ')' }, ...cats.map(([k, v]) => ({ key: k, label: k + ' (' + v + ')' }))];
  filters.forEach(f => {
    const active = activeCategory === f.key;
    const btn = el('button', {
      className: 'px-2.5 py-0.5 rounded-full text-xs font-medium transition-colors ' +
        (active ? 'bg-accent text-white' : 'bg-accent-subtle text-accent hover:bg-accent hover:text-white'),
      onClick: () => { activeCategory = f.key; renderFilterPills(); filterFrameworks(); }
    }, f.label);
    container.appendChild(btn);
  });
}

function filterFrameworks() {
  const query = document.getElementById('search').value.toLowerCase().trim();
  const filtered = frameworks.filter(f => {
    if (activeCategory !== 'all' && f.category !== activeCategory) return false;
    if (!query) return true;
    const searchable = [f.name, f.advisor, f.category, f.use_when, ...f.domains].join(' ').toLowerCase();
    return searchable.includes(query);
  });
  renderSections(filtered);
  document.getElementById('stats').textContent = 'Showing ' + filtered.length + ' of ' + frameworks.length + ' frameworks';
}

function toggleCategory(cat) {
  if (collapsedCategories.has(cat)) {
    collapsedCategories.delete(cat);
  } else {
    collapsedCategories.add(cat);
  }
  filterFrameworks();
}

function toggleDetails(id) {
  const details = document.getElementById('details-' + id);
  const arrow = document.getElementById('arrow-' + id);
  if (details.classList.contains('hidden')) {
    details.classList.remove('hidden');
    arrow.textContent = '\u25BE';
  } else {
    details.classList.add('hidden');
    arrow.textContent = '\u25B8';
  }
}

function advisorDisplayName(id) {
  return id.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function renderSections(list) {
  const container = document.getElementById('sections');
  container.replaceChildren();

  if (list.length === 0) {
    container.appendChild(el('p', { className: 'text-sm text-dimmed py-8 text-center' }, 'No frameworks match your search.'));
    return;
  }

  // Group by category
  const groups = {};
  list.forEach(f => {
    if (!groups[f.category]) groups[f.category] = [];
    groups[f.category].push(f);
  });

  // Sort categories by count descending
  const sorted = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);

  sorted.forEach(([cat, items]) => {
    const collapsed = collapsedCategories.has(cat);
    const section = el('div', { className: 'mb-6' });

    // Category header
    const header = el('div', {
      className: 'flex items-center gap-2 cursor-pointer mb-2 select-none',
      onClick: () => toggleCategory(cat)
    });
    header.appendChild(el('span', { className: 'text-xs text-dimmed' }, collapsed ? '\u25B8' : '\u25BE'));
    header.appendChild(el('h2', { className: 'text-sm font-semibold text-foreground' }, cat));
    header.appendChild(el('span', { className: 'text-xs text-dimmed' }, '(' + items.length + ')'));
    section.appendChild(header);

    if (!collapsed) {
      const cards = el('div', { className: 'flex flex-col gap-2' });
      items.forEach(f => {
        const hasDetails = f.domains.length > 0 || f.required_documents || f.helpful_documents;

        const card = el('div', {
          className: 'bg-white border border-border rounded-md p-3 hover:border-accent/30 transition-colors' + (hasDetails ? ' cursor-pointer' : '')
        });
        if (hasDetails) card.addEventListener('click', () => toggleDetails(f.id));

        // Header row
        const headerRow = el('div', { className: 'flex justify-between items-start' });
        const nameRow = el('div', { className: 'flex items-center' });

        const arrow = el('span', { id: 'arrow-' + f.id, className: 'text-dimmed text-xs mr-1.5' }, hasDetails ? '\u25B8' : '');
        if (!hasDetails) arrow.style.width = '0.875rem';
        nameRow.appendChild(arrow);
        nameRow.appendChild(el('span', { className: 'font-semibold text-sm text-foreground' }, f.name));
        headerRow.appendChild(nameRow);

        // Advisor link
        const advisorLink = el('a', {
          className: 'text-xs text-accent hover:underline hidden sm:inline',
          href: 'advisor-catalog.html#' + f.advisor
        }, advisorDisplayName(f.advisor));
        advisorLink.addEventListener('click', (e) => e.stopPropagation());
        headerRow.appendChild(advisorLink);
        card.appendChild(headerRow);

        // Use when
        if (f.use_when) {
          card.appendChild(el('p', { className: 'text-xs text-secondary mt-1 ml-5' }, f.use_when));
        }

        // Details (hidden)
        if (hasDetails) {
          const details = el('div', { id: 'details-' + f.id, className: 'hidden mt-3 pt-3 border-t border-border' });

          if (f.domains.length > 0) {
            const domSection = el('div', { className: 'mb-3' });
            domSection.appendChild(el('p', { className: 'text-xs font-medium text-foreground mb-1' }, 'Domains'));
            const pills = el('div', { className: 'flex flex-wrap gap-1' });
            f.domains.forEach(d => {
              pills.appendChild(el('span', { className: 'text-[0.7rem] px-1.5 py-px rounded-full bg-muted text-secondary' }, d));
            });
            domSection.appendChild(pills);
            details.appendChild(domSection);
          }

          if (f.required_documents) {
            const reqSection = el('div', { className: 'mb-3' });
            reqSection.appendChild(el('p', { className: 'text-xs font-medium text-foreground mb-0.5' }, 'Required documents'));
            reqSection.appendChild(el('p', { className: 'text-xs text-secondary' }, f.required_documents.join(', ')));
            details.appendChild(reqSection);
          }

          if (f.helpful_documents) {
            const helpSection = el('div', { className: 'mb-3' });
            helpSection.appendChild(el('p', { className: 'text-xs font-medium text-foreground mb-0.5' }, 'Helpful documents'));
            helpSection.appendChild(el('p', { className: 'text-xs text-secondary' }, f.helpful_documents.join(', ')));
            details.appendChild(helpSection);
          }

          card.appendChild(details);
        }

        cards.appendChild(card);
      });
      section.appendChild(cards);
    }

    container.appendChild(section);
  });
}

// Initial render
renderFilterPills();
filterFrameworks();
</script>

</body>
</html>
