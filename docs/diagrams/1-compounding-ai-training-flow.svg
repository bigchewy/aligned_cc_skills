<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }</style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6900"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="#faf9f7"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" fill="#1a1a1a" font-size="20" font-weight="600" letter-spacing="-0.02em">One Prompt, Compounding Results</text>
  <text x="600" y="68" text-anchor="middle" fill="#555555" font-size="14">How a single request activates an entire AI system</text>

  <!-- Step numbers (small accent circles above boxes) -->
  <circle cx="118" cy="108" r="12" fill="#ff6900"/>
  <text x="118" y="113" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">1</text>

  <circle cx="338" cy="108" r="12" fill="#ff6900"/>
  <text x="338" y="113" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">2</text>

  <circle cx="558" cy="108" r="12" fill="#ff6900"/>
  <text x="558" y="113" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">3</text>

  <circle cx="778" cy="108" r="12" fill="#ff6900"/>
  <text x="778" y="113" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">4</text>

  <circle cx="998" cy="108" r="12" fill="#ff6900"/>
  <text x="998" y="113" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">5</text>

  <!-- Box 1: Start with a Problem -->
  <rect x="28" y="128" width="180" height="80" rx="6" fill="#f0eeeb" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="118" y="162" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">Start with</text>
  <text x="118" y="180" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">a Problem</text>

  <!-- Box 2: Find the Right Advisor -->
  <rect x="248" y="128" width="180" height="80" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="338" y="162" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">Find the Right</text>
  <text x="338" y="180" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">Advisor</text>

  <!-- Box 3: Walk Through a Framework -->
  <rect x="468" y="128" width="180" height="80" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="558" y="162" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">Walk Through</text>
  <text x="558" y="180" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">a Framework</text>

  <!-- Box 4: Critics Sharpen It -->
  <rect x="688" y="128" width="180" height="80" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="778" y="162" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">Critics</text>
  <text x="778" y="180" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">Sharpen It</text>

  <!-- Box 5: Walk Out with a Plan (highlighted) -->
  <rect x="908" y="128" width="180" height="80" rx="6" fill="#ff6900" stroke="#e55d00" stroke-width="1.5"/>
  <text x="998" y="162" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Walk Out with</text>
  <text x="998" y="180" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">a Plan</text>

  <!-- Arrow connectors -->
  <line x1="208" y1="168" x2="244" y2="168" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="428" y1="168" x2="464" y2="168" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="648" y1="168" x2="684" y2="168" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="868" y1="168" x2="904" y2="168" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Description labels beneath each box -->
  <text x="118" y="234" text-anchor="middle" fill="#555555" font-size="12">"I need to design</text>
  <text x="118" y="250" text-anchor="middle" fill="#555555" font-size="12">a training session"</text>

  <text x="338" y="234" text-anchor="middle" fill="#555555" font-size="12">System matches you</text>
  <text x="338" y="250" text-anchor="middle" fill="#555555" font-size="12">to the best expert</text>

  <text x="558" y="234" text-anchor="middle" fill="#555555" font-size="12">Expert voice guides</text>
  <text x="558" y="250" text-anchor="middle" fill="#555555" font-size="12">structured thinking</text>

  <text x="778" y="234" text-anchor="middle" fill="#555555" font-size="12">Multiple perspectives</text>
  <text x="778" y="250" text-anchor="middle" fill="#555555" font-size="12">catch blind spots</text>

  <text x="998" y="234" text-anchor="middle" fill="#555555" font-size="12">Concrete, actionable</text>
  <text x="998" y="250" text-anchor="middle" fill="#555555" font-size="12">deliverable</text>

  <!-- What just happened callout bar -->
  <rect x="28" y="300" width="1144" height="56" rx="6" fill="#fff7ed" stroke="#ff6900" stroke-width="1"/>

  <!-- Callout content -->
  <line x1="52" y1="328" x2="70" y2="328" stroke="#ff6900" stroke-width="2"/>
  <text x="82" y="324" fill="#1a1a1a" font-size="13" font-weight="600">What just happened:</text>
  <text x="82" y="342" fill="#555555" font-size="12">One prompt activated an advisor, a framework, and a critic panel — all built from markdown files. No code. No plugins. Just structured thinking.</text>

  <!-- Bottom tagline -->
  <text x="600" y="404" text-anchor="middle" fill="#6b7280" font-size="13">Built with markdown. No code. Just structured thinking the AI follows.</text>

  <!-- Subtle compounding curve beneath boxes (decorative) -->
  <path d="M 118 268 Q 338 290 558 276 Q 778 262 998 248" stroke="#ff6900" stroke-width="1.5" fill="none" opacity="0.25" stroke-dasharray="4 4"/>
</svg>