<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720">
  <defs>
    <style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }</style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6900"/>
    </marker>
    <marker id="arrowhead-muted" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e5e7eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" fill="#faf9f7"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#1a1a1a" font-size="20" font-weight="600" letter-spacing="-0.02em">How the Factory Was Built</text>
  <text x="550" y="64" text-anchor="middle" fill="#555555" font-size="14">Each frustration became a capability. Each capability made the next one easier.</text>

  <!-- === LAYER 1: Generic Prompts === -->
  <!-- Frustration label -->
  <text x="44" y="118" fill="#6b7280" font-size="11" font-weight="500">FRUSTRATION</text>

  <!-- Box: Generic prompts -->
  <rect x="44" y="130" width="220" height="64" rx="6" fill="#f0eeeb" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="154" y="158" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Generic LLM Prompts</text>
  <text x="154" y="176" text-anchor="middle" fill="#555555" font-size="12">Inconsistent results</text>

  <!-- Arrow to response -->
  <line x1="264" y1="162" x2="310" y2="162" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Response label -->
  <text x="324" y="118" fill="#6b7280" font-size="11" font-weight="500">RESPONSE</text>

  <!-- Box: Built personas -->
  <rect x="324" y="130" width="220" height="64" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="434" y="158" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Built Personas</text>
  <text x="434" y="176" text-anchor="middle" fill="#555555" font-size="12">Steve Jobs, Elon Musk</text>

  <!-- Result -->
  <line x1="544" y1="162" x2="590" y2="162" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#arrowhead-muted)"/>
  <text x="604" y="158" fill="#555555" font-size="12" font-style="italic">Better answers,</text>
  <text x="604" y="174" fill="#555555" font-size="12" font-style="italic">but still flat</text>

  <!-- Vertical connector to layer 2 -->
  <line x1="434" y1="194" x2="434" y2="240" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- === LAYER 2: Frameworks === -->
  <text x="44" y="258" fill="#6b7280" font-size="11" font-weight="500">FRUSTRATION</text>

  <rect x="44" y="270" width="220" height="64" rx="6" fill="#f0eeeb" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="154" y="298" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Personas Lack Structure</text>
  <text x="154" y="316" text-anchor="middle" fill="#555555" font-size="12">Voice without method</text>

  <line x1="264" y1="302" x2="310" y2="302" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>

  <text x="324" y="258" fill="#6b7280" font-size="11" font-weight="500">RESPONSE</text>

  <rect x="324" y="270" width="220" height="64" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="434" y="298" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Documented Frameworks</text>
  <text x="434" y="316" text-anchor="middle" fill="#555555" font-size="12">Structured thinking steps</text>

  <line x1="544" y1="302" x2="590" y2="302" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#arrowhead-muted)"/>
  <text x="604" y="298" fill="#555555" font-size="12" font-style="italic">Real expertise,</text>
  <text x="604" y="314" fill="#555555" font-size="12" font-style="italic">but manual to invoke</text>

  <!-- Vertical connector to layer 3 -->
  <line x1="434" y1="334" x2="434" y2="380" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- === LAYER 3: Skills === -->
  <text x="44" y="398" fill="#6b7280" font-size="11" font-weight="500">FRUSTRATION</text>

  <rect x="44" y="410" width="220" height="64" rx="6" fill="#f0eeeb" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="154" y="438" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Too Many Advisors</text>
  <text x="154" y="456" text-anchor="middle" fill="#555555" font-size="12">Hard to find the right one</text>

  <line x1="264" y1="442" x2="310" y2="442" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>

  <text x="324" y="398" fill="#6b7280" font-size="11" font-weight="500">RESPONSE</text>

  <rect x="324" y="410" width="220" height="64" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="434" y="438" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Built Advisor Skill</text>
  <text x="434" y="456" text-anchor="middle" fill="#555555" font-size="12">Auto-match to the right expert</text>

  <!-- Branch: Find Advisors skill -->
  <line x1="544" y1="442" x2="590" y2="442" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="604" y="410" width="220" height="64" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="714" y="434" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Built Find Advisors Skill</text>
  <text x="714" y="452" text-anchor="middle" fill="#555555" font-size="12">Research 30 candidates,</text>
  <text x="714" y="468" text-anchor="middle" fill="#555555" font-size="12">narrow to the best</text>

  <!-- Vertical connector to layer 4 -->
  <line x1="434" y1="474" x2="434" y2="520" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- === LAYER 4: The System === -->
  <text x="44" y="538" fill="#6b7280" font-size="11" font-weight="500">FRUSTRATION</text>

  <rect x="44" y="550" width="220" height="64" rx="6" fill="#f0eeeb" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="154" y="578" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Need New Domains Fast</text>
  <text x="154" y="596" text-anchor="middle" fill="#555555" font-size="12">Can't build everything manually</text>

  <line x1="264" y1="582" x2="310" y2="582" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>

  <text x="324" y="538" fill="#6b7280" font-size="11" font-weight="500">RESPONSE</text>

  <rect x="324" y="550" width="220" height="64" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="434" y="574" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Skills Build Skills</text>
  <text x="434" y="592" text-anchor="middle" fill="#555555" font-size="12">The factory builds itself</text>

  <!-- Arrow to highlight box -->
  <line x1="544" y1="582" x2="590" y2="582" stroke="#ff6900" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Highlight: Today -->
  <rect x="604" y="550" width="220" height="64" rx="6" fill="#ff6900" stroke="#e55d00" stroke-width="1.5"/>
  <text x="714" y="574" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Today: One Prompt</text>
  <text x="714" y="592" text-anchor="middle" fill="#ffffff" font-size="12">Activates the whole system</text>

  <!-- Compounding gradient bar on the left side -->
  <rect x="16" y="130" width="4" height="484" rx="2" fill="#ff6900" opacity="0.15"/>
  <rect x="16" y="530" width="4" height="84" rx="2" fill="#ff6900" opacity="0.6"/>

  <!-- Bottom tagline -->
  <text x="550" y="668" text-anchor="middle" fill="#6b7280" font-size="13">Every frustration became a tool. Every tool made the next one easier to build.</text>
  <text x="550" y="688" text-anchor="middle" fill="#6b7280" font-size="12">That's compounding.</text>
</svg>