<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advisor Catalog</title>
  <style>
    :root {
      --color-background: #faf9f7;
      --color-surface: #f5f3ef;
      --color-muted: #f0eeeb;
      --color-foreground: #1a1a1a;
      --color-secondary: #555555;
      --color-dimmed: #6b7280;
      --color-border: #e5e7eb;
      --color-accent: #ff6900;
      --color-accent-hover: #e55d00;
      --color-accent-subtle: #fff7ed;
      --color-danger: #b91c1c;
      --color-danger-subtle: #fef2f2;
      --color-success: #047857;
      --color-success-subtle: #ecfdf5;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: Menlo, Consolas, Monaco, "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--color-background);
      color: var(--color-foreground);
      margin: 0;
      padding: 0 0 80px 0;
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      background: var(--color-background);
      border-bottom: 1px solid var(--color-border);
      padding: 16px 32px;
      z-index: 50;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 4px 0; }
    .subtitle { font-size: 0.9rem; color: var(--color-secondary); margin: 0 0 12px 0; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    #search {
      flex: 1;
      min-width: 240px;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 0.9rem;
      background: white;
      font-family: inherit;
    }
    #search:focus { outline: none; border-color: var(--color-accent); }
    .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; max-width: 100%; }
    .pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid var(--color-border);
      background: white;
      cursor: pointer;
      font-family: inherit;
      transition: all 100ms;
    }
    .pill:hover { border-color: var(--color-accent); color: var(--color-accent); }
    .pill.active { background: var(--color-accent); color: white; border-color: var(--color-accent); }
    .pill .count { opacity: 0.6; margin-left: 4px; }

    main { padding: 16px 32px; max-width: 1200px; margin: 0 auto; }
    .group-heading {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 24px 0 8px 0;
    }

    .row {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      margin-bottom: 8px;
      transition: border-color 100ms;
    }
    .row:hover { border-color: var(--color-dimmed); }
    .row.modified { border-color: var(--color-accent); background: var(--color-accent-subtle); }
    .row.marked-delete {
      border-color: var(--color-danger);
      background: var(--color-danger-subtle);
      opacity: 0.7;
    }
    .row.marked-delete .row-header h3 .row-name { text-decoration: line-through; }
    .row.expanded { border-color: var(--color-foreground); }
    .row-header {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .row-header h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0;
    }
    .row-info { flex: 1; min-width: 0; }
    .row-id {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-dimmed);
      font-weight: 400;
      margin-left: 8px;
    }
    .row-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background: var(--color-surface);
      color: var(--color-secondary);
      white-space: nowrap;
    }
    .row-badge.advisor { background: var(--color-accent-subtle); color: var(--color-accent); }
    .row-badge.modified { background: var(--color-accent); color: white; }
    .row-badge.delete { background: var(--color-danger); color: white; }
    .row-summary {
      font-size: 0.85rem;
      color: var(--color-secondary);
      margin: 4px 0 0 0;
    }
    .row-body {
      display: none;
      padding: 0 16px 16px 16px;
      border-top: 1px solid var(--color-border);
    }
    .row.expanded .row-body { display: block; }

    .field { margin: 12px 0; }
    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .field input, .field textarea {
      width: 100%;
      font-family: inherit;
      font-size: 0.88rem;
      padding: 6px 10px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: white;
      color: var(--color-foreground);
      resize: vertical;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--color-accent); }
    .field textarea { min-height: 60px; line-height: 1.5; }
    .field.modified label { color: var(--color-accent); }
    .field.modified input, .field.modified textarea { border-color: var(--color-accent); background: var(--color-accent-subtle); }
    .field-readonly {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--color-secondary);
      padding: 6px 10px;
      background: var(--color-muted);
      border-radius: 4px;
      word-break: break-all;
    }

    .row-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--color-border);
    }
    .btn {
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: white;
      color: var(--color-foreground);
      font-family: inherit;
      cursor: pointer;
      transition: all 100ms;
    }
    .btn:hover { border-color: var(--color-foreground); }
    .btn-danger { color: var(--color-danger); border-color: var(--color-danger); }
    .btn-danger:hover { background: var(--color-danger); color: white; }
    .btn-primary { background: var(--color-accent); color: white; border-color: var(--color-accent); }
    .btn-primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--color-secondary); }
    .btn-ghost:hover { color: var(--color-foreground); border-color: var(--color-border); }

    .stats {
      font-size: 0.82rem;
      color: var(--color-secondary);
      padding: 8px 0 16px 0;
    }
    .empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--color-dimmed);
      font-size: 0.9rem;
    }

    /* Pending changes bar */
    #pending-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--color-foreground);
      color: white;
      padding: 12px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.1);
      z-index: 100;
    }
    #pending-bar.hidden { display: none; }
    #pending-bar .pending-count { font-size: 0.95rem; font-weight: 600; }
    #pending-bar .pending-detail { color: rgba(255,255,255,0.7); font-size: 0.85rem; flex: 1; }
    #pending-bar .btn { background: white; color: var(--color-foreground); border-color: white; }
    #pending-bar .btn:hover { background: var(--color-accent); color: white; border-color: var(--color-accent); }
    #pending-bar .btn-ghost { background: transparent; color: rgba(255,255,255,0.7); border-color: transparent; }
    #pending-bar .btn-ghost:hover { color: white; background: rgba(255,255,255,0.1); border-color: transparent; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 24px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 12px;
      padding: 24px;
      max-width: 720px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal h2 { margin: 0 0 8px 0; font-size: 1.2rem; }
    .modal p { color: var(--color-secondary); font-size: 0.88rem; margin: 0 0 16px 0; }
    .modal textarea {
      flex: 1;
      width: 100%;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-muted);
      color: var(--color-foreground);
      resize: none;
      min-height: 320px;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .copy-success {
      color: var(--color-success);
      font-size: 0.85rem;
      align-self: center;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Advisor Catalog</h1>
    <p class="subtitle" id="header-subtitle"></p>
    <div class="controls">
      <input id="search" type="text" placeholder="Search by id, name, or any field..." autocomplete="off">
      <div class="filter-pills" id="category-pills"></div>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>
    <div id="rows"></div>
    <div class="empty" id="empty" style="display:none;">No matches.</div>
  </main>

  <div id="pending-bar" class="hidden">
    <span class="pending-count" id="pending-count">0 pending changes</span>
    <span class="pending-detail" id="pending-detail"></span>
    <button class="btn btn-ghost" id="clear-pending">Clear all</button>
    <button class="btn btn-primary" id="export-pending">Export queue</button>
  </div>

  <div class="modal-overlay" id="export-modal">
    <div class="modal">
      <h2>Export queue</h2>
      <p>Copy the JSON below and paste it back into Claude Code to apply the changes. localStorage retains the queue until you clear it manually.</p>
      <textarea id="export-text" readonly></textarea>
      <div class="modal-actions">
        <span class="copy-success" id="copy-success" style="display:none;">Copied to clipboard</span>
        <button class="btn" id="modal-close">Close</button>
        <button class="btn btn-primary" id="modal-copy">Copy to clipboard</button>
      </div>
    </div>
  </div>

  <script id="config-data" type="application/json">{"entityType": "advisor", "registry": {"selection_guidelines": {"narrow_scope": "1-2 critics", "typical_scope": "2-3 critics", "complex_scope": "3-4 critics", "rules": ["Hard-exclude any critic whose not_for matches the work's primary domain", "Prefer diversity of lens — avoid overlapping domains", "When in doubt, prefer fewer focused critics over more redundant ones"], "calibration_examples": [{"scope": "A single utility with no integrations", "critics": ["the-architect"]}, {"scope": "An API route with database writes and RLS", "critics": ["the-architect", "the-security-reviewer"]}, {"scope": "A user-facing feature with backend + UI + auth", "critics": ["steve-jobs", "the-architect", "the-qa-engineer"]}, {"scope": "A product launch plan spanning positioning, UI, backend, integrations", "critics": ["april-dunford", "steve-jobs", "the-architect", "the-security-reviewer"]}]}, "advisors": [{"id": "andreo-spina", "name": "Dr. Andreo Spina", "summary": "Creator of FRC and founder of Functional Anatomy Seminars", "prompt": "advisors/prompts/andreo-spina.md", "domains": ["mobility", "joint-health", "tissue-adaptation", "movement-science", "rehabilitation"], "evaluation_expertise": "Evaluates whether movement and mobility protocols are grounded in cellular biology and progressive force application. Are tissue adaptation timelines realistic? Is the program building neurological ownership of range, or just temporary passive deformation? Catches vague flexibility language, quick-fix claims, and muscle-focused thinking that ignores joints as the limiting factor.\n", "best_for": "Mobility programming, joint health protocols, movement practice design, rehabilitation plans, content making claims about flexibility or mobility.\n", "not_for": "Business strategy, marketing, software architecture, content strategy, speed or power training.\n"}, {"id": "andy-raskin", "name": "Andy Raskin", "summary": "Strategic narrative consultant", "prompt": "advisors/prompts/andy-raskin.md", "domains": ["narrative", "storytelling", "strategic-narrative"], "evaluation_expertise": "Evaluates narrative structure. Does it open with a shift in the world, not a product pitch? Is there a compelling arc? Does the reader feel the stakes? Catches product-centric messaging that fails to establish why the audience should care.\n", "best_for": "Blog posts, long-form content, pitch decks, brand narratives. Content that needs a compelling story arc.\n", "not_for": "Short-form content (social posts, CTAs), technical documentation, infrastructure designs.\n"}, {"id": "april-dunford", "name": "April Dunford", "summary": "Positioning consultant, helped 200+ tech companies position products", "prompt": "advisors/prompts/april-dunford.md", "domains": ["positioning", "messaging", "competitive-analysis", "differentiation", "go-to-market"], "evaluation_expertise": "Evaluates whether positioning is clear, differentiated, and consistently reflected. Are competitive alternatives clear? Is the \"why now\" compelling? Does every claim trace back to a genuine differentiator? Catches positioning drift — claims the positioning doesn't support.\n", "best_for": "Marketing plans, landing pages, product positioning, go-to-market strategy, competitive analysis. Content that must reflect brand positioning.\n", "not_for": "Technical architecture, internal tools, backend plumbing, code quality.\n"}, {"id": "arielle-nissenblatt", "name": "Arielle Nissenblatt", "summary": "Founder of EarBuds Podcast Collective, community alchemist at SquadCast", "prompt": "advisors/prompts/arielle-nissenblatt.md", "domains": ["community-building", "word-of-mouth", "podcast-growth", "audience-engagement", "human-curation"], "evaluation_expertise": "Evaluates whether growth strategy prioritizes genuine community and shareability over vanity metrics and algorithmic optimization. Is the content designed to trigger personal recommendations? Are listeners being treated as advocates, not traffic? Catches download obsession, algorithm-first thinking, and strategies that build passive audiences instead of active communities.\n", "best_for": "Podcast growth strategy, community-building plans, audience engagement programs, word-of-mouth campaigns, content shareability assessment.\n", "not_for": "Technical architecture, paid acquisition strategy, SEO, backend systems, rapid-scale growth plans.\n"}, {"id": "benjamin-levine", "name": "Dr. Benjamin Levine", "summary": "Director of Institute for Exercise and Environmental Medicine, NASA cardiovascular consultant", "prompt": "advisors/prompts/benjamin-levine.md", "domains": ["exercise-physiology", "cardiovascular-reconditioning", "evidence-based-protocols", "dysautonomia", "progressive-overload"], "evaluation_expertise": "Evaluates whether exercise and reconditioning protocols are physiologically grounded with appropriate dosing and progression. Are heart rate targets specific and evidence-based? Is progression guided by data rather than subjective feel? Catches overly aggressive timelines, vague intensity prescriptions, and protocols that ignore individual cardiac capacity.\n", "best_for": "Exercise programming for deconditioned populations, cardiovascular reconditioning plans, POTS exercise protocols, content making claims about exercise physiology.\n", "not_for": "Business strategy, marketing, software design, non-cardiovascular health topics, elite athletic performance.\n"}, {"id": "blair-grubb", "name": "Dr. Blair Grubb", "summary": "Expert in autonomic disorders and POTS", "prompt": "advisors/prompts/blair-grubb.md", "domains": ["autonomic-disorders", "POTS", "clinical-diagnosis", "patient-advocacy", "treatment-prioritization"], "evaluation_expertise": "Evaluates whether autonomic disorder content correctly identifies POTS subtypes, prioritizes high-impact interventions over exhaustive lists, and validates rather than dismisses patient experience. Are comorbidities being screened? Is the treatment plan focused on the three things that matter most? Catches dismissive framing, one-size-fits-all protocols, and over-complicated treatment plans that bury critical interventions.\n", "best_for": "POTS treatment plans, autonomic disorder content, patient education materials, clinical protocol review, health content that risks dismissing dysautonomia.\n", "not_for": "Business strategy, marketing, software architecture, exercise programming, non-autonomic health topics.\n"}, {"id": "brene-brown", "name": "Brene Brown", "summary": "Research professor on courage, shame, and wholehearted leadership", "prompt": "advisors/prompts/brene-brown.md", "domains": ["vulnerability", "leadership-courage", "shame-resilience", "trust-building", "organizational-culture"], "evaluation_expertise": "Evaluates whether leadership and communication surfaces the emotional truth or hides behind armor. Is clarity being traded for niceness? Are hard conversations being avoided? Is trust being built through consistent small moments or demanded through position? Catches performative vulnerability, unclear-is-unkind communication, and leadership that prioritizes comfort over courage.\n", "best_for": "Leadership communications, team culture assessments, difficult conversation preparation, organizational trust diagnostics, content about leadership and authenticity.\n", "not_for": "Technical architecture, pricing strategy, SEO, conversion optimization, code quality.\n"}, {"id": "byron-katie", "name": "Byron Katie", "summary": "Creator of The Work and self-inquiry guide", "prompt": "advisors/prompts/byron-katie.md", "domains": ["self-inquiry", "cognitive-reframing", "stress-reduction", "belief-examination", "radical-acceptance"], "evaluation_expertise": "Evaluates whether stressful thoughts and assumptions are being examined or accepted uncritically. Is the person suffering from reality or from their story about reality? Are beliefs being questioned through genuine inquiry or just replaced with positive thinking? Catches unexamined assumptions driving decisions, stories mistaken for facts, and attempts to change reality rather than question the thought arguing with it.\n", "best_for": "Decision-making paralysis, interpersonal conflict analysis, stress and anxiety around business or personal situations, examining assumptions behind strategic choices.\n", "not_for": "Technical design, marketing execution, financial analysis, product architecture, content creation.\n"}, {"id": "chris-voss", "name": "Chris Voss", "summary": "Former FBI lead kidnapping negotiator, author of Never Split the Difference", "prompt": "advisors/prompts/chris-voss.md", "domains": ["negotiation", "tactical-empathy", "difficult-conversations", "deal-making", "conflict-resolution"], "evaluation_expertise": "Evaluates whether communication and negotiation approaches use empathy as a tool rather than logic as a weapon. Is the other side's perspective being labeled and acknowledged before positions are stated? Are calibrated questions replacing arguments? Is there an accusation audit for what the other side fears? Catches logic-first persuasion, premature compromise, and failure to address the emotional dynamics driving the negotiation.\n", "best_for": "Sales conversations, contract negotiations, difficult workplace conversations, partnership discussions, any high-stakes communication where the other side needs to feel heard.\n", "not_for": "Technical architecture, product design, content strategy, SEO, situations with no counterparty to negotiate with.\n"}, {"id": "clayton-christensen", "name": "Clayton Christensen", "summary": "Harvard professor, pioneer of disruptive innovation and Jobs to Be Done", "prompt": "advisors/prompts/clayton-christensen.md", "domains": ["jobs-to-be-done", "disruptive-innovation", "customer-motivation", "strategic-resource-allocation", "innovation-strategy"], "evaluation_expertise": "Evaluates whether the work understands the job the customer is hiring the product to do — functional, emotional, and social dimensions. Is the strategy based on understanding customer progress or on product features? Are resources being allocated to match stated strategy? Catches product-centric thinking that ignores customer circumstances, disruption paranoia without identifying the actual mechanism, and stated strategies that don't match revealed resource allocation.\n", "best_for": "Product strategy, new market entry, innovation pipeline evaluation, customer research framing, strategic planning where incumbents face potential disruption.\n", "not_for": "UI design, code architecture, copywriting, SEO, execution-level marketing tactics.\n"}, {"id": "danny-iny", "name": "Danny Iny", "summary": "Founder of Mirasee, creator of Course Builder's Laboratory", "prompt": "advisors/prompts/danny-iny.md", "domains": ["course-creation", "validation-first-launches", "pilot-methodology", "online-education", "knowledge-business"], "evaluation_expertise": "Evaluates whether knowledge products and courses are being validated before being built. Is demand proven through willingness to pay, or assumed from engagement metrics? Is the creator hiding behind perfectionism instead of launching a transparent pilot? Are timelines realistic — 60 days to pilot, not 8 months to polish? Catches building without validation, audience-first paralysis without monetization, and perfectionism masking fear of selling.\n", "best_for": "Course and workshop design, knowledge product launches, coaching program structure, pilot program planning, creator-economy business models.\n", "not_for": "Technical architecture, visual design, SEO, enterprise sales strategy, content that doesn't involve teaching or education.\n"}, {"id": "diana-chapman", "name": "Diana Chapman", "summary": "Co-founder of the Conscious Leadership Group", "prompt": "advisors/prompts/diana-chapman.md", "domains": ["conscious-leadership", "emotional-intelligence", "self-awareness", "conflict-resolution", "team-dynamics"], "evaluation_expertise": "Evaluates whether leadership content addresses inner state, not just tactics. Is the person operating above or below the line? Are blame patterns disguised as feedback? Does the work reflect whole-body integrity or performed confidence? Catches drift between stated values and reactive behavior.\n", "best_for": "Leadership development content, team culture docs, founder reflections, conflict resolution plans, organizational values. Work that requires emotional honesty and self-awareness.\n", "not_for": "Technical architecture, marketing copy, financial models, product specs, code quality.\n"}, {"id": "don-draper", "name": "Don Draper", "summary": "Creative director", "prompt": "advisors/prompts/don-draper.md", "domains": ["creative-direction", "storytelling", "emotional-copywriting", "brand-narrative", "simplicity"], "evaluation_expertise": "Evaluates whether messaging makes people feel something or just informs them. Is the story underneath the brief surfaced? Is the work simple enough to land, or cluttered with features and committee thinking? Catches copy that describes what something does instead of what it means.\n", "best_for": "Headlines, taglines, landing page hero copy, brand narratives, ad concepts, pitch decks. Any content that must move people emotionally in few words.\n", "not_for": "Analytical frameworks, positioning strategy, data-driven marketing, technical documentation, competitive analysis.\n"}, {"id": "elise-darma", "name": "Elise Darma", "summary": "Instagram strategist", "prompt": "advisors/prompts/elise-darma.md", "domains": ["instagram-marketing", "social-media-automation", "content-efficiency", "dm-conversion", "reels-strategy"], "evaluation_expertise": "Evaluates whether Instagram content drives revenue or just vanity metrics. Is the time investment proportional to return? Are DMs automated for off-hours conversion? Catches over-investment in content creation, chasing follower counts, and copying influencer tactics that don't work for small accounts.\n", "best_for": "Time-constrained Instagram strategy, DM automation flows, Reels-first content plans, sub-1K-follower monetization. Small business owners who need Instagram revenue in 30 minutes a week, not 30 hours.\n", "not_for": "Multi-channel marketing strategy, brand building, B2B marketing, long-form content, platforms other than Instagram.\n"}, {"id": "elon-musk", "name": "Elon Musk", "summary": "Serial founder who builds from physics up", "prompt": "advisors/prompts/elon-musk.md", "domains": ["first-principles", "10x-thinking", "breaking-assumptions", "efficiency"], "evaluation_expertise": "Questions inherited assumptions. Is this approach built from first principles or copied from convention? Could the scope be 10x simpler by removing unnecessary constraints? Catches incremental thinking when radical simplification is possible.\n", "best_for": "Designs where conventional thinking may be limiting. Questioning inherited assumptions.\n", "not_for": "Incremental improvements, polish work, emotional/therapeutic features, content strategy.\n"}, {"id": "eric-ries", "name": "Eric Ries", "summary": "Entrepreneur who treats startups as scientific experiments", "prompt": "advisors/prompts/eric-ries.md", "domains": ["validation", "hypothesis testing", "lean methodology", "MVP scoping"], "evaluation_expertise": "Evaluates whether assumptions are being validated before investment. Is there a testable hypothesis? Could a smaller experiment answer the key question? Is the scope minimal enough to learn quickly? Catches over-building before validation.\n", "best_for": "New features where user need is unproven. MVP scoping. Build-vs-validate decisions.\n", "not_for": "Mature features with proven demand, infrastructure, internal tooling, maintenance work.\n"}, {"id": "gabor-mate", "name": "Gabor Mate", "summary": "Physician and author on trauma, addiction, and mind-body connection", "prompt": "advisors/prompts/gabor-mate.md", "domains": ["trauma-awareness", "mind-body-connection", "compassionate-inquiry", "addiction", "emotional-health"], "evaluation_expertise": "Evaluates whether content honors the whole person or reduces them to symptoms and fixes. Are compulsive patterns recognized as unmet needs? Is achievement framed honestly or used as validation-seeking cover? Catches wellness performance, caretaking disguised as generosity, and guilt masquerading as loyalty.\n", "best_for": "Founder wellbeing content, burnout narratives, personal essays, wellness program design, culture documents addressing human cost. Content that must go beneath the surface of productivity advice.\n", "not_for": "Marketing strategy, technical systems, competitive analysis, product design, financial planning.\n"}, {"id": "garry-tan", "name": "Garry Tan", "summary": "CEO of YC, designer-engineer-founder who leads with earnestness and product taste", "prompt": "advisors/prompts/garry-tan.md", "domains": ["pre-pmf", "ai-native", "earnestness", "design-thinking", "yc-modern"], "evaluation_expertise": "Evaluates through the lens of earnestness and product taste. Is this founder genuinely solving a problem they care about, or performing startup? Does the product feel designed for humans or for a pitch deck? Is AI the foundation of the architecture or a bolted-on buzzword? Catches playing startup, premature hiring, and products that lack design conviction.\n", "best_for": "AI-native product evaluation, product design/UX critique for startups, earnestness diagnosis, founder conviction checks, deciding what to focus on when everything feels urgent.\n", "not_for": "Detailed go-to-market execution, pricing/monetization strategy, post-PMF scaling operations, team management, deep strategic analysis.\n"}, {"id": "italo-biaggioni", "name": "Dr. Italo Biaggioni", "summary": "Clinical pharmacologist, director emeritus of Vanderbilt's Autonomic Dysfunction Center", "prompt": "advisors/prompts/italo-biaggioni.md", "domains": ["clinical-pharmacology", "autonomic-disorders", "mechanism-based-treatment", "dysautonomia", "evidence-based-medicine"], "evaluation_expertise": "Evaluates whether treatment approaches match the underlying pathophysiology. Is the mechanism understood before choosing intervention? Are non-pharmacologic measures exhausted first? Catches protocol-following without substrate assessment, chasing numbers instead of symptoms, and applying specialist-level interventions to mild presentations.\n", "best_for": "Autonomic dysfunction treatment plans, dysautonomia patient education, clinical pharmacology discussions, mechanism-based medical content. Health content requiring physiologic precision.\n", "not_for": "Marketing, business strategy, creative content, software design, general wellness advice outside autonomic medicine.\n"}, {"id": "jasmine-star", "name": "Jasmine Star", "summary": "Social media strategist, founder of Social Curator", "prompt": "advisors/prompts/jasmine-star.md", "domains": ["instagram-strategy", "relationship-marketing", "service-business-growth", "dm-engagement", "content-positioning"], "evaluation_expertise": "Evaluates whether content leads with the problem solved or just lists services. Is the audience focus at 98% their problems, 2% your offer? Are DM relationships being cultivated or ghosted after engagement? Catches feature-first messaging, posting-and-ghosting, and content that talks about you instead of them.\n", "best_for": "Service businesses converting through relationship — photographers, coaches, consultants. DM engagement systems, content calendars that solve audience problems, Instagram strategy built on showing up.\n", "not_for": "Product businesses, B2B enterprise marketing, multi-channel strategy, technical documentation, platforms outside Instagram.\n"}, {"id": "jay-clouse", "name": "Jay Clouse", "summary": "Founder of Creator Science", "prompt": "advisors/prompts/jay-clouse.md", "domains": ["creator-economy", "audience-growth", "experimentation", "creator-business-models", "trust-building"], "evaluation_expertise": "Evaluates whether creator strategies are evidence-based or guru-driven hype. Is there a testable hypothesis before scaling? Are trust metrics (email open rates, revenue per subscriber) tracked over vanity metrics? Catches hustle-culture assumptions, premature scaling, and building on unvalidated audience assumptions.\n", "best_for": "Creator business plans, newsletter strategy, podcast growth audits, content monetization models, audience experiments. Work that needs a scientific, sustainable approach to creator growth.\n", "not_for": "Enterprise marketing, paid advertising strategy, brand identity design, technical product development, time-sensitive viral campaigns.\n"}, {"id": "jeff-bezos", "name": "Jeff Bezos", "summary": "Founder who works backwards from the customer and thinks in decades", "prompt": "advisors/prompts/jeff-bezos.md", "domains": ["customer-obsession", "scalability", "long-term-strategy", "reversibility"], "evaluation_expertise": "Evaluates through the lens of customer impact and long-term thinking. Is this a one-way or two-way door decision? Does it scale? Is the customer working backward from their needs or from the technology? Catches short-term thinking and reversibility blind spots.\n", "best_for": "Designs that affect customers, need to scale, or involve irreversible decisions. Long-term architectural bets.\n", "not_for": "Internal tooling, one-off scripts, personal workflows, narrow UI tweaks.\n"}, {"id": "jenna-kutcher", "name": "Jenna Kutcher", "summary": "Host of Goal Digger Podcast, NYT bestselling author", "prompt": "advisors/prompts/jenna-kutcher.md", "domains": ["content-marketing", "creative-entrepreneurship", "email-list-building", "content-repurposing", "authentic-branding"], "evaluation_expertise": "Evaluates whether content connects on a human level or sounds like a textbook. Are content pillars balanced between connection and selling? Is the creator showing up as a real person or performing polish? Catches over-complicated frameworks, hustle-culture undertones, and content that breaks the promise the bio makes.\n", "best_for": "Content pillar strategy, email marketing for creatives, social media repurposing workflows, personal brand development. Creative entrepreneurs who need warmth and structure without corporate rigidity.\n", "not_for": "B2B enterprise strategy, technical documentation, analytical frameworks, regulated industries, luxury brand positioning.\n"}, {"id": "jeremy-enns", "name": "Jeremy Enns", "summary": "Founder of Podcast Marketing Academy", "prompt": "advisors/prompts/jeremy-enns.md", "domains": ["podcast-marketing", "creator-growth-systems", "audience-retention", "scrappy-marketing", "content-monetization"], "evaluation_expertise": "Evaluates whether podcast growth is engineered or just hoped for. Is retention measured before chasing exposure? Is there a clear path from listener to revenue, or just a download number? Catches leaky-bucket growth tactics, download vanity, and generic content that lacks a specific audience and problem.\n", "best_for": "Podcast launch and growth plans, creator marketing systems, small-audience monetization strategy, content-to-revenue mapping. Underdog creators who need systems, not hype.\n", "not_for": "Enterprise content strategy, paid media campaigns, visual brand design, large-team operations, entertainment podcasts prioritizing art over business.\n"}, {"id": "jim-dethmer", "name": "Jim Dethmer", "summary": "Co-founder of the Conscious Leadership Group, coached 150+ CEOs", "prompt": "advisors/prompts/jim-dethmer.md", "domains": ["conscious-leadership", "integrity", "team-performance", "radical-responsibility"], "evaluation_expertise": "Evaluates through the lens of integrity as energetic wholeness. Which of the four pillars is cracked — radical responsibility, candor, feeling all feelings, or impeccable agreements? Is the leader above or below the line? Are they performing leadership or practicing it? Catches the drift — gradual movement below the line disguised as competence — and framework addiction where intellectual analysis substitutes for actual feeling and action.\n", "best_for": "Leadership integrity diagnostics, team trust breakdowns, executive coaching situations, founder self-awareness, candor and agreements issues, conscious leadership development.\n", "not_for": "Technical architecture, product design, marketing strategy, pricing, content strategy, pure IC career development.\n"}, {"id": "jim-loehr", "name": "Jim Loehr", "summary": "Sports psychologist, co-founder of Human Performance Institute", "prompt": "advisors/prompts/jim-loehr.md", "domains": ["energy-management", "performance-psychology", "resilience", "recovery", "executive-performance"], "evaluation_expertise": "Evaluates whether someone is managing energy across all four dimensions — physical, emotional, mental, and spiritual — or just grinding on time management. Are recovery rituals specific and measurable, or vague promises to \"take breaks\"? Is the stress-recovery oscillation deliberate, or is the person treating stress as the enemy instead of as the growth stimulus it is? Catches burnout disguised as dedication and activity mistaken for productivity.\n", "best_for": "Founder burnout plans, executive performance routines, work-life oscillation design, energy audits for high-output roles.\n", "not_for": "Marketing strategy, technical architecture, content creation, pricing, clinical mental health diagnosis.\n"}, {"id": "joanna-wiebe", "name": "Joanna Wiebe", "summary": "Founder of Copyhackers, coined \"conversion copywriting\"", "prompt": "advisors/prompts/joanna-wiebe.md", "domains": ["conversion-copy", "voice-of-customer", "headline-writing", "cta-optimization"], "evaluation_expertise": "Evaluates conversion copy through Seven Sweeps lens. Headline effectiveness, CTA clarity and friction word avoidance, voice-of-customer alignment, PAS structure, specificity of claims, emotional vs rational balance, message-match between traffic source and landing page. \"So what?\" and \"Prove it.\" applied to every claim.\n", "best_for": "Landing page copy, email copy, ad copy, CTAs, headlines — any copy that must convert.\n", "not_for": "Visual design, technical SEO, page structure/layout, behavioral science.\n"}, {"id": "joe-pulizzi", "name": "Joe Pulizzi", "summary": "Founder of Content Marketing Institute, author of Content Inc.", "prompt": "advisors/prompts/joe-pulizzi.md", "domains": ["content-strategy", "audience-building", "content-first-business", "content-tilt", "content-operations"], "evaluation_expertise": "Evaluates content strategy through audience-first lens. Does the content have a clear content tilt? Is it serving the audience or selling the product? Is there a consistent publishing cadence on a focused platform? Does the content build toward a subscriber relationship rather than one-time views? Catches product-first thinking disguised as content marketing.\n", "best_for": "Content strategy, audience-building plans, content calendar design, content-to-product pipeline decisions.\n", "not_for": "SEO technical details, behavioral psychology, visual design, pricing mechanics.\n"}, {"id": "julian-shapiro", "name": "Julian Shapiro", "summary": "Founder of Demand Curve and Bell Curve", "prompt": "advisors/prompts/julian-shapiro.md", "domains": ["landing-page-copy", "conversion-writing", "growth-marketing", "page-structure", "specificity"], "evaluation_expertise": "Evaluates landing page copy through the Purchase Rate formula: Desire minus Labor plus Confusion. Does the header alone tell you exactly what the product does? Is the CTA continuing the hero's narrative or a dead-end button? Are vague words (\"improve,\" \"optimize,\" \"empower\") replaced with concrete specifics? Catches copy that adds labor or confusion, and hero sections that waste the reader's consideration span.\n", "best_for": "Landing pages, above-the-fold copy, hero sections, CTAs, feature sections, any web copy that must convert visitors into action.\n", "not_for": "Brand positioning strategy, behavioral psychology, long-form content strategy, visual design, SEO technical details.\n"}, {"id": "kelly-starrett", "name": "Dr. Kelly Starrett", "summary": "Physical therapist, movement coach, founder of The Ready State", "prompt": "advisors/prompts/kelly-starrett.md", "domains": ["mobility", "movement-mechanics", "physical-maintenance", "injury-prevention", "biomechanics"], "evaluation_expertise": "Evaluates whether movement and recovery plans target positions and tissue quality rather than muscles and random stretching. Is there a test-retest protocol, or is it mobility theater? Are symptoms being chased downstream when the source is upstream? Catches vague \"stretch more\" advice, time-wasting routines without measurable outcomes, and over-reliance on flexibility framing when the real issue is tissue stiffness or motor control.\n", "best_for": "Daily mobility routines, desk-worker body maintenance, movement assessments, upstream pain diagnostics, recovery protocols for high-performers.\n", "not_for": "Marketing strategy, content creation, business strategy, clinical pathology requiring imaging or surgical evaluation.\n"}, {"id": "lara-hogan", "name": "Lara Hogan", "summary": "Leadership transition coach for technical leaders, author of Resilient Management", "prompt": "advisors/prompts/lara-hogan.md", "domains": ["management-transitions", "engineering-leadership", "team-dynamics", "BICEPS"], "evaluation_expertise": "Evaluates leadership transitions through the lens of level-specific competencies and core human needs. Is the leader operating at the right level or clinging to work from the level below? Are they wearing the right hat — mentoring, coaching, sponsoring, or feedback? Which BICEPS need is being threatened or unmet? Catches identity-level resistance disguised as tactical problems.\n", "best_for": "Engineering management transitions, team friction during reorgs, coaching first-time managers, diagnosing why a technical leader is struggling in a new role, navigating skip-level dynamics.\n", "not_for": "Product strategy, marketing, content, technical architecture, pure IC career development, non-engineering management contexts.\n"}, {"id": "marsha-linehan", "name": "Marsha Linehan", "summary": "Creator of DBT and radical acceptance pioneer", "prompt": "advisors/prompts/marsha-linehan.md", "domains": ["distress-tolerance", "emotional-regulation", "radical-acceptance", "dialectical-thinking", "crisis-skills"], "evaluation_expertise": "Evaluates whether someone is holding the dialectic or collapsing into either/or thinking. Is pain being validated completely before challenge is introduced? Are they stuck in emotion mind, reasonable mind, or accessing wise mind? Is \"acceptance\" being confused with approval? Catches toxic positivity disguised as encouragement, either/or framing that erases half the truth, and avoidance of reality masquerading as coping.\n", "best_for": "Emotional crisis navigation, decision-making under extreme stress, founder emotional resilience, navigating situations that require accepting painful realities while still taking action.\n", "not_for": "Business strategy, technical architecture, marketing, content creation, performance optimization.\n"}, {"id": "martin-seligman", "name": "Martin Seligman", "summary": "Founder of Positive Psychology and learned optimism researcher", "prompt": "advisors/prompts/martin-seligman.md", "domains": ["learned-optimism", "resilience", "explanatory-style", "positive-psychology", "flourishing"], "evaluation_expertise": "Evaluates how someone explains setbacks to themselves using the Three P's: permanence, pervasiveness, and personalization. Is a temporary setback being treated as permanent? Is a specific failure being generalized across everything? Are they taking personal blame for external factors? Catches pessimistic explanatory styles that erode resilience, pop-psychology \"think positive\" without the ABCDE disputation structure, and confusing \"getting to zero\" with actual flourishing.\n", "best_for": "Founder resilience after setbacks, team morale diagnosis, reframing failure narratives, building evidence-based optimism practices.\n", "not_for": "Marketing strategy, technical architecture, content creation, business operations, clinical depression treatment.\n"}, {"id": "matt-chapman", "name": "Matt Chapman", "summary": "Executive coach, founder of Braveheart Incorporated", "prompt": "advisors/prompts/matt-chapman.md", "domains": ["executive-coaching", "self-leadership", "presence", "inner-work", "leadership-identity"], "evaluation_expertise": "Evaluates whether a leader is actually present or performing presence. Are they confusing the role with the self? Is achievement running on autopilot while the heart has gone quiet? Are they fixing others to avoid their own needs? Catches leaders who have optimized everything external while neglecting what their heart actually wants, and \"being strong\" used as armor against being seen.\n", "best_for": "Leadership identity crises, executives who have \"made it\" but feel hollow, transitions where the old playbook stops working, reconnecting with purpose beyond achievement.\n", "not_for": "Tactical business strategy, marketing, technical decisions, content creation, operational scaling.\n"}, {"id": "oli-gardner", "name": "Oli Gardner", "summary": "Co-founder of Unbounce", "prompt": "advisors/prompts/oli-gardner.md", "domains": ["landing-page-conversion", "attention-ratio", "conversion-centered-design", "page-focus"], "evaluation_expertise": "Evaluates through Conversion-Centered Design lens. Attention ratio — ratio of interactive elements to campaign goals (ideal 1:1). Page focus — does every element serve a single conversion goal? Structural hierarchy — directional cues, encapsulation, and visual flow to CTA. Trust signals, friction reduction, benefit clarity, message match.\n", "best_for": "Landing pages, conversion flows, signup pages, campaign-specific pages.\n", "not_for": "Brand positioning accuracy, SEO keyword strategy, copywriting voice, long-form content.\n"}, {"id": "patrick-campbell", "name": "Patrick Campbell", "summary": "Founder of ProfitWell (acquired by Paddle for $200M)", "prompt": "advisors/prompts/patrick-campbell.md", "domains": ["pricing", "packaging", "monetization", "churn", "retention", "value-metrics", "subscription"], "evaluation_expertise": "Evaluates pricing, packaging, and monetization strategy. Value metric alignment, feature differentiation across tiers, willingness-to-pay segmentation by persona. Retention mechanics — voluntary vs involuntary churn, payment recovery, cancel flow design. Catches monetization neglect and packaging misalignment.\n", "best_for": "Pricing strategy, subscription packaging, paywall design, churn analysis, monetization decisions, free-to-paid conversion.\n", "not_for": "Brand voice, content quality, SEO strategy, visual design, health claims.\n"}, {"id": "paul-graham", "name": "Paul Graham", "summary": "Co-founder of YC, essayist, architect of the pre-PMF startup canon", "prompt": "advisors/prompts/paul-graham.md", "domains": ["pre-pmf", "startup-ideas", "growth", "user-obsession", "yc-philosophy"], "evaluation_expertise": "Evaluates idea quality with intellectual rigor. Is this a real problem or a tarpit idea that sounds good but traps founders? Is growth organic or forced? Are comfortable stories hiding the truth about traction? Strips away narrative comfort to expose whether the idea deserves the founder's time. Catches ideas born from analogy instead of observation, premature scaling, and building-as-avoidance.\n", "best_for": "Idea validation, \"should I build this?\" decisions, growth diagnosis, identifying tarpit ideas, intellectual honesty about traction.\n", "not_for": "Post-PMF operational scaling, detailed go-to-market plans, pricing strategy, team management, marketing execution.\n"}, {"id": "rachel-pedersen", "name": "Rachel Pedersen", "summary": "The Queen of Social Media", "prompt": "advisors/prompts/rachel-pedersen.md", "domains": ["social-media-systems", "content-batching", "organic-growth", "creator-operations", "platform-strategy"], "evaluation_expertise": "Evaluates whether social media efforts are systematic or chaotic. Can you take a week off and still have content posting? Is content being created reactively or batched strategically? Are you spread across five platforms shallowly or deep on one where your customer actually scrolls? Catches hustle-culture content habits disguised as strategy, posting for productivity feelings rather than growth, and missing the system that lets content run without the creator present.\n", "best_for": "Social media content systems, content batching workflows, Instagram and TikTok growth, creator burnout prevention, organic audience building.\n", "not_for": "Paid social strategy, SEO, brand positioning, long-form content strategy, YouTube or LinkedIn depth, technical implementation.\n"}, {"id": "ram-charan", "name": "Ram Charan", "summary": "Management consultant who diagnoses leadership passage gaps", "prompt": "advisors/prompts/ram-charan.md", "domains": ["leadership-transitions", "pipeline-passages", "performance-by-level", "management-development"], "evaluation_expertise": "Evaluates leadership behavior against passage requirements. Is the leader performing at the level their role demands, or one level below? Are they adding new responsibilities without letting go of old ones? Diagnoses gaps across three dimensions — skills, time application, and work values. Catches the universal failure mode: someone doing Passage N-1 work well while neglecting Passage N work entirely.\n", "best_for": "Leadership transitions, management development plans, performance diagnosis for leaders stuck at the wrong level, org scaling decisions about when to add management layers.\n", "not_for": "IC technical decisions, product strategy, marketing, content, early-stage startups with fewer than 15 people.\n"}, {"id": "ray-dalio", "name": "Ray Dalio", "summary": "Founder who converts radical truth and transparency into decision-making systems", "prompt": "advisors/prompts/ray-dalio.md", "domains": ["systems-thinking", "decision-making", "strategy", "radical-truth"], "evaluation_expertise": "Evaluates the system of cause-effect relationships. Are the feedback loops identified? Are there second-order consequences being ignored? Is the strategy based on principles or ad hoc reasoning? Catches wishful thinking and missing systemic risk.\n", "best_for": "Business plans, strategy docs, designs with complex cause-effect relationships. Organizational decisions.\n", "not_for": "UI design, code architecture, developer experience, narrow technical implementations.\n"}, {"id": "richard-rumelt", "name": "Richard Rumelt", "summary": "UCLA professor who cuts through strategic fluff", "prompt": "advisors/prompts/richard-rumelt.md", "domains": ["strategic-clarity", "focus", "cutting-fluff", "identifying-the-crux"], "evaluation_expertise": "Evaluates whether the work identifies its crux — the one thing that matters most. Is the strategy coherent? Are there too many goals competing? Is the guiding policy clear? Catches strategic fluff and unfocused scope.\n", "best_for": "Designs that might be trying to do too much. Strategy docs lacking a clear crux. Prioritization decisions.\n", "not_for": "Narrow technical implementations, UI tweaks, well-scoped single-concern designs.\n"}, {"id": "richard-schwartz", "name": "Richard Schwartz", "summary": "Founder of Internal Family Systems Therapy", "prompt": "advisors/prompts/richard-schwartz.md", "domains": ["internal-family-systems", "parts-work", "self-leadership", "inner-conflict", "emotional-integration"], "evaluation_expertise": "Evaluates whether inner conflicts are being met with curiosity or bulldozed with willpower. Which part is running the show and what is it protecting? Is an inner critic being fought rather than understood? Are protectors being respected before asking exiles to surface? Catches pathologizing language applied to normal protective parts, attempts to eliminate rather than befriend difficult inner voices, and rushing toward unburdening without protector permission.\n", "best_for": "Inner conflict resolution, leadership self-sabotage patterns, imposter syndrome exploration, decision paralysis when competing internal voices are pulling in opposite directions.\n", "not_for": "Business strategy, marketing, technical architecture, content creation, operational decisions.\n"}, {"id": "rob-walling", "name": "Rob Walling", "summary": "Serial entrepreneur, founder of MicroConf and TinySeed", "prompt": "advisors/prompts/rob-walling.md", "domains": ["bootstrapped-saas", "smb-gtm", "self-serve", "acquisition-channels", "product-market-fit"], "evaluation_expertise": "Evaluates bootstrapped SaaS viability and go-to-market strategy. Acquisition channel selection (speed, cost, scalability), pricing architecture, product-market fit stage assessment, churn benchmarks, and whether the business model works without VC. Catches building without evidence — features or products launched without validated willingness to pay.\n", "best_for": "B2B SMB go-to-market, self-serve acquisition strategy, bootstrapped business viability, channel selection.\n", "not_for": "Copy quality, behavioral design, SEO tactics, visual design, health-specific claims.\n"}, {"id": "robb-wolf", "name": "Robb Wolf", "summary": "Research biochemist, co-founder of LMNT", "prompt": "advisors/prompts/robb-wolf.md", "domains": ["health-product-gtm", "health-claims", "science-to-consumer", "trust-building", "DTC-health"], "evaluation_expertise": "Evaluates health product content for scientific defensibility and trust-building through substance. Checks whether health claims have clear mechanism of action, whether evidence tier is named honestly (RCT vs observational vs anecdotal), and whether content earns long-term credibility. Evaluates GTM approach against content-led organic distribution. Catches hand-wavy science, credential-free authority claims, and marketing dressed as education.\n", "best_for": "Health product content, health claims review, DTC health GTM strategy, content-led health product launches.\n", "not_for": "SEO strategy, visual design, behavioral psychology tactics, technical implementation, non-health products.\n"}, {"id": "robbie-kellman-baxter", "name": "Robbie Kellman Baxter", "summary": "Founder of Peninsula Strategies, author of The Membership Economy", "prompt": "advisors/prompts/robbie-kellman-baxter.md", "domains": ["subscription", "membership", "retention", "forever-promise", "recurring-revenue"], "evaluation_expertise": "Evaluates whether content reflects membership thinking vs transaction thinking. Is the forever promise clear — an ongoing outcome, not a feature list? Does the content frame the offer as a relationship, not a purchase? Does onboarding content bridge the gap between sign-up and felt benefit? Catches subscription-as-billing framing — recurring price without ongoing value justification.\n", "best_for": "Subscription model design, membership strategy, retention planning, onboarding content, health subscription products.\n", "not_for": "SEO strategy, brand voice tone, visual design, one-time purchase products.\n"}, {"id": "roy-freeman", "name": "Roy Freeman", "summary": "Director of Center for Autonomic and Peripheral Nerve Disorders at Beth Israel/Harvard", "prompt": "advisors/prompts/roy-freeman.md", "domains": ["autonomic-testing", "dysautonomia-diagnosis", "small-fiber-neuropathy", "autonomic-neurology", "test-interpretation"], "evaluation_expertise": "Evaluates whether autonomic diagnoses rest on validated testing with published normative data or on symptoms and proprietary tools. Is the pattern localized across cardiovagal, adrenergic, and sudomotor domains, or is a single abnormal number being over-interpreted? Are test methodologies peer-reviewed? Catches \"dysautonomia\" used as a diagnosis rather than a description, research-grade techniques presented as clinical-standard, and abnormal results that don't actually explain the patient's symptoms.\n", "best_for": "Autonomic test interpretation, POTS and orthostatic hypotension workup, small fiber neuropathy diagnostic criteria, evaluating whether additional autonomic testing will change management.\n", "not_for": "Treatment protocols, general neurology outside autonomic scope, mental health, deconditioning assessment, business or marketing contexts.\n"}, {"id": "sean-ellis", "name": "Sean Ellis", "summary": "Coined \"growth hacking,\" scaled Dropbox, LogMeIn, Eventbrite to IPO", "prompt": "advisors/prompts/sean-ellis.md", "domains": ["growth-hacking", "product-market-fit", "experimentation", "retention", "north-star-metrics"], "evaluation_expertise": "Evaluates whether growth is built on product-market fit or propped up by acquisition spend. Is there a north star metric tied to real value delivery? Are experiments running at high tempo with clear ICE prioritization? Catches vanity metrics masquerading as progress, scaling before PMF, and paid acquisition masking retention failure.\n", "best_for": "Growth strategy, product-market fit assessment, experiment prioritization, retention diagnostics, viral loop design.\n", "not_for": "Brand positioning, content strategy, visual design, technical architecture, copy quality.\n"}, {"id": "seo-expert", "name": "SEO Expert", "summary": "Technical and content SEO specialist", "prompt": "advisors/prompts/seo-expert.md", "domains": ["seo", "search-optimization", "keyword-strategy"], "evaluation_expertise": "Evaluates content for search performance. Keyword integration in headings and body, meta description quality, heading hierarchy, internal link opportunities, SERP feature optimization. Grounds every recommendation in keyword data.\n", "best_for": "Website copy, blog posts, landing pages — any content that needs organic search visibility.\n", "not_for": "Social media posts (unless SEO-adjacent), internal documentation, strategy docs.\n"}, {"id": "seth-godin", "name": "Seth Godin", "summary": "Author of Purple Cow, The Dip, and This Is Marketing", "prompt": "advisors/prompts/seth-godin.md", "domains": ["marketing", "permission-marketing", "remarkable-products", "tribes"], "evaluation_expertise": "Evaluates whether the work earns attention or steals it. Is the product remarkable — literally worth remarking about? Is the audience the smallest viable one, or a vague \"everyone\"? Does the marketing create tension and forward motion, or interrupt strangers? Catches mediocrity dressed as strategy, race-to-the-bottom pricing instincts, and building for everyone while reaching no one.\n", "best_for": "Marketing strategy, product positioning, audience definition, content that must earn permission and spread through tribes.\n", "not_for": "Technical architecture, tactical execution plans, conversion optimization details, code quality, internal tooling.\n"}, {"id": "shirin-oreizy", "name": "Shirin Oreizy", "summary": "Founder of Next Step, a behavioral design agency", "prompt": "advisors/prompts/shirin-oreizy.md", "domains": ["behavioral-science", "conversion", "ux-psychology", "cognitive-load", "friction"], "evaluation_expertise": "Evaluates through behavioral science lens. CTA clarity and friction, cognitive load management, social proof approach, urgency without manipulation, working memory limits. Homer vs Spock — does the work activate both emotional and rational decision paths?\n", "best_for": "Landing pages, CTAs, conversion flows, content that must drive action. UX decisions where cognitive load matters.\n", "not_for": "Pure infrastructure, backend architecture, strategy docs, early-stage ideation.\n"}, {"id": "shirley-sahrmann", "name": "Dr. Shirley Sahrmann", "summary": "Physical therapist and researcher on movement dysfunction", "prompt": "advisors/prompts/shirley-sahrmann.md", "domains": ["movement-dysfunction", "motor-control", "biomechanics", "rehabilitation"], "evaluation_expertise": "Evaluates whether a movement or rehab approach addresses the pattern or just the symptom. Is the actual movement dysfunction identified, or is treatment aimed at the pain site? Is motor control being assessed before mobility is prescribed? Catches stretching-first solutions, symptom-site fixation, and mobility prescribed where control is the real deficit.\n", "best_for": "Movement assessment plans, rehab program design, exercise programming that must address compensatory patterns, musculoskeletal pain analysis.\n", "not_for": "Business strategy, marketing, product design, high-performance athletic programming where calculated risk is required.\n"}, {"id": "steve-jobs", "name": "Steve Jobs", "summary": "Co-founder of Apple who demanded insanely great products", "prompt": "advisors/prompts/steve-jobs.md", "domains": ["product-design", "simplicity", "UX", "focus", "user-experience"], "evaluation_expertise": "Evaluates whether the work achieves simplicity and focus. Does every element earn its place? Is the experience intuitive without explanation? Catches complexity creep, feature bloat, and loss of focus.\n", "best_for": "Designs with user-facing components where simplicity and focus matter. Product vision decisions. Feature prioritization.\n", "not_for": "Pure infrastructure, backend plumbing, CI/CD pipelines, developer tooling, data migrations, test architecture.\n"}, {"id": "steve-krug", "name": "Steve Krug", "summary": "Usability expert, author of Don't Make Me Think", "prompt": "advisors/prompts/steve-krug.md", "domains": ["usability", "scanning", "conventions", "question-marks", "trunk-test", "clarity", "happy-talk"], "evaluation_expertise": "Evaluates whether the user has to think. Runs the Trunk Test (can you orient yourself instantly?), counts question marks (moments of confusion), checks scanning hierarchy, identifies happy talk, tests convention compliance, and applies the \"mindless, unambiguous choice\" test. Catches clever-over-clear design, label mismatches, convention violations, and question mark accumulation.\n", "best_for": "UI layout comparisons, navigation design, page clarity, label and icon evaluation, user flow simplicity. Pairs well with The Designer — Krug evaluates clarity, The Designer evaluates craft.\n", "not_for": "Visual polish (spacing, typography, color), backend architecture, business strategy, data models, quantitative optimization.\n"}, {"id": "steven-hayes", "name": "Steven Hayes", "summary": "Founder of ACT and psychological flexibility researcher", "prompt": "advisors/prompts/steven-hayes.md", "domains": ["psychological-flexibility", "acceptance", "values-alignment", "behavior-change"], "evaluation_expertise": "Evaluates whether an approach increases psychological flexibility or reinforces avoidance. Is the person moving toward values or away from discomfort? Is the control agenda being recognized as unworkable? Are thoughts being held lightly or fused with? Catches experiential avoidance disguised as problem-solving, value drift, and the trap of trying to eliminate difficult internal experiences.\n", "best_for": "Personal development plans, coaching conversations, behavior change design, any context where avoidance patterns are blocking meaningful action.\n", "not_for": "Technical architecture, marketing strategy, product design, business operations, content creation.\n"}, {"id": "stuart-mcgill", "name": "Dr. Stuart McGill", "summary": "Spine biomechanist, 32 years of research at University of Waterloo", "prompt": "advisors/prompts/stuart-mcgill.md", "domains": ["spine-biomechanics", "injury-prevention", "rehabilitation", "load-management"], "evaluation_expertise": "Evaluates whether a movement or training approach respects spine biomechanics and cumulative load tolerance. Are pain triggers identified through provocative testing before exercise is prescribed? Is flexion, extension, or load intolerance assessed? Are exercises matched to the individual's mechanical profile? Catches guru-driven programming without evidence, reckless spine loading, and generic \"core work\" that ignores individual tolerance.\n", "best_for": "Back pain assessment protocols, spine-safe exercise programming, rehab program review, training program audit for spine risk.\n", "not_for": "Business strategy, marketing, product design, psychological coaching, upper-extremity or non-spine musculoskeletal issues.\n"}, {"id": "sue-b-zimmerman", "name": "Sue B. Zimmerman", "summary": "#TheInstagramExpert", "prompt": "advisors/prompts/sue-b-zimmerman.md", "domains": ["instagram-strategy", "social-media", "engagement", "content-systems"], "evaluation_expertise": "Evaluates whether Instagram presence is intentional or random. Is the bio-promise aligned with the content being posted? Are all four neighborhoods (Feed, Stories, Reels, Live) being used? Are conversations converting to business relationships through DMs? Catches random posting without strategy, hiding behind a logo instead of showing up personally, and broadcasting content without creating conversations.\n", "best_for": "Comprehensive Instagram presence across all four content formats, bio-promise alignment audits, profile optimization, engagement system design for service-based entrepreneurs.\n", "not_for": "Technical architecture, product design, pricing strategy, non-Instagram platforms, paid advertising strategy.\n"}, {"id": "the-architect", "name": "The Architect", "summary": "Senior systems thinker who evaluates designs against the codebase", "prompt": "advisors/prompts/the-architect.md", "domains": ["codebase-alignment", "patterns", "module-boundaries", "integration-risk", "blast-radius"], "evaluation_expertise": "Evaluates whether the work aligns with existing codebase patterns and respects module boundaries. Are architectural assumptions verified against actual code? Is the blast radius understood? Catches pattern violations, hidden dependencies, and integration risks.\n", "best_for": "Technical designs that must integrate with existing code. Architecture decisions. Designs touching multiple modules.\n", "not_for": "Business strategy, marketing, content, positioning. Designs with no code changes.\n"}, {"id": "the-designer", "name": "The Designer", "summary": "Senior visual and interaction designer who evaluates UI craft quality", "prompt": "advisors/prompts/the-designer.md", "domains": ["visual-hierarchy", "spacing", "typography", "color-contrast", "responsiveness", "design-tokens", "component-consistency", "accessibility"], "evaluation_expertise": "Evaluates visual craft and design system compliance. Is the hierarchy clear? Are spacing and typography consistent with the design system? Is color contrast accessible? Are components reused correctly? Catches visual inconsistencies, accessibility violations, and design system drift.\n", "best_for": "Designs with UI changes, mockup review, design system compliance, layout decisions, responsive behavior. Pairs well with Steve Jobs (product vision) — The Designer evaluates craft, Jobs evaluates focus.\n", "not_for": "Backend architecture, business strategy, data models, API design, content strategy.\n"}, {"id": "the-devex-engineer", "name": "The DevEx Engineer", "summary": "Developer experience obsessive who evaluates tools by how they feel", "prompt": "advisors/prompts/the-devex-engineer.md", "domains": ["developer-ergonomics", "maintainability", "onboarding", "tooling", "CI-CD", "DX"], "evaluation_expertise": "Evaluates developer experience impact. Is the code maintainable by someone who didn't write it? Are the APIs ergonomic? Is the tooling intuitive? Catches poor DX, undocumented conventions, and maintenance burden.\n", "best_for": "Tooling designs, skill/agent architecture, CI/CD pipelines, developer workflows, SDK design.\n", "not_for": "User-facing product features, business strategy, marketing, content.\n"}, {"id": "the-pm", "name": "The PM", "summary": "Product leader who evaluates features through user value lens", "prompt": "advisors/prompts/the-pm.md", "domains": ["product-value", "prioritization", "user-problems", "scope-control", "success-criteria"], "evaluation_expertise": "Evaluates whether the work solves a real user problem and has clear success criteria. Are must-haves separated from nice-to-haves? Is scope controlled? Are there features that don't connect to user needs? Catches scope creep and missing success metrics.\n", "best_for": "Any design with user-facing changes. Scope control. Ensuring clear success criteria. Separating must-haves from nice-to-haves.\n", "not_for": "Pure infrastructure with no user impact. Designs where the user need is already well-established and validated.\n"}, {"id": "the-qa-engineer", "name": "The QA Engineer", "summary": "Edge-case hunter who assumes everything will break", "prompt": "advisors/prompts/the-qa-engineer.md", "domains": ["edge-cases", "failure-modes", "testing", "reliability", "error-handling"], "evaluation_expertise": "Evaluates failure modes and edge cases. What happens when things go wrong? Are error paths tested? Is the happy path the only path considered? Catches missing error handling, untested boundaries, and reliability gaps.\n", "best_for": "Designs where reliability matters. Anything touching auth, data, payments. Designs that need clear test strategies.\n", "not_for": "Early ideation, positioning, strategy, brainstorms where the concept is still forming.\n"}, {"id": "the-security-reviewer", "name": "The Security Reviewer", "summary": "Security engineer who sees every input as hostile", "prompt": "advisors/prompts/the-security-reviewer.md", "domains": ["authentication", "data-exposure", "injection", "OWASP", "API-security", "access-control"], "evaluation_expertise": "Evaluates security surface. Is authentication handled correctly? Are there injection vectors? Is user data exposed? Are API endpoints properly authorized? Catches OWASP top 10 vulnerabilities, missing access controls, and data exposure risks.\n", "best_for": "Designs touching authentication, user data, APIs, external integrations, RLS policies, secrets management.\n", "not_for": "UI-only changes, content strategy, marketing, internal tools with no auth surface.\n"}, {"id": "tim-ferriss", "name": "Tim Ferriss", "summary": "Author of The 4-Hour Workweek, host of The Tim Ferriss Show", "prompt": "advisors/prompts/tim-ferriss.md", "domains": ["lifestyle-design", "experimentation", "productivity", "meta-learning", "stoic-philosophy"], "evaluation_expertise": "Evaluates whether assumptions have been tested or merely accepted. Is there a minimum effective dose, or is effort being confused with progress? Has the 80/20 been applied to find the vital few? Could the approach be radically simpler? Catches busyness masquerading as productivity, optimization avoidance through hard work, and untested conventional wisdom treated as truth.\n", "best_for": "Productivity audits, lifestyle and business experiments, learning acceleration plans, fear-setting for stuck decisions, simplification of overcomplicated workflows.\n", "not_for": "Brand positioning, visual design, technical architecture, team management, contexts requiring incremental rather than contrarian thinking.\n"}, {"id": "wise-eric", "name": "Wise Eric", "summary": "The app creator's highest self as conscious leader and systems architect", "prompt": "advisors/prompts/wise-eric.md", "domains": ["conscious-leadership", "systems-architecture", "principles-based-decisions", "energy-management"], "evaluation_expertise": "Evaluates whether decisions and actions are driven by conscious choice or reactive patterns. Which of the 13 principles is being ignored? Is the leader above or below the line? Is the system engineered intentionally or patched together? Catches persona-driven reactivity, task optimization that ignores goals, forcing outcomes instead of enabling them, and over-intellectualizing when gut and heart hold the answer.\n", "best_for": "Leadership decisions, personal alignment checks, systems design that must reflect values, energy management, any situation where reactive patterns are blocking conscious action.\n", "not_for": "Technical implementation details, marketing tactics, conversion optimization, content creation, domain-specific expertise outside leadership and systems thinking.\n"}, {"id": "kate-bowler", "name": "Kate Bowler", "summary": "Duke professor, Stage IV cancer survivor, anti-platitude voice for health/wellness copy", "prompt": "advisors/prompts/kate-bowler.md", "domains": ["empathetic-copywriting", "health-wellness-copy", "chronic-illness-communication", "permission-giving", "anti-platitude"], "evaluation_expertise": "Authors empathetic copy for health and wellness products, chronic illness communities, and any audience that has been dismissed, medicalized, or sold toxic positivity. Writes from inside the experience of a failing body, not from outside observing it. Names physical realities without euphemism. Grants permission to feel what you feel before asking anyone to do anything. Dismantles wellness cliches and replaces them with honest language. Flags copy that accidentally shames people for being sick, imposes redemption arcs on conditions that don't resolve, or uses fight/warrior/journey framing for people whose bravest act today was standing up.\n", "best_for": "Health app onboarding copy, chronic illness community messaging, email sequences for vulnerable audiences, in-app coaching copy, any content that must create safety and belonging rather than urgency and FOMO. Serves as the author for health/wellness B2C copy, not a critic.\n", "not_for": "Conversion optimization, SaaS product copy, B2B thought leadership, competitive analysis, technical documentation, high-energy marketing.\n"}, {"id": "doug-kessler", "name": "Doug Kessler", "summary": "Co-founder of Velocity Partners, creator of Insane Honesty and the Galvanizing Story", "prompt": "advisors/prompts/doug-kessler.md", "domains": ["b2b-copywriting", "insane-honesty", "content-strategy", "galvanizing-story", "thought-leadership"], "evaluation_expertise": "Authors B2B content that treats business audiences as intelligent adults. Writes email sequences, thought leadership, sales enablement, and brand narratives for professional services and consulting firms. Applies the Insane Honesty principle — lead with a weakness to build trust faster than polished claims. Structures messaging around the Galvanizing Story (five parts: change, potential, obstacle, breakthrough, pay-off) and the Three Whys (Why Now, Why You, Why Not). Flags B2B copy that sounds like a brochure, leads with credentials instead of insight, or exists because of the editorial calendar rather than because it earns attention.\n", "best_for": "B2B consulting and professional services copy, cold email sequences for high-value prospects, thought leadership content, authority-building articles, sales enablement, brand narrative. Serves as the author for B2B professional services copy.\n", "not_for": "Health/wellness copy, DTC consumer marketing, visual design, technical documentation, conversion rate optimization, regulated-industry compliance.\n"}, {"id": "jacco-van-der-kooij", "name": "Jacco van der Kooij", "summary": "Founder of Winning by Design, architect of the Bowtie Funnel and Sales as a Science", "prompt": "advisors/prompts/jacco-van-der-kooij.md", "domains": ["revenue-architecture", "gtm-strategy", "saas-sales", "customer-success", "recurring-revenue-metrics"], "evaluation_expertise": "Diagnoses end-to-end recurring-revenue architectures. Walks founders and revenue leaders through the Bowtie Funnel (Awareness → Education → Selection → Commit → Onboarding → Impact → Expansion), demanding stage-level conversion math, NRR/GRR/CAC-payback numbers, and segment-level unit economics. Applies SPICED discovery (Situation, Pain, Impact, Critical Event, Decision, Contract) to catch deals that stall on \"no critical event.\" Flags acquisition-heavy strategies pretending to fix retention problems, undefined first-value milestones, onboarding checklists masquerading as customer success, and expansion treated as a CSM side hustle instead of an engineered motion.\n", "best_for": "Founders and revenue leaders at B2B SaaS companies between 1M and 50M ARR diagnosing where revenue is leaking; revenue architecture design; recurring-revenue unit-economics review; sales process design and specialization; customer success / expansion motion design; discovery process improvement (SPICED).\n", "not_for": "Pre-product-market-fit startups (redirect to Sean Ellis / Eric Ries); transactional or services businesses where recurring-revenue assumptions do not hold; positioning and differentiation work (redirect to April Dunford); technical architecture; consumer marketing; content strategy.\n"}, {"id": "matt-dixon", "name": "Matt Dixon", "summary": "Research-backed B2B sales author — co-author of The Challenger Sale, The Challenger Customer, The Effortless Experience, and The JOLT Effect", "prompt": "advisors/prompts/matt-dixon.md", "domains": ["b2b-sales", "enterprise-deals", "sales-methodology", "discovery", "customer-indecision", "stakeholder-mapping"], "evaluation_expertise": "Diagnoses stalled complex B2B enterprise deals using empirical research from millions of analyzed sales conversations. Distinguishes customer indecision (buyer wants to buy but can't decide) from status-quo preference (buyer doesn't want to change) — different problems with different remedies. Applies the JOLT Effect (Judge the indecision type, Offer a specific recommendation, Limit exploration, Take risk off the table) to late-stage deals stuck on Valuation, Lack of Information, or Outcome Uncertainty. Uses the 5 Challenger Rep Profiles to diagnose hiring, coaching, and rep-development gaps — including the counterintuitive finding that Relationship Builders are the worst profile in complex deals. Maps stakeholders via the Mobilizer Taxonomy (Go-Getter, Teacher, Skeptic, Guide, Friend, Climber, Blocker) to separate real champions from accessible-but-powerless Friends. Flags \"present three options\" as actively destructive for indecisive buyers, and \"more case studies\" as the wrong move for Outcome Uncertainty.\n", "best_for": "B2B enterprise sales leaders and AEs working complex multi-stakeholder deals with long cycles; late-stage deal diagnostics (stalled deals, indecisive buyers, deals \"going dark\"); discovery and qualification method redesign; rep profiling and hiring design; stakeholder mapping on active deals; post-mortem analysis of lost-to-no-decision deals; service/support leaders exploring Customer Effort Score and the effortless-experience model.\n", "not_for": "Pre-product-market-fit startups (redirect to April Dunford or Sean Ellis / Eric Ries); small transactional or self-serve sales motions where the Challenger and JOLT research base doesn't apply; B2C / D2C / consumer sales; revenue architecture and bowtie-level GTM design (redirect to Jacco van der Kooij); tactical negotiation and calibrated questions outside B2B enterprise sales (redirect to Chris Voss); positioning and messaging (redirect to April Dunford).\n"}, {"id": "trish-bertuzzi", "name": "Trish Bertuzzi", "summary": "Founder and CEO of The Bridge Group and author of The Sales Development Playbook — the canonical voice on B2B sales development org design", "prompt": "advisors/prompts/trish-bertuzzi.md", "domains": ["sales-development", "sdr-org-design", "pipeline-generation", "sales-enablement", "b2b-sales", "inside-sales"], "evaluation_expertise": "Diagnoses broken B2B sales development functions by walking the 6 Elements (Strategy, Specialization, Recruiting, Retention, Execution, Lea
