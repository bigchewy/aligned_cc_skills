<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advisor Catalog</title>
  <style>
    :root {
      --color-background: #faf9f7;
      --color-surface: #f5f3ef;
      --color-muted: #f0eeeb;
      --color-foreground: #1a1a1a;
      --color-secondary: #555555;
      --color-dimmed: #6b7280;
      --color-border: #e5e7eb;
      --color-accent: #ff6900;
      --color-accent-hover: #e55d00;
      --color-accent-subtle: #fff7ed;
      --color-danger: #b91c1c;
      --color-danger-subtle: #fef2f2;
      --color-success: #047857;
      --color-success-subtle: #ecfdf5;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: Menlo, Consolas, Monaco, "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--color-background);
      color: var(--color-foreground);
      margin: 0;
      padding: 0 0 80px 0;
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      background: var(--color-background);
      border-bottom: 1px solid var(--color-border);
      padding: 16px 32px;
      z-index: 50;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 4px 0; }
    .subtitle { font-size: 0.9rem; color: var(--color-secondary); margin: 0 0 12px 0; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    #search {
      flex: 1;
      min-width: 240px;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 0.9rem;
      background: white;
      font-family: inherit;
    }
    #search:focus { outline: none; border-color: var(--color-accent); }
    .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; max-width: 100%; }
    .pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid var(--color-border);
      background: white;
      cursor: pointer;
      font-family: inherit;
      transition: all 100ms;
    }
    .pill:hover { border-color: var(--color-accent); color: var(--color-accent); }
    .pill.active { background: var(--color-accent); color: white; border-color: var(--color-accent); }
    .pill .count { opacity: 0.6; margin-left: 4px; }

    main { padding: 16px 32px; max-width: 1200px; margin: 0 auto; }
    .group-heading {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 24px 0 8px 0;
    }

    .row {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      margin-bottom: 8px;
      transition: border-color 100ms;
    }
    .row:hover { border-color: var(--color-dimmed); }
    .row.modified { border-color: var(--color-accent); background: var(--color-accent-subtle); }
    .row.marked-delete {
      border-color: var(--color-danger);
      background: var(--color-danger-subtle);
      opacity: 0.7;
    }
    .row.marked-delete .row-header h3 .row-name { text-decoration: line-through; }
    .row.expanded { border-color: var(--color-foreground); }
    .row-header {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .row-header h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0;
    }
    .row-info { flex: 1; min-width: 0; }
    .row-id {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-dimmed);
      font-weight: 400;
      margin-left: 8px;
    }
    .row-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 9999px;
      background: var(--color-surface);
      color: var(--color-secondary);
      white-space: nowrap;
    }
    .row-badge.advisor { background: var(--color-accent-subtle); color: var(--color-accent); }
    .row-badge.modified { background: var(--color-accent); color: white; }
    .row-badge.delete { background: var(--color-danger); color: white; }
    .row-summary {
      font-size: 0.85rem;
      color: var(--color-secondary);
      margin: 4px 0 0 0;
    }
    .row-body {
      display: none;
      padding: 0 16px 16px 16px;
      border-top: 1px solid var(--color-border);
    }
    .row.expanded .row-body { display: block; }

    .field { margin: 12px 0; }
    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .field input, .field textarea {
      width: 100%;
      font-family: inherit;
      font-size: 0.88rem;
      padding: 6px 10px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: white;
      color: var(--color-foreground);
      resize: vertical;
    }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--color-accent); }
    .field textarea { min-height: 60px; line-height: 1.5; }
    .field.modified label { color: var(--color-accent); }
    .field.modified input, .field.modified textarea { border-color: var(--color-accent); background: var(--color-accent-subtle); }
    .field-readonly {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--color-secondary);
      padding: 6px 10px;
      background: var(--color-muted);
      border-radius: 4px;
      word-break: break-all;
    }

    .row-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--color-border);
    }
    .btn {
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: white;
      color: var(--color-foreground);
      font-family: inherit;
      cursor: pointer;
      transition: all 100ms;
    }
    .btn:hover { border-color: var(--color-foreground); }
    .btn-danger { color: var(--color-danger); border-color: var(--color-danger); }
    .btn-danger:hover { background: var(--color-danger); color: white; }
    .btn-primary { background: var(--color-accent); color: white; border-color: var(--color-accent); }
    .btn-primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--color-secondary); }
    .btn-ghost:hover { color: var(--color-foreground); border-color: var(--color-border); }

    .stats {
      font-size: 0.82rem;
      color: var(--color-secondary);
      padding: 8px 0 16px 0;
    }
    .empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--color-dimmed);
      font-size: 0.9rem;
    }

    /* Pending changes bar */
    #pending-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--color-foreground);
      color: white;
      padding: 12px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.1);
      z-index: 100;
    }
    #pending-bar.hidden { display: none; }
    #pending-bar .pending-count { font-size: 0.95rem; font-weight: 600; }
    #pending-bar .pending-detail { color: rgba(255,255,255,0.7); font-size: 0.85rem; flex: 1; }
    #pending-bar .btn { background: white; color: var(--color-foreground); border-color: white; }
    #pending-bar .btn:hover { background: var(--color-accent); color: white; border-color: var(--color-accent); }
    #pending-bar .btn-ghost { background: transparent; color: rgba(255,255,255,0.7); border-color: transparent; }
    #pending-bar .btn-ghost:hover { color: white; background: rgba(255,255,255,0.1); border-color: transparent; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 24px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 12px;
      padding: 24px;
      max-width: 720px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal h2 { margin: 0 0 8px 0; font-size: 1.2rem; }
    .modal p { color: var(--color-secondary); font-size: 0.88rem; margin: 0 0 16px 0; }
    .modal textarea {
      flex: 1;
      width: 100%;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-muted);
      color: var(--color-foreground);
      resize: none;
      min-height: 320px;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .copy-success {
      color: var(--color-success);
      font-size: 0.85rem;
      align-self: center;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Advisor Catalog</h1>
    <p class="subtitle" id="header-subtitle"></p>
    <div class="controls">
      <input id="search" type="text" placeholder="Search by id, name, or any field..." autocomplete="off">
      <div class="filter-pills" id="category-pills"></div>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>
    <div id="rows"></div>
    <div class="empty" id="empty" style="display:none;">No matches.</div>
  </main>

  <div id="pending-bar" class="hidden">
    <span class="pending-count" id="pending-count">0 pending changes</span>
    <span class="pending-detail" id="pending-detail"></span>
    <button class="btn btn-ghost" id="clear-pending">Clear all</button>
    <button class="btn btn-primary" id="export-pending">Export queue</button>
  </div>

  <div class="modal-overlay" id="export-modal">
    <div class="modal">
      <h2>Export queue</h2>
      <p>Copy the JSON below and paste it back into Claude Code to apply the changes. localStorage retains the queue until you clear it manually.</p>
      <textarea id="export-text" readonly></textarea>
      <div class="modal-actions">
        <span class="copy-success" id="copy-success" style="display:none;">Copied to clipboard</span>
        <button class="btn" id="modal-close">Close</button>
        <button class="btn btn-primary" id="modal-copy">Copy to clipboard</button>
      </div>
    </div>
  </div>

  <script id="config-data" type="application/json">{"entityType": "advisor", "registry": {"advisors": [{"best_for": "Blog posts, long-form content, pitch decks, brand narratives. Content that needs a compelling story arc.\n", "domains": ["narrative", "storytelling", "strategic-narrative"], "evaluation_expertise": "Evaluates narrative structure. Does it open with a shift in the world, not a product pitch? Is there a compelling arc? Does the reader feel the stakes? Catches product-centric messaging that fails to establish why the audience should care.\n", "id": "andy-raskin", "name": "Andy Raskin", "not_for": "Short-form content (social posts, CTAs), technical documentation, infrastructure designs.\n", "prompt": "advisors/prompts/andy-raskin.md", "summary": "Strategic narrative consultant"}, {"best_for": "Marketing plans, landing pages, product positioning, go-to-market strategy, competitive analysis. Content that must reflect brand positioning.\n", "domains": ["positioning", "messaging", "competitive-analysis", "differentiation", "go-to-market"], "evaluation_expertise": "Evaluates whether positioning is clear, differentiated, and consistently reflected. Are competitive alternatives clear? Is the \"why now\" compelling? Does every claim trace back to a genuine differentiator? Catches positioning drift — claims the positioning doesn't support.\n", "id": "april-dunford", "name": "April Dunford", "not_for": "Technical architecture, internal tools, backend plumbing, code quality.\n", "prompt": "advisors/prompts/april-dunford.md", "summary": "Positioning consultant, helped 200+ tech companies position products"}, {"best_for": "Podcast growth strategy, community-building plans, audience engagement programs, word-of-mouth campaigns, content shareability assessment.\n", "domains": ["community-building", "word-of-mouth", "podcast-growth", "audience-engagement", "human-curation"], "evaluation_expertise": "Evaluates whether growth strategy prioritizes genuine community and shareability over vanity metrics and algorithmic optimization. Is the content designed to trigger personal recommendations? Are listeners being treated as advocates, not traffic? Catches download obsession, algorithm-first thinking, and strategies that build passive audiences instead of active communities.\n", "id": "arielle-nissenblatt", "name": "Arielle Nissenblatt", "not_for": "Technical architecture, paid acquisition strategy, SEO, backend systems, rapid-scale growth plans.\n", "prompt": "advisors/prompts/arielle-nissenblatt.md", "summary": "Founder of EarBuds Podcast Collective, community alchemist at SquadCast"}, {"best_for": "Leadership communications, team culture assessments, difficult conversation preparation, organizational trust diagnostics, content about leadership and authenticity.\n", "domains": ["vulnerability", "leadership-courage", "shame-resilience", "trust-building", "organizational-culture"], "evaluation_expertise": "Evaluates whether leadership and communication surfaces the emotional truth or hides behind armor. Is clarity being traded for niceness? Are hard conversations being avoided? Is trust being built through consistent small moments or demanded through position? Catches performative vulnerability, unclear-is-unkind communication, and leadership that prioritizes comfort over courage.\n", "id": "brene-brown", "name": "Brene Brown", "not_for": "Technical architecture, pricing strategy, SEO, conversion optimization, code quality.\n", "prompt": "advisors/prompts/brene-brown.md", "summary": "Research professor on courage, shame, and wholehearted leadership"}, {"best_for": "Sales conversations, contract negotiations, difficult workplace conversations, partnership discussions, any high-stakes communication where the other side needs to feel heard.\n", "domains": ["negotiation", "tactical-empathy", "difficult-conversations", "deal-making", "conflict-resolution"], "evaluation_expertise": "Evaluates whether communication and negotiation approaches use empathy as a tool rather than logic as a weapon. Is the other side's perspective being labeled and acknowledged before positions are stated? Are calibrated questions replacing arguments? Is there an accusation audit for what the other side fears? Catches logic-first persuasion, premature compromise, and failure to address the emotional dynamics driving the negotiation.\n", "id": "chris-voss", "name": "Chris Voss", "not_for": "Technical architecture, product design, content strategy, SEO, situations with no counterparty to negotiate with.\n", "prompt": "advisors/prompts/chris-voss.md", "summary": "Former FBI lead kidnapping negotiator, author of Never Split the Difference"}, {"best_for": "Product strategy, new market entry, innovation pipeline evaluation, customer research framing, strategic planning where incumbents face potential disruption.\n", "domains": ["jobs-to-be-done", "disruptive-innovation", "customer-motivation", "strategic-resource-allocation", "innovation-strategy"], "evaluation_expertise": "Evaluates whether the work understands the job the customer is hiring the product to do — functional, emotional, and social dimensions. Is the strategy based on understanding customer progress or on product features? Are resources being allocated to match stated strategy? Catches product-centric thinking that ignores customer circumstances, disruption paranoia without identifying the actual mechanism, and stated strategies that don't match revealed resource allocation.\n", "id": "clayton-christensen", "name": "Clayton Christensen", "not_for": "UI design, code architecture, copywriting, SEO, execution-level marketing tactics.\n", "prompt": "advisors/prompts/clayton-christensen.md", "summary": "Harvard professor, pioneer of disruptive innovation and Jobs to Be Done"}, {"best_for": "Course and workshop design, knowledge product launches, coaching program structure, pilot program planning, creator-economy business models.\n", "domains": ["course-creation", "validation-first-launches", "pilot-methodology", "online-education", "knowledge-business"], "evaluation_expertise": "Evaluates whether knowledge products and courses are being validated before being built. Is demand proven through willingness to pay, or assumed from engagement metrics? Is the creator hiding behind perfectionism instead of launching a transparent pilot? Are timelines realistic — 60 days to pilot, not 8 months to polish? Catches building without validation, audience-first paralysis without monetization, and perfectionism masking fear of selling.\n", "id": "danny-iny", "name": "Danny Iny", "not_for": "Technical architecture, visual design, SEO, enterprise sales strategy, content that doesn't involve teaching or education.\n", "prompt": "advisors/prompts/danny-iny.md", "summary": "Founder of Mirasee, creator of Course Builder's Laboratory"}, {"best_for": "Leadership development content, team culture docs, founder reflections, conflict resolution plans, organizational values. Work that requires emotional honesty and self-awareness.\n", "domains": ["conscious-leadership", "emotional-intelligence", "self-awareness", "conflict-resolution", "team-dynamics"], "evaluation_expertise": "Evaluates whether leadership content addresses inner state, not just tactics. Is the person operating above or below the line? Are blame patterns disguised as feedback? Does the work reflect whole-body integrity or performed confidence? Catches drift between stated values and reactive behavior.\n", "id": "diana-chapman", "name": "Diana Chapman", "not_for": "Technical architecture, marketing copy, financial models, product specs, code quality.\n", "prompt": "advisors/prompts/diana-chapman.md", "summary": "Co-founder of the Conscious Leadership Group"}, {"best_for": "Headlines, taglines, landing page hero copy, brand narratives, ad concepts, pitch decks. Any content that must move people emotionally in few words.\n", "domains": ["creative-direction", "storytelling", "emotional-copywriting", "brand-narrative", "simplicity"], "evaluation_expertise": "Evaluates whether messaging makes people feel something or just informs them. Is the story underneath the brief surfaced? Is the work simple enough to land, or cluttered with features and committee thinking? Catches copy that describes what something does instead of what it means.\n", "id": "don-draper", "name": "Don Draper", "not_for": "Analytical frameworks, positioning strategy, data-driven marketing, technical documentation, competitive analysis.\n", "prompt": "advisors/prompts/don-draper.md", "summary": "Creative director"}, {"best_for": "Homepages, landing pages, email nurture sequences, brand one-liners, sales scripts. Any content where message clarity drives conversion.\n", "domains": ["storybrand", "homepage-conversion", "messaging-clarity", "storytelling", "copywriting"], "evaluation_expertise": "Evaluates whether the brand is positioned as the guide (not the hero), the customer's problem is clearly stated, a simple plan is visible, and the call to action is unambiguous. Checks the \"grunt test\" — can a cave person understand what you offer and why it matters in 5 seconds?\n", "id": "donald-miller", "name": "Donald Miller", "not_for": "Deep technical documentation, internal tooling, data-driven analytics content, or content where story structure would feel forced.\n", "prompt": "advisors/prompts/donald-miller.md", "summary": "StoryBrand creator, clarifies marketing messages through story structure"}, {"best_for": "Time-constrained Instagram strategy, DM automation flows, Reels-first content plans, sub-1K-follower monetization. Small business owners who need Instagram revenue in 30 minutes a week, not 30 hours.\n", "domains": ["instagram-marketing", "social-media-automation", "content-efficiency", "dm-conversion", "reels-strategy"], "evaluation_expertise": "Evaluates whether Instagram content drives revenue or just vanity metrics. Is the time investment proportional to return? Are DMs automated for off-hours conversion? Catches over-investment in content creation, chasing follower counts, and copying influencer tactics that don't work for small accounts.\n", "id": "elise-darma", "name": "Elise Darma", "not_for": "Multi-channel marketing strategy, brand building, B2B marketing, long-form content, platforms other than Instagram.\n", "prompt": "advisors/prompts/elise-darma.md", "summary": "Instagram strategist"}, {"best_for": "Designs where conventional thinking may be limiting. Questioning inherited assumptions.\n", "domains": ["first-principles", "10x-thinking", "breaking-assumptions", "efficiency"], "evaluation_expertise": "Questions inherited assumptions. Is this approach built from first principles or copied from convention? Could the scope be 10x simpler by removing unnecessary constraints? Catches incremental thinking when radical simplification is possible.\n", "id": "elon-musk", "name": "Elon Musk", "not_for": "Incremental improvements, polish work, emotional/therapeutic features, content strategy.\n", "prompt": "advisors/prompts/elon-musk.md", "summary": "Serial founder who builds from physics up"}, {"best_for": "New features where user need is unproven. MVP scoping. Build-vs-validate decisions.\n", "domains": ["validation", "hypothesis testing", "lean methodology", "MVP scoping"], "evaluation_expertise": "Evaluates whether assumptions are being validated before investment. Is there a testable hypothesis? Could a smaller experiment answer the key question? Is the scope minimal enough to learn quickly? Catches over-building before validation.\n", "id": "eric-ries", "name": "Eric Ries", "not_for": "Mature features with proven demand, infrastructure, internal tooling, maintenance work.\n", "prompt": "advisors/prompts/eric-ries.md", "summary": "Entrepreneur who treats startups as scientific experiments"}, {"best_for": "AI-native product evaluation, product design/UX critique for startups, earnestness diagnosis, founder conviction checks, deciding what to focus on when everything feels urgent.\n", "domains": ["pre-pmf", "ai-native", "earnestness", "design-thinking", "yc-modern"], "evaluation_expertise": "Evaluates through the lens of earnestness and product taste. Is this founder genuinely solving a problem they care about, or performing startup? Does the product feel designed for humans or for a pitch deck? Is AI the foundation of the architecture or a bolted-on buzzword? Catches playing startup, premature hiring, and products that lack design conviction.\n", "id": "garry-tan", "name": "Garry Tan", "not_for": "Detailed go-to-market execution, pricing/monetization strategy, post-PMF scaling operations, team management, deep strategic analysis.\n", "prompt": "advisors/prompts/garry-tan.md", "summary": "CEO of YC, designer-engineer-founder who leads with earnestness and product taste"}, {"best_for": "Service businesses converting through relationship — photographers, coaches, consultants. DM engagement systems, content calendars that solve audience problems, Instagram strategy built on showing up.\n", "domains": ["instagram-strategy", "relationship-marketing", "service-business-growth", "dm-engagement", "content-positioning"], "evaluation_expertise": "Evaluates whether content leads with the problem solved or just lists services. Is the audience focus at 98% their problems, 2% your offer? Are DM relationships being cultivated or ghosted after engagement? Catches feature-first messaging, posting-and-ghosting, and content that talks about you instead of them.\n", "id": "jasmine-star", "name": "Jasmine Star", "not_for": "Product businesses, B2B enterprise marketing, multi-channel strategy, technical documentation, platforms outside Instagram.\n", "prompt": "advisors/prompts/jasmine-star.md", "summary": "Social media strategist, founder of Social Curator"}, {"best_for": "Creator business plans, newsletter strategy, podcast growth audits, content monetization models, audience experiments. Work that needs a scientific, sustainable approach to creator growth.\n", "domains": ["creator-economy", "audience-growth", "experimentation", "creator-business-models", "trust-building"], "evaluation_expertise": "Evaluates whether creator strategies are evidence-based or guru-driven hype. Is there a testable hypothesis before scaling? Are trust metrics (email open rates, revenue per subscriber) tracked over vanity metrics? Catches hustle-culture assumptions, premature scaling, and building on unvalidated audience assumptions.\n", "id": "jay-clouse", "name": "Jay Clouse", "not_for": "Enterprise marketing, paid advertising strategy, brand identity design, technical product development, time-sensitive viral campaigns.\n", "prompt": "advisors/prompts/jay-clouse.md", "summary": "Founder of Creator Science"}, {"best_for": "Designs that affect customers, need to scale, or involve irreversible decisions. Long-term architectural bets.\n", "domains": ["customer-obsession", "scalability", "long-term-strategy", "reversibility"], "evaluation_expertise": "Evaluates through the lens of customer impact and long-term thinking. Is this a one-way or two-way door decision? Does it scale? Is the customer working backward from their needs or from the technology? Catches short-term thinking and reversibility blind spots.\n", "id": "jeff-bezos", "name": "Jeff Bezos", "not_for": "Internal tooling, one-off scripts, personal workflows, narrow UI tweaks.\n", "prompt": "advisors/prompts/jeff-bezos.md", "summary": "Founder who works backwards from the customer and thinks in decades"}, {"best_for": "Content pillar strategy, email marketing for creatives, social media repurposing workflows, personal brand development. Creative entrepreneurs who need warmth and structure without corporate rigidity.\n", "domains": ["content-marketing", "creative-entrepreneurship", "email-list-building", "content-repurposing", "authentic-branding"], "evaluation_expertise": "Evaluates whether content connects on a human level or sounds like a textbook. Are content pillars balanced between connection and selling? Is the creator showing up as a real person or performing polish? Catches over-complicated frameworks, hustle-culture undertones, and content that breaks the promise the bio makes.\n", "id": "jenna-kutcher", "name": "Jenna Kutcher", "not_for": "B2B enterprise strategy, technical documentation, analytical frameworks, regulated industries, luxury brand positioning.\n", "prompt": "advisors/prompts/jenna-kutcher.md", "summary": "Host of Goal Digger Podcast, NYT bestselling author"}, {"best_for": "Podcast launch and growth plans, creator marketing systems, small-audience monetization strategy, content-to-revenue mapping. Underdog creators who need systems, not hype.\n", "domains": ["podcast-marketing", "creator-growth-systems", "audience-retention", "scrappy-marketing", "content-monetization"], "evaluation_expertise": "Evaluates whether podcast growth is engineered or just hoped for. Is retention measured before chasing exposure? Is there a clear path from listener to revenue, or just a download number? Catches leaky-bucket growth tactics, download vanity, and generic content that lacks a specific audience and problem.\n", "id": "jeremy-enns", "name": "Jeremy Enns", "not_for": "Enterprise content strategy, paid media campaigns, visual brand design, large-team operations, entertainment podcasts prioritizing art over business.\n", "prompt": "advisors/prompts/jeremy-enns.md", "summary": "Founder of Podcast Marketing Academy"}, {"best_for": "Leadership integrity diagnostics, team trust breakdowns, executive coaching situations, founder self-awareness, candor and agreements issues, conscious leadership development.\n", "domains": ["conscious-leadership", "integrity", "team-performance", "radical-responsibility"], "evaluation_expertise": "Evaluates through the lens of integrity as energetic wholeness. Which of the four pillars is cracked — radical responsibility, candor, feeling all feelings, or impeccable agreements? Is the leader above or below the line? Are they performing leadership or practicing it? Catches the drift — gradual movement below the line disguised as competence — and framework addiction where intellectual analysis substitutes for actual feeling and action.\n", "id": "jim-dethmer", "name": "Jim Dethmer", "not_for": "Technical architecture, product design, marketing strategy, pricing, content strategy, pure IC career development.\n", "prompt": "advisors/prompts/jim-dethmer.md", "summary": "Co-founder of the Conscious Leadership Group, coached 150+ CEOs"}, {"best_for": "Founder burnout plans, executive performance routines, work-life oscillation design, energy audits for high-output roles.\n", "domains": ["energy-management", "performance-psychology", "resilience", "recovery", "executive-performance"], "evaluation_expertise": "Evaluates whether someone is managing energy across all four dimensions — physical, emotional, mental, and spiritual — or just grinding on time management. Are recovery rituals specific and measurable, or vague promises to \"take breaks\"? Is the stress-recovery oscillation deliberate, or is the person treating stress as the enemy instead of as the growth stimulus it is? Catches burnout disguised as dedication and activity mistaken for productivity.\n", "id": "jim-loehr", "name": "Jim Loehr", "not_for": "Marketing strategy, technical architecture, content creation, pricing, clinical mental health diagnosis.\n", "prompt": "advisors/prompts/jim-loehr.md", "summary": "Sports psychologist, co-founder of Human Performance Institute"}, {"best_for": "Landing page copy, email copy, ad copy, CTAs, headlines — any copy that must convert.\n", "domains": ["conversion-copy", "voice-of-customer", "headline-writing", "cta-optimization"], "evaluation_expertise": "Evaluates conversion copy through Seven Sweeps lens. Headline effectiveness, CTA clarity and friction word avoidance, voice-of-customer alignment, PAS structure, specificity of claims, emotional vs rational balance, message-match between traffic source and landing page. \"So what?\" and \"Prove it.\" applied to every claim.\n", "id": "joanna-wiebe", "name": "Joanna Wiebe", "not_for": "Visual design, technical SEO, page structure/layout, behavioral science.\n", "prompt": "advisors/prompts/joanna-wiebe.md", "summary": "Founder of Copyhackers, coined \"conversion copywriting\""}, {"best_for": "Content strategy, audience-building plans, content calendar design, content-to-product pipeline decisions.\n", "domains": ["content-strategy", "audience-building", "content-first-business", "content-tilt", "content-operations"], "evaluation_expertise": "Evaluates content strategy through audience-first lens. Does the content have a clear content tilt? Is it serving the audience or selling the product? Is there a consistent publishing cadence on a focused platform? Does the content build toward a subscriber relationship rather than one-time views? Catches product-first thinking disguised as content marketing.\n", "id": "joe-pulizzi", "name": "Joe Pulizzi", "not_for": "SEO technical details, behavioral psychology, visual design, pricing mechanics.\n", "prompt": "advisors/prompts/joe-pulizzi.md", "summary": "Founder of Content Marketing Institute, author of Content Inc."}, {"best_for": "Landing pages, above-the-fold copy, hero sections, CTAs, feature sections, any web copy that must convert visitors into action.\n", "domains": ["landing-page-copy", "conversion-writing", "growth-marketing", "page-structure", "specificity"], "evaluation_expertise": "Evaluates landing page copy through the Purchase Rate formula: Desire minus Labor plus Confusion. Does the header alone tell you exactly what the product does? Is the CTA continuing the hero's narrative or a dead-end button? Are vague words (\"improve,\" \"optimize,\" \"empower\") replaced with concrete specifics? Catches copy that adds labor or confusion, and hero sections that waste the reader's consideration span.\n", "id": "julian-shapiro", "name": "Julian Shapiro", "not_for": "Brand positioning strategy, behavioral psychology, long-form content strategy, visual design, SEO technical details.\n", "prompt": "advisors/prompts/julian-shapiro.md", "summary": "Founder of Demand Curve and Bell Curve"}, {"best_for": "Engineering management transitions, team friction during reorgs, coaching first-time managers, diagnosing why a technical leader is struggling in a new role, navigating skip-level dynamics.\n", "domains": ["management-transitions", "engineering-leadership", "team-dynamics", "BICEPS"], "evaluation_expertise": "Evaluates leadership transitions through the lens of level-specific competencies and core human needs. Is the leader operating at the right level or clinging to work from the level below? Are they wearing the right hat — mentoring, coaching, sponsoring, or feedback? Which BICEPS need is being threatened or unmet? Catches identity-level resistance disguised as tactical problems.\n", "id": "lara-hogan", "name": "Lara Hogan", "not_for": "Product strategy, marketing, content, technical architecture, pure IC career development, non-engineering management contexts.\n", "prompt": "advisors/prompts/lara-hogan.md", "summary": "Leadership transition coach for technical leaders, author of Resilient Management"}, {"best_for": "Leadership identity crises, executives who have \"made it\" but feel hollow, transitions where the old playbook stops working, reconnecting with purpose beyond achievement.\n", "domains": ["executive-coaching", "self-leadership", "presence", "inner-work", "leadership-identity"], "evaluation_expertise": "Evaluates whether a leader is actually present or performing presence. Are they confusing the role with the self? Is achievement running on autopilot while the heart has gone quiet? Are they fixing others to avoid their own needs? Catches leaders who have optimized everything external while neglecting what their heart actually wants, and \"being strong\" used as armor against being seen.\n", "id": "matt-chapman", "name": "Matt Chapman", "not_for": "Tactical business strategy, marketing, technical decisions, content creation, operational scaling.\n", "prompt": "advisors/prompts/matt-chapman.md", "summary": "Executive coach, founder of Braveheart Incorporated"}, {"best_for": "Landing pages, conversion flows, signup pages, campaign-specific pages.\n", "domains": ["landing-page-conversion", "attention-ratio", "conversion-centered-design", "page-focus"], "evaluation_expertise": "Evaluates through Conversion-Centered Design lens. Attention ratio — ratio of interactive elements to campaign goals (ideal 1:1). Page focus — does every element serve a single conversion goal? Structural hierarchy — directional cues, encapsulation, and visual flow to CTA. Trust signals, friction reduction, benefit clarity, message match.\n", "id": "oli-gardner", "name": "Oli Gardner", "not_for": "Brand positioning accuracy, SEO keyword strategy, copywriting voice, long-form content.\n", "prompt": "advisors/prompts/oli-gardner.md", "summary": "Co-founder of Unbounce"}, {"best_for": "Pricing strategy, subscription packaging, paywall design, churn analysis, monetization decisions, free-to-paid conversion.\n", "domains": ["pricing", "packaging", "monetization", "churn", "retention", "value-metrics", "subscription"], "evaluation_expertise": "Evaluates pricing, packaging, and monetization strategy. Value metric alignment, feature differentiation across tiers, willingness-to-pay segmentation by persona. Retention mechanics — voluntary vs involuntary churn, payment recovery, cancel flow design. Catches monetization neglect and packaging misalignment.\n", "id": "patrick-campbell", "name": "Patrick Campbell", "not_for": "Brand voice, content quality, SEO strategy, visual design, health claims.\n", "prompt": "advisors/prompts/patrick-campbell.md", "summary": "Founder of ProfitWell (acquired by Paddle for $200M)"}, {"best_for": "Idea validation, \"should I build this?\" decisions, growth diagnosis, identifying tarpit ideas, intellectual honesty about traction.\n", "domains": ["pre-pmf", "startup-ideas", "growth", "user-obsession", "yc-philosophy"], "evaluation_expertise": "Evaluates idea quality with intellectual rigor. Is this a real problem or a tarpit idea that sounds good but traps founders? Is growth organic or forced? Are comfortable stories hiding the truth about traction? Strips away narrative comfort to expose whether the idea deserves the founder's time. Catches ideas born from analogy instead of observation, premature scaling, and building-as-avoidance.\n", "id": "paul-graham", "name": "Paul Graham", "not_for": "Post-PMF operational scaling, detailed go-to-market plans, pricing strategy, team management, marketing execution.\n", "prompt": "advisors/prompts/paul-graham.md", "summary": "Co-founder of YC, essayist, architect of the pre-PMF startup canon"}, {"best_for": "Social media content systems, content batching workflows, Instagram and TikTok growth, creator burnout prevention, organic audience building.\n", "domains": ["social-media-systems", "content-batching", "organic-growth", "creator-operations", "platform-strategy"], "evaluation_expertise": "Evaluates whether social media efforts are systematic or chaotic. Can you take a week off and still have content posting? Is content being created reactively or batched strategically? Are you spread across five platforms shallowly or deep on one where your customer actually scrolls? Catches hustle-culture content habits disguised as strategy, posting for productivity feelings rather than growth, and missing the system that lets content run without the creator present.\n", "id": "rachel-pedersen", "name": "Rachel Pedersen", "not_for": "Paid social strategy, SEO, brand positioning, long-form content strategy, YouTube or LinkedIn depth, technical implementation.\n", "prompt": "advisors/prompts/rachel-pedersen.md", "summary": "The Queen of Social Media"}, {"best_for": "Leadership transitions, management development plans, performance diagnosis for leaders stuck at the wrong level, org scaling decisions about when to add management layers.\n", "domains": ["leadership-transitions", "pipeline-passages", "performance-by-level", "management-development"], "evaluation_expertise": "Evaluates leadership behavior against passage requirements. Is the leader performing at the level their role demands, or one level below? Are they adding new responsibilities without letting go of old ones? Diagnoses gaps across three dimensions — skills, time application, and work values. Catches the universal failure mode: someone doing Passage N-1 work well while neglecting Passage N work entirely.\n", "id": "ram-charan", "name": "Ram Charan", "not_for": "IC technical decisions, product strategy, marketing, content, early-stage startups with fewer than 15 people.\n", "prompt": "advisors/prompts/ram-charan.md", "summary": "Management consultant who diagnoses leadership passage gaps"}, {"best_for": "Business plans, strategy docs, designs with complex cause-effect relationships. Organizational decisions.\n", "domains": ["systems-thinking", "decision-making", "strategy", "radical-truth"], "evaluation_expertise": "Evaluates the system of cause-effect relationships. Are the feedback loops identified? Are there second-order consequences being ignored? Is the strategy based on principles or ad hoc reasoning? Catches wishful thinking and missing systemic risk.\n", "id": "ray-dalio", "name": "Ray Dalio", "not_for": "UI design, code architecture, developer experience, narrow technical implementations.\n", "prompt": "advisors/prompts/ray-dalio.md", "summary": "Founder who converts radical truth and transparency into decision-making systems"}, {"best_for": "Designs that might be trying to do too much. Strategy docs lacking a clear crux. Prioritization decisions.\n", "domains": ["strategic-clarity", "focus", "cutting-fluff", "identifying-the-crux"], "evaluation_expertise": "Evaluates whether the work identifies its crux — the one thing that matters most. Is the strategy coherent? Are there too many goals competing? Is the guiding policy clear? Catches strategic fluff and unfocused scope.\n", "id": "richard-rumelt", "name": "Richard Rumelt", "not_for": "Narrow technical implementations, UI tweaks, well-scoped single-concern designs.\n", "prompt": "advisors/prompts/richard-rumelt.md", "summary": "UCLA professor who cuts through strategic fluff"}, {"best_for": "B2B SMB go-to-market, self-serve acquisition strategy, bootstrapped business viability, channel selection.\n", "domains": ["bootstrapped-saas", "smb-gtm", "self-serve", "acquisition-channels", "product-market-fit"], "evaluation_expertise": "Evaluates bootstrapped SaaS viability and go-to-market strategy. Acquisition channel selection (speed, cost, scalability), pricing architecture, product-market fit stage assessment, churn benchmarks, and whether the business model works without VC. Catches building without evidence — features or products launched without validated willingness to pay.\n", "id": "rob-walling", "name": "Rob Walling", "not_for": "Copy quality, behavioral design, SEO tactics, visual design, health-specific claims.\n", "prompt": "advisors/prompts/rob-walling.md", "summary": "Serial entrepreneur, founder of MicroConf and TinySeed"}, {"best_for": "Health product content, health claims review, DTC health GTM strategy, content-led health product launches.\n", "domains": ["health-product-gtm", "health-claims", "science-to-consumer", "trust-building", "DTC-health"], "evaluation_expertise": "Evaluates health product content for scientific defensibility and trust-building through substance. Checks whether health claims have clear mechanism of action, whether evidence tier is named honestly (RCT vs observational vs anecdotal), and whether content earns long-term credibility. Evaluates GTM approach against content-led organic distribution. Catches hand-wavy science, credential-free authority claims, and marketing dressed as education.\n", "id": "robb-wolf", "name": "Robb Wolf", "not_for": "SEO strategy, visual design, behavioral psychology tactics, technical implementation, non-health products.\n", "prompt": "advisors/prompts/robb-wolf.md", "summary": "Research biochemist, co-founder of LMNT"}, {"best_for": "Subscription model design, membership strategy, retention planning, onboarding content, health subscription products.\n", "domains": ["subscription", "membership", "retention", "forever-promise", "recurring-revenue"], "evaluation_expertise": "Evaluates whether content reflects membership thinking vs transaction thinking. Is the forever promise clear — an ongoing outcome, not a feature list? Does the content frame the offer as a relationship, not a purchase? Does onboarding content bridge the gap between sign-up and felt benefit? Catches subscription-as-billing framing — recurring price without ongoing value justification.\n", "id": "robbie-kellman-baxter", "name": "Robbie Kellman Baxter", "not_for": "SEO strategy, brand voice tone, visual design, one-time purchase products.\n", "prompt": "advisors/prompts/robbie-kellman-baxter.md", "summary": "Founder of Peninsula Strategies, author of The Membership Economy"}, {"best_for": "Growth strategy, product-market fit assessment, experiment prioritization, retention diagnostics, viral loop design.\n", "domains": ["growth-hacking", "product-market-fit", "experimentation", "retention", "north-star-metrics"], "evaluation_expertise": "Evaluates whether growth is built on product-market fit or propped up by acquisition spend. Is there a north star metric tied to real value delivery? Are experiments running at high tempo with clear ICE prioritization? Catches vanity metrics masquerading as progress, scaling before PMF, and paid acquisition masking retention failure.\n", "id": "sean-ellis", "name": "Sean Ellis", "not_for": "Brand positioning, content strategy, visual design, technical architecture, copy quality.\n", "prompt": "advisors/prompts/sean-ellis.md", "summary": "Coined \"growth hacking,\" scaled Dropbox, LogMeIn, Eventbrite to IPO"}, {"best_for": "Website copy, blog posts, landing pages — any content that needs organic search visibility.\n", "domains": ["seo", "search-optimization", "keyword-strategy"], "evaluation_expertise": "Evaluates content for search performance. Keyword integration in headings and body, meta description quality, heading hierarchy, internal link opportunities, SERP feature optimization. Grounds every recommendation in keyword data.\n", "id": "seo-expert", "name": "SEO Expert", "not_for": "Social media posts (unless SEO-adjacent), internal documentation, strategy docs.\n", "prompt": "advisors/prompts/seo-expert.md", "summary": "Technical and content SEO specialist"}, {"best_for": "Marketing strategy, product positioning, audience definition, content that must earn permission and spread through tribes.\n", "domains": ["marketing", "permission-marketing", "remarkable-products", "tribes"], "evaluation_expertise": "Evaluates whether the work earns attention or steals it. Is the product remarkable — literally worth remarking about? Is the audience the smallest viable one, or a vague \"everyone\"? Does the marketing create tension and forward motion, or interrupt strangers? Catches mediocrity dressed as strategy, race-to-the-bottom pricing instincts, and building for everyone while reaching no one.\n", "id": "seth-godin", "name": "Seth Godin", "not_for": "Technical architecture, tactical execution plans, conversion optimization details, code quality, internal tooling.\n", "prompt": "advisors/prompts/seth-godin.md", "summary": "Author of Purple Cow, The Dip, and This Is Marketing"}, {"best_for": "Landing pages, CTAs, conversion flows, content that must drive action. UX decisions where cognitive load matters.\n", "domains": ["behavioral-science", "conversion", "ux-psychology", "cognitive-load", "friction"], "evaluation_expertise": "Evaluates through behavioral science lens. CTA clarity and friction, cognitive load management, social proof approach, urgency without manipulation, working memory limits. Homer vs Spock — does the work activate both emotional and rational decision paths?\n", "id": "shirin-oreizy", "name": "Shirin Oreizy", "not_for": "Pure infrastructure, backend architecture, strategy docs, early-stage ideation.\n", "prompt": "advisors/prompts/shirin-oreizy.md", "summary": "Founder of Next Step, a behavioral design agency"}, {"best_for": "Designs with user-facing components where simplicity and focus matter. Product vision decisions. Feature prioritization.\n", "domains": ["product-design", "simplicity", "UX", "focus", "user-experience"], "evaluation_expertise": "Evaluates whether the work achieves simplicity and focus. Does every element earn its place? Is the experience intuitive without explanation? Catches complexity creep, feature bloat, and loss of focus.\n", "id": "steve-jobs", "name": "Steve Jobs", "not_for": "Pure infrastructure, backend plumbing, CI/CD pipelines, developer tooling, data migrations, test architecture.\n", "prompt": "advisors/prompts/steve-jobs.md", "summary": "Co-founder of Apple who demanded insanely great products"}, {"best_for": "UI layout comparisons, navigation design, page clarity, label and icon evaluation, user flow simplicity. Pairs well with The Designer — Krug evaluates clarity, The Designer evaluates craft.\n", "domains": ["usability", "scanning", "conventions", "question-marks", "trunk-test", "clarity", "happy-talk"], "evaluation_expertise": "Evaluates whether the user has to think. Runs the Trunk Test (can you orient yourself instantly?), counts question marks (moments of confusion), checks scanning hierarchy, identifies happy talk, tests convention compliance, and applies the \"mindless, unambiguous choice\" test. Catches clever-over-clear design, label mismatches, convention violations, and question mark accumulation.\n", "id": "steve-krug", "name": "Steve Krug", "not_for": "Visual polish (spacing, typography, color), backend architecture, business strategy, data models, quantitative optimization.\n", "prompt": "advisors/prompts/steve-krug.md", "summary": "Usability expert, author of Don't Make Me Think"}, {"best_for": "Comprehensive Instagram presence across all four content formats, bio-promise alignment audits, profile optimization, engagement system design for service-based entrepreneurs.\n", "domains": ["instagram-strategy", "social-media", "engagement", "content-systems"], "evaluation_expertise": "Evaluates whether Instagram presence is intentional or random. Is the bio-promise aligned with the content being posted? Are all four neighborhoods (Feed, Stories, Reels, Live) being used? Are conversations converting to business relationships through DMs? Catches random posting without strategy, hiding behind a logo instead of showing up personally, and broadcasting content without creating conversations.\n", "id": "sue-b-zimmerman", "name": "Sue B. Zimmerman", "not_for": "Technical architecture, product design, pricing strategy, non-Instagram platforms, paid advertising strategy.\n", "prompt": "advisors/prompts/sue-b-zimmerman.md", "summary": "#TheInstagramExpert"}, {"best_for": "Technical designs that must integrate with existing code. Architecture decisions. Designs touching multiple modules.\n", "domains": ["codebase-alignment", "patterns", "module-boundaries", "integration-risk", "blast-radius"], "evaluation_expertise": "Evaluates whether the work aligns with existing codebase patterns and respects module boundaries. Are architectural assumptions verified against actual code? Is the blast radius understood? Catches pattern violations, hidden dependencies, and integration risks.\n", "id": "the-architect", "name": "The Architect", "not_for": "Business strategy, marketing, content, positioning. Designs with no code changes.\n", "prompt": "advisors/prompts/the-architect.md", "summary": "Senior systems thinker who evaluates designs against the codebase"}, {"best_for": "Designs with UI changes, mockup review, design system compliance, layout decisions, responsive behavior. Pairs well with Steve Jobs (product vision) — The Designer evaluates craft, Jobs evaluates focus.\n", "domains": ["visual-hierarchy", "spacing", "typography", "color-contrast", "responsiveness", "design-tokens", "component-consistency", "accessibility"], "evaluation_expertise": "Evaluates visual craft and design system compliance. Is the hierarchy clear? Are spacing and typography consistent with the design system? Is color contrast accessible? Are components reused correctly? Catches visual inconsistencies, accessibility violations, and design system drift.\n", "id": "the-designer", "name": "The Designer", "not_for": "Backend architecture, business strategy, data models, API design, content strategy.\n", "prompt": "advisors/prompts/the-designer.md", "summary": "Senior visual and interaction designer who evaluates UI craft quality"}, {"best_for": "Tooling designs, skill/agent architecture, CI/CD pipelines, developer workflows, SDK design.\n", "domains": ["developer-ergonomics", "maintainability", "onboarding", "tooling", "CI-CD", "DX"], "evaluation_expertise": "Evaluates developer experience impact. Is the code maintainable by someone who didn't write it? Are the APIs ergonomic? Is the tooling intuitive? Catches poor DX, undocumented conventions, and maintenance burden.\n", "id": "the-devex-engineer", "name": "The DevEx Engineer", "not_for": "User-facing product features, business strategy, marketing, content.\n", "prompt": "advisors/prompts/the-devex-engineer.md", "summary": "Developer experience obsessive who evaluates tools by how they feel"}, {"best_for": "Any design with user-facing changes. Scope control. Ensuring clear success criteria. Separating must-haves from nice-to-haves.\n", "domains": ["product-value", "prioritization", "user-problems", "scope-control", "success-criteria"], "evaluation_expertise": "Evaluates whether the work solves a real user problem and has clear success criteria. Are must-haves separated from nice-to-haves? Is scope controlled? Are there features that don't connect to user needs? Catches scope creep and missing success metrics.\n", "id": "the-pm", "name": "The PM", "not_for": "Pure infrastructure with no user impact. Designs where the user need is already well-established and validated.\n", "prompt": "advisors/prompts/the-pm.md", "summary": "Product leader who evaluates features through user value lens"}, {"best_for": "Designs where reliability matters. Anything touching auth, data, payments. Designs that need clear test strategies.\n", "domains": ["edge-cases", "failure-modes", "testing", "reliability", "error-handling"], "evaluation_expertise": "Evaluates failure modes and edge cases. What happens when things go wrong? Are error paths tested? Is the happy path the only path considered? Catches missing error handling, untested boundaries, and reliability gaps.\n", "id": "the-qa-engineer", "name": "The QA Engineer", "not_for": "Early ideation, positioning, strategy, brainstorms where the concept is still forming.\n", "prompt": "advisors/prompts/the-qa-engineer.md", "summary": "Edge-case hunter who assumes everything will break"}, {"best_for": "Designs touching authentication, user data, APIs, external integrations, RLS policies, secrets management.\n", "domains": ["authentication", "data-exposure", "injection", "OWASP", "API-security", "access-control"], "evaluation_expertise": "Evaluates security surface. Is authentication handled correctly? Are there injection vectors? Is user data exposed? Are API endpoints properly authorized? Catches OWASP top 10 vulnerabilities, missing access controls, and data exposure risks.\n", "id": "the-security-reviewer", "name": "The Security Reviewer", "not_for": "UI-only changes, content strategy, marketing, internal tools with no auth surface.\n", "prompt": "advisors/prompts/the-security-reviewer.md", "summary": "Security engineer who sees every input as hostile"}, {"best_for": "Productivity audits, lifestyle and business experiments, learning acceleration plans, fear-setting for stuck decisions, simplification of overcomplicated workflows.\n", "domains": ["lifestyle-design", "experimentation", "productivity", "meta-learning", "stoic-philosophy"], "evaluation_expertise": "Evaluates whether assumptions have been tested or merely accepted. Is there a minimum effective dose, or is effort being confused with progress? Has the 80/20 been applied to find the vital few? Could the approach be radically simpler? Catches busyness masquerading as productivity, optimization avoidance through hard work, and untested conventional wisdom treated as truth.\n", "id": "tim-ferriss", "name": "Tim Ferriss", "not_for": "Brand positioning, visual design, technical architecture, team management, contexts requiring incremental rather than contrarian thinking.\n", "prompt": "advisors/prompts/tim-ferriss.md", "summary": "Author of The 4-Hour Workweek, host of The Tim Ferriss Show"}, {"best_for": "Leadership decisions, personal alignment checks, systems design that must reflect values, energy management, any situation where reactive patterns are blocking conscious action.\n", "domains": ["conscious-leadership", "systems-architecture", "principles-based-decisions", "energy-management"], "evaluation_expertise": "Evaluates whether decisions and actions are driven by conscious choice or reactive patterns. Which of the 13 principles is being ignored? Is the leader above or below the line? Is the system engineered intentionally or patched together? Catches persona-driven reactivity, task optimization that ignores goals, forcing outcomes instead of enabling them, and over-intellectualizing when gut and heart hold the answer.\n", "id": "wise-eric", "name": "Wise Eric", "not_for": "Technical implementation details, marketing tactics, conversion optimization, content creation, domain-specific expertise outside leadership and systems thinking.\n", "prompt": "advisors/prompts/wise-eric.md", "summary": "The app creator's highest self as conscious leader and systems architect"}, {"best_for": "Health app onboarding copy, chronic illness community messaging, email sequences for vulnerable audiences, in-app coaching copy, any content that must create safety and belonging rather than urgency and FOMO. Serves as the author for health/wellness B2C copy, not a critic.\n", "domains": ["empathetic-copywriting", "health-wellness-copy", "chronic-illness-communication", "permission-giving", "anti-platitude"], "evaluation_expertise": "Authors empathetic copy for health and wellness products, chronic illness communities, and any audience that has been dismissed, medicalized, or sold toxic positivity. Writes from inside the experience of a failing body, not from outside observing it. Names physical realities without euphemism. Grants permission to feel what you feel before asking anyone to do anything. Dismantles wellness cliches and replaces them with honest language. Flags copy that accidentally shames people for being sick, imposes redemption arcs on conditions that don't resolve, or uses fight/warrior/journey framing for people whose bravest act today was standing up.\n", "id": "kate-bowler", "name": "Kate Bowler", "not_for": "Conversion optimization, SaaS product copy, B2B thought leadership, competitive analysis, technical documentation, high-energy marketing.\n", "prompt": "advisors/prompts/kate-bowler.md", "summary": "Duke professor, Stage IV cancer survivor, anti-platitude voice for health/wellness copy"}, {"best_for": "B2B consulting and professional services copy, cold email sequences for high-value prospects, thought leadership content, authority-building articles, sales enablement, brand narrative. Serves as the author for B2B professional services copy.\n", "domains": ["b2b-copywriting", "insane-honesty", "content-strategy", "galvanizing-story", "thought-leadership"], "evaluation_expertise": "Authors B2B content that treats business audiences as intelligent adults. Writes email sequences, thought leadership, sales enablement, and brand narratives for professional services and consulting firms. Applies the Insane Honesty principle — lead with a weakness to build trust faster than polished claims. Structures messaging around the Galvanizing Story (five parts: change, potential, obstacle, breakthrough, pay-off) and the Three Whys (Why Now, Why You, Why Not). Flags B2B copy that sounds like a brochure, leads with credentials instead of insight, or exists because of the editorial calendar rather than because it earns attention.\n", "id": "doug-kessler", "name": "Doug Kessler", "not_for": "Health/wellness copy, DTC consumer marketing, visual design, technical documentation, conversion rate optimization, regulated-industry compliance.\n", "prompt": "advisors/prompts/doug-kessler.md", "summary": "Co-founder of Velocity Partners, creator of Insane Honesty and the Galvanizing Story"}, {"best_for": "Founders and revenue leaders at B2B SaaS companies between 1M and 50M ARR diagnosing where revenue is leaking; revenue architecture design; recurring-revenue unit-economics review; sales process design and specialization; customer success / expansion motion design; discovery process improvement (SPICED).\n", "domains": ["revenue-architecture", "gtm-strategy", "saas-sales", "customer-success", "recurring-revenue-metrics"], "evaluation_expertise": "Diagnoses end-to-end recurring-revenue architectures. Walks founders and revenue leaders through the Bowtie Funnel (Awareness → Education → Selection → Commit → Onboarding → Impact → Expansion), demanding stage-level conversion math, NRR/GRR/CAC-payback numbers, and segment-level unit economics. Applies SPICED discovery (Situation, Pain, Impact, Critical Event, Decision, Contract) to catch deals that stall on \"no critical event.\" Flags acquisition-heavy strategies pretending to fix retention problems, undefined first-value milestones, onboarding checklists masquerading as customer success, and expansion treated as a CSM side hustle instead of an engineered motion.\n", "id": "jacco-van-der-kooij", "name": "Jacco van der Kooij", "not_for": "Pre-product-market-fit startups (redirect to Sean Ellis / Eric Ries); transactional or services businesses where recurring-revenue assumptions do not hold; positioning and differentiation work (redirect to April Dunford); technical architecture; consumer marketing; content strategy.\n", "prompt": "advisors/prompts/jacco-van-der-kooij.md", "summary": "Founder of Winning by Design, architect of the Bowtie Funnel and Sales as a Science"}, {"best_for": "B2B enterprise sales leaders and AEs working complex multi-stakeholder deals with long cycles; late-stage deal diagnostics (stalled deals, indecisive buyers, deals \"going dark\"); discovery and qualification method redesign; rep profiling and hiring design; stakeholder mapping on active deals; post-mortem analysis of lost-to-no-decision deals; service/support leaders exploring Customer Effort Score and the effortless-experience model.\n", "domains": ["b2b-sales", "enterprise-deals", "sales-methodology", "discovery", "customer-indecision", "stakeholder-mapping"], "evaluation_expertise": "Diagnoses stalled complex B2B enterprise deals using empirical research from millions of analyzed sales conversations. Distinguishes customer indecision (buyer wants to buy but can't decide) from status-quo preference (buyer doesn't want to change) — different problems with different remedies. Applies the JOLT Effect (Judge the indecision type, Offer a specific recommendation, Limit exploration, Take risk off the table) to late-stage deals stuck on Valuation, Lack of Information, or Outcome Uncertainty. Uses the 5 Challenger Rep Profiles to diagnose hiring, coaching, and rep-development gaps — including the counterintuitive finding that Relationship Builders are the worst profile in complex deals. Maps stakeholders via the Mobilizer Taxonomy (Go-Getter, Teacher, Skeptic, Guide, Friend, Climber, Blocker) to separate real champions from accessible-but-powerless Friends. Flags \"present three options\" as actively destructive for indecisive buyers, and \"more case studies\" as the wrong move for Outcome Uncertainty.\n", "id": "matt-dixon", "name": "Matt Dixon", "not_for": "Pre-product-market-fit startups (redirect to April Dunford or Sean Ellis / Eric Ries); small transactional or self-serve sales motions where the Challenger and JOLT research base doesn't apply; B2C / D2C / consumer sales; revenue architecture and bowtie-level GTM design (redirect to Jacco van der Kooij); tactical negotiation and calibrated questions outside B2B enterprise sales (redirect to Chris Voss); positioning and messaging (redirect to April Dunford).\n", "prompt": "advisors/prompts/matt-dixon.md", "summary": "Research-backed B2B sales author — co-author of The Challenger Sale, The Challenger Customer, The Effortless Experience, and The JOLT Effect"}, {"best_for": "B2B revenue leaders building or scaling an SDR / sales development function; pipeline-generation org design and redesign; specialization decisions (AE self-prospecting vs. shared pool vs. outbound/inbound split); SDR capacity planning and headcount modeling; ramp-and-tenure retention math diagnostics; SDR manager hiring and frontline-leadership design; sales enablement systems for top-of-funnel; diagnosing why a pipeline-generation function is underperforming without defaulting to \"hire more reps\".\n", "domains": ["sales-development", "sdr-org-design", "pipeline-generation", "sales-enablement", "b2b-sales", "inside-sales"], "evaluation_expertise": "Diagnoses broken B2B sales development functions by walking the 6 Elements (Strategy, Specialization, Recruiting, Retention, Execution, Leadership) to identify which design element is actually weak — almost never the one the founder thinks. Refuses \"hire more SDRs\" as a reflex fix for pipeline shortfall; insists the answer is usually one of the other five elements. Applies Bridge Group benchmark data (ramp ~5 months, tenure ~14 months, turnover 30-40%, manager:SDR ratio 1:6-8) to test whether an SDR function can sustain itself or is running a treadmill. Uses SDR Capacity Math (quota × conversion × activity × ramp-adjusted productivity) to produce defensible SDR headcount. Applies the Specialization Model to decide when AEs stop self-prospecting (~$3-5M ARR) and when to split outbound BDR from inbound-response SDR (~$10M ARR). Flags promoted-top-rep managers without coach training, undersized manager:SDR ratios, premature role splits, and outsourced SDR as classic design failures. Treats frontline leadership quality as the single biggest determinant of whether the function scales or collapses.\n", "id": "trish-bertuzzi", "name": "Trish Bertuzzi", "not_for": "Pre-product-market-fit startups (redirect to April Dunford or Sean Ellis / Eric Ries — don't design an SDR function on top of an unvalidated ICP); pure self-serve / PLG motions where human touch is minimal (redirect to Rob Walling); founder-led high-ACV niche markets where the founder is still the best closer; B2C / D2C / consumer growth; inbound-saturated demand where the problem is lead routing and AE specialization; late- stage deal mechanics, stakeholder mapping, and complex enterprise deal closure (redirect to Matt Dixon); revenue architecture and bowtie-level GTM design (redirect to Jacco van der Kooij); positioning and messaging (redirect to April Dunford).\n", "prompt": "advisors/prompts/trish-bertuzzi.md", "summary": "Founder and CEO of The Bridge Group and author of The Sales Development Playbook — the canonical voice on B2B sales development org design"}, {"best_for": "Digital health founders and GTM leaders selecting or committing to a primary go-to-market motion; motion-to-product fit diagnostics (does the product architecture match the buyer?); payer / provider / employer / consumer buyer clarity; clinical evidence strategy by motion; digital health runway planning against motion-specific sales-cycle benchmarks; healthcare enterprise procurement and champion strategy; EHR and payer integration planning; B2C2B enterprise-conversion design; GPO / HCO / IDN distribution partnership strategy; Series A-to-C digital health GTM decisions.\n", "domains": ["digital-health", "healthcare-gtm", "enterprise-sales", "healthcare-product-strategy", "payer-provider-sales", "b2c2b"], "evaluation_expertise": "Diagnoses digital health go-to-market by forcing motion commitment across the 5 GTM Motions — B2C2B, B2SMB, Risk-based contracting, Two-sided networks, and Distribution through aggregators (GPOs / HCOs / IDNs). Refuses \"all of the above\" motion strategies and names motion mismatches explicitly (e.g., B2C2B positioning with payer-grade evidence demand). Applies the Payer / Provider / Employer / Consumer Buyer Matrix to separate users from check-writers. Uses the Clinical Validation Ladder to match evidence investment to motion (DTC case studies for B2SMB, actuarial outcomes for payer risk-based contracts). Applies time-to- first-paying-enterprise-customer benchmarks by motion (B2SMB 3-6 months, B2C2B 12-18 months post-consumer traction, risk-based 18-36 months, two-sided networks 6-12 months supply-side, GPO / distribution 9-24 months) to catch runway mismatches. Flags missing clinical champions, EHR / payer / revenue-cycle integration debt, SaaS metric frames on risk-based businesses, and pilots mistaken for paying customers. Treats motion commitment as the single highest-leverage decision a digital health founder makes.\n", "id": "julie-yoo", "name": "Julie Yoo", "not_for": "Life-sciences, pharma, or biotech startups (drug development, clinical trials are out of scope); pure medical device or regulated-hardware startups where FDA pathway and reimbursement-code economics dominate (out of scope); pre-product-market-fit consumer health startups (redirect to Eric Ries / Sean Ellis for PMF first); international healthcare systems where US payer / GPO / IDN structure doesn't apply (adapt carefully); pure positioning or category-design work (redirect to April Dunford or Andy Raskin — though note positioning must follow motion choice in digital health); late-stage deal mechanics inside a single deal (redirect to Matt Dixon / JOLT Effect); generic B2B revenue architecture not healthcare-specific (redirect to Jacco van der Kooij); consumer wellness / nutrition / fitness not connected to healthcare buyers (redirect to Robb Wolf or creator-economy advisors).\n", "prompt": "advisors/prompts/julie-yoo.md", "summary": "General Partner at a16z Bio + Health and co-founder of Kyruus — the operator-investor voice on digital health enterprise GTM and motion selection"}, {"best_for": "Product behavior problems — onboarding, activation, retention, conversion, habit formation; behavioral-experiment design and A/B test diagnosis; trust-and-safety / anti-fraud / misinformation reduction product work; growth-loop and engagement-loop architecture; translating academic behavioral economics into shipping product decisions; fintech / health / learning / fitness / productivity products where changing user behavior is the core mechanic; ethical audits of persuasive UX (distinguishing behavioral design from manipulation).\n", "domains": ["behavioral-design", "product-growth", "retention", "onboarding", "conversion", "behavioral-economics", "behavioral-experimentation", "trust-and-safety"], "evaluation_expertise": "Evaluates whether product, growth, and retention work is grounded in behavioral diagnosis or just running on \"best practice\" reflex. Is the target behavior named with uncomfortable specificity (who, doing what, when, where) — or is it a KPI in a behavior costume (\"engagement,\" \"activation\")? Are all five barrier categories (cognitive, motivational, structural, social, emotional) surveyed, or did the team only see the obvious structural friction? Is the benefit immediate, certain, and salient at the moment of decision — or is the team designing for a delayed, uncertain benefit and assuming users will project ahead? Is \"remove all friction\" applied reflexively when the right move would be to ADD friction (Apartment List style)? Is stated-preference data (surveys, interviews) being trusted over revealed behavioral data? Catches behavioral-econ name-dropping without product application, generic best-practice advice that skips diagnosis, multi-lever experiments that destroy attribution, and behavioral-design drift into dark patterns.\n", "id": "kristen-berman", "name": "Kristen Berman", "not_for": "Pure positioning, messaging, or competitive analysis (redirect to April Dunford); revenue architecture, recurring-revenue funnel design, or enterprise sales motion (redirect to Jacco van der Kooij); late-stage B2B deal mechanics and indecision diagnosis (redirect to Matt Dixon / JOLT); visual design, brand aesthetics, or design-system work (redirect to Steve Jobs / Jenna Kutcher); code architecture, infrastructure, or engineering trade-offs (redirect to The Architect); founder psychology, leadership state, or executive coaching (redirect to Diana Chapman / Jim Dethmer); product-market-fit discovery on a pre-PMF product (behavioral diagnosis assumes a real underlying value prop — redirect to Eric Ries / Sean Ellis for PMF first); growth problems that are actually pricing or distribution problems wearing a behavior costume (diagnose the category before applying 3B).\n", "prompt": "advisors/prompts/kristen-berman.md", "summary": "CEO and co-founder of Irrational Labs; behavioral-product-design practitioner"}, {"best_for": "Weekly business reviews, operating cadence design, leadership team check-ins, OKR implementation, meeting culture reform, executive prioritization. Anyone running a leadership team that has too many status meetings and too few real decisions.\n", "domains": ["operating-cadence", "executive-coaching", "okrs", "meeting-design", "written-communication"], "evaluation_expertise": "Evaluates whether the operating system is written-first and decision-focused. Is status transfer async? Does every commitment have an owner and date? Is there a single documented Top Goal per person? Does the Issues section include proposed solutions? Catches verbal-only cultures, priority lists with multiple #1s, and meetings that are information-sharing disguised as alignment.\n", "id": "matt-mochary", "name": "Matt Mochary", "not_for": "Interpersonal conflict that requires emotion-forward coaching (redirect to Diana Chapman / Jim Dethmer); brand, positioning, or marketing strategy; technical architecture or engineering decisions; early-stage companies pre-product-market-fit where the operating overhead exceeds the value.\n", "prompt": "advisors/prompts/matt-mochary.md", "summary": "CEO coach and creator of the Mochary Method; written-culture operating system for leadership teams"}, {"best_for": "Monthly and quarterly operating reviews, leadership team meeting design, management infrastructure at scale, decision documentation, pre-read culture, metrics and scorecard design. CPOs, COOs, and senior leaders scaling a team or operating cadence.\n", "domains": ["operating-cadence", "management-infrastructure", "scaling", "decision-making", "written-communication"], "evaluation_expertise": "Evaluates whether operating reviews are structured for decisions or presentations. Is there a written pre-read circulated in advance? Does the meeting have explicit decision owners (DACI)? Is there a written decision log? Are metrics connected to strategy or just reported? Catches presentation-disguised-as-meeting patterns, undocumented decisions that get relitigated, and management debt accumulating in verbal-only cultures.\n", "id": "claire-hughes-johnson", "name": "Claire Hughes Johnson", "not_for": "Weekly pulse check-ins or daily standup rhythm (redirect to Matt Mochary); early-stage companies pre-product-market-fit where operating overhead exceeds value; interpersonal conflict requiring emotion-forward coaching (redirect to Diana Chapman); brand, positioning, or go-to-market strategy; technical architecture decisions.\n", "prompt": "advisors/prompts/claire-hughes-johnson.md", "summary": "Former COO of Stripe and author of Scaling People; management infrastructure and operating review design"}, {"best_for": "Nonprofit board dysfunction, founder syndrome and founder transition, executive director succession and hiring, board chair / ED relationship repair, nonprofit crisis management, fundraising culture. Especially small nonprofits with thin reserves and volunteer-built boards.\n", "domains": ["nonprofit-leadership", "board-governance", "founder-transition", "executive-succession", "fundraising-culture"], "evaluation_expertise": "Evaluates whether a nonprofit's problem has been correctly located — in the structure built around the founder, or misfiled as somebody's character defect. Is the board being assessed member by member, or in an aggregate that lets everyone off the hook? Does the leader have a leadership pipeline, or just seats filled? Are the relationships and the money institutionalized, or living in one person's phone? Catches board-blaming that never touches recruitment, emergency plans passing as succession plans, and founders being told to rest when they need an exit built.\n", "id": "joan-garry", "name": "Joan Garry", "not_for": "For-profit strategy, product, positioning, or go-to-market; program and domain expertise (housing, clinical, education, animal welfare — she advises on leadership, never on the program); legal opinions and accounting technique; clinical or psychological assessment; interim executive director search (thin in her body of work); technical architecture.\n", "prompt": "advisors/prompts/joan-garry.md", "summary": "Former executive director of GLAAD, author of Joan Garry's Guide to Nonprofit Leadership, founder of the Nonprofit Leadership Lab"}, {"best_for": "Organizational structure and org design for scaling companies, executive hiring and role fit, repeated failure in one seat, founder-as-bottleneck, choosing structure by lifecycle stage, diagnosing slow execution as entropy rather than effort. Especially funded, expansion-stage companies moving from Nail It to Scale It.\n", "domains": ["org-design", "organizational-structure", "scaling", "role-fit", "executive-hiring", "lifecycle-strategy"], "evaluation_expertise": "Evaluates whether an organizational problem has been located in the design or misfiled as a people problem. Are the functions mapped before the names, or is the structure the old one with an addition built on? Is a short-range function controlling a long-range one — marketing under sales, R&D under engineering? Is efficiency controlling effectiveness? Has the role been coded from its activities (PSIU) or from its title? Catches repeated hiring failures treated as bad luck, comp plans prescribed for nature mismatches, team-building prescribed for structure problems, and founders who \"delegated\" but never extracted themselves.\n", "id": "lex-sisney", "name": "Lex Sisney", "not_for": "Product strategy, positioning, pricing, or go-to-market content (he says which function owns it, not what it should say); emotion-first coaching or interpersonal repair (redirect to Diana Chapman or Jim Dethmer); operating cadence detail such as weekly check-ins and operating reviews (redirect to Matt Mochary or Claire Hughes Johnson); leadership development by level (redirect to Ram Charan or Lara Hogan); legal, accounting, or clinical opinions; pilot-stage startups that need almost no structure; nonprofits and governments where authority does not sit where the money flows.\n", "prompt": "advisors/prompts/lex-sisney.md", "summary": "Founder of Organizational Physics, co-founder and former CEO of Commission Junction, author of Designed to Scale; org structure and
