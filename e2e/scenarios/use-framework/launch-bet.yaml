# e2e/scenarios/use-framework/launch-bet.yaml
# Three paired comparisons: full-stack vs. vanilla vs. aware-but-unaided
# System context is embedded in the prompt (file:// resolves in prompt vars,
# not in provider config).

description: "Framework: Launch Bet, Phase 1 of a one-couple launch"

providers:
  - file://../../providers/claude-login.yaml

prompts:
  - "{{system_context}}{{task_prompt}}\n\n{{product_brief}}"

defaultTest:
  options:
    provider: file://../../providers/claude-login.yaml
    rubricPrompt: file://../../providers/rubric-prompt.txt
  assert:
    - type: llm-rubric
      value: |
        Score 1-5 on PHASE DISCIPLINE: The founder has given the bet and the
        candidate couples but nothing else. Does the response work on the
        early step (pinning down the bet, its confidence, or the backcast or
        premortem) and then STOP with a question, instead of running every
        step and handing over a finished plan with success numbers, a
        checklist, and a chosen couple? A complete plan with no question
        scores 1-2.
      weight: 1
    - type: llm-rubric
      value: |
        Score 1-5 on WRITING THE BET DOWN: The founder's bet is "people will
        love it" and they want to "launch and see." Does the response refuse
        that as a bet, ask what people will do that can be counted, and ask
        for a confidence as a percentage? Does it say the success line and
        quit line will be written as a state and a date before the build?
        Accepting "love it" or "launch and see" scores 1-2.
      weight: 2
    - type: llm-rubric
      value: |
        Score 1-5 on SMALL NUMBERS: The founder mentions "a 40% conversion
        rate." Does the response turn the rate into a count of people out of
        about fifty, or say one couple is a sample of one, rather than talking
        about funnels, benchmarks, or conversion? Endorsing the 40% rate as
        the target scores 1-2. Picking a number for the founder instead of
        asking them for one scores 1-2.
      weight: 2
    - type: llm-rubric
      value: |
        Score 1-5 on VOICE CONSISTENCY: Does the response sound like Annie
        Duke: warm, blunt, curious, pushing back with a question that has an
        obvious answer, poker framing, "Wanna bet?"? Hype, lecturing, or
        academic hedging scores 1-2. Invented quotes attributed to her score
        1. These are real and not invented: "So the best kill criteria contain
        a state and a date", "So a pre-mortem is great, but only if you attach
        a pre-commitment with it", "We don't know after one flip", "There's
        this word that we use in poker: 'resulting.'"
      weight: 1

tests:
  - description: "full-stack (curated framework prompt)"
    metadata:
      arm: full-stack
    vars:
      system_context: file://../../../frameworks/launch-bet/prompt.md
      task_prompt: "\n\n---\n\nThis is Phase 1 of the launch. Nothing is built yet. Here's where I am. I'll answer step by step."
      product_brief: &brief |
        The site: a couple's friends and family write illustrated memories of
        them, delivered a few a day for the weeks before the wedding. The
        first launch is one couple and about fifty of their people.

        My bet: people will love it. Honestly I want to just launch and see.
        If I need a number, maybe a 40% conversion rate from invite to
        memory. Possible first couples: my cousin and her fiancé (wedding in
        the fall), or a couple from my running club (June wedding, about sixty
        guests).

  - description: "vanilla baseline"
    metadata:
      arm: vanilla
    vars:
      system_context: ""
      task_prompt: "I'm about to launch a site with one real customer. Nothing is built yet. Help me plan the launch. I'll answer step by step."
      product_brief: *brief

  - description: "aware-but-unaided (names expert in prompt)"
    metadata:
      arm: aware
    vars:
      system_context: ""
      task_prompt: "You are Annie Duke, author of Thinking in Bets and Quit. I'm about to launch a site with one real customer. Nothing is built yet. Help me plan the launch. I'll answer step by step."
      product_brief: *brief
