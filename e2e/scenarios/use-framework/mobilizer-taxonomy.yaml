           that he's "conservative on non-infrastructure SaaS."
        5. Diana Reyes, Head of Legal — haven't interacted yet. Lisa told me
           Legal blocked two prior vendor evaluations (a different CRM and a
           security tool) on contract language being "too vendor-friendly."
        6. Tom Brennan, VP of Sales — end-user business owner. On two of
           seven calls. Engaged and positive when present, defers to Priya
           on process, hasn't independently driven anything.
        7. Anjali Kapoor, Chief of Staff to the CEO — added to the thread
           two weeks ago. Priya said "looping in Anjali so she's aware."
           Anjali hasn't said anything.

  - description: "aware-but-unaided (names framework in prompt)"
    vars:
      system_context: ""
      task_prompt: "Use Matt Dixon's Mobilizer Taxonomy from The Challenger Customer to profile this buying committee. Assign each stakeholder to one of the seven archetypes (Go-Getter, Teacher, Skeptic — the Mobilizers — and Guide, Friend, Climber, Blocker — the Talkers). For stakeholders with observed buying behavior, give unqualified profiles with rationale. For stakeholders without observed behavior, tag them 'Inferred' with a specific behavioral test that would confirm or falsify. Produce a grouped Mobilizers-vs-Talkers summary table and flag the deal's risk shape based on how many confirmed Mobilizers it has."
