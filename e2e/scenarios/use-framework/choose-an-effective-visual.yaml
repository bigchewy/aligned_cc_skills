# e2e/scenarios/use-framework/choose-an-effective-visual.yaml
# Three paired comparisons: full-stack vs. vanilla vs. aware-but-unaided
# Single turn. The user has already answered Phases 1 and 2: who the chart is
# for, what they need to see, and the comparison (before and after a change,
# over time). So the reply is Phase 3: pick one chart, say what it rules out,
# and deal with six lines on one chart. It should stop with a question rather
# than run every later rule at once.
# An earlier version tested only Phase 2. The aware arm scored as well as the
# framework there, because any model asks "which comparison?" (2026-11-01).
# The data is a personal health log: the case that prompted this advisor.

description: "Framework: Choose an Effective Visual for a health-log chart"

providers:
  - file://../../providers/claude-login.yaml

prompts:
  - "{{system_context}}{{task_prompt}}\n\n{{situation}}"

defaultTest:
  options:
    provider: file://../../providers/claude-login.yaml
    rubricPrompt: file://../../providers/rubric-prompt.txt
  assert:
    - type: llm-rubric
      value: |
        Score 1-5 on ONE CHART, WITH THE REASON: The user has said the
        comparison is over time: daily ratings across 90 days, to see the
        trend and where it changed after a diet started. Does the response
        pick one chart type and tie the reason to that comparison (a line
        over the days, ideally with the diet's start marked)? Does it say
        plainly that the current pie chart is ruled out because a pie shows
        parts of a whole, not change over time, without banning pies in
        general? Listing several equal options without choosing scores 1-2.
        Keeping the pie scores 1.
      weight: 2
    - type: llm-rubric
      value: |
        Score 1-5 on SIX LINES: Six symptoms on one line chart would cross
        and tangle. Does the response handle that with a named fix: small
        panels, one per symptom, or one line highlighted at a time with the
        rest in gray? Score 5 only if panels come with the rule that every
        panel uses the same y-axis range (0 to 10), so the eye compares like
        with like. The framework runs one step at a time, so naming the
        tangle risk and saying it gets fixed in the next step scores 4.
        Panels with no word on the y-axis range scores 3. Not noticing the
        risk at all scores 2. Six colored lines with a legend as the answer
        scores 1.
      weight: 2
    - type: llm-rubric
      value: |
        Score 1-5 on STEP DISCIPLINE: Does the response make the chart
        decision for this step and then STOP with a question for the user
        (for example which symptom matters most, or whether the doctor needs
        the averages)? Laying out a finished spec with colors, titles,
        labels and phone layout all at once, with no question, scores 1-2.
      weight: 1
    - type: llm-rubric
      value: |
        Score 1-5 on VOICE CONSISTENCY: Does the response sound like Cole
        Nussbaumer Knaflic: plain, warm, a teacher's voice, starting from the
        audience, firm on method and soft on chart dogma (no chart type is
        banned)? Calling pie charts evil or banned scores 1. Invented quotes
        attributed to her score 1. These are real and not invented: "Your
        audience and takeaway should drive the choice", "Bar charts are almost
        always a reasonable option", "When opting for a line graph, you want
        the lines themselves to mean something", "Use something less familiar
        only when it reveals an insight that would otherwise be difficult to
        see", "Nearly every graph has a perfect use case—including the pie",
        "It's important in the above example that my y-axis minimum and
        maximum are the same for each graph".
      weight: 1

tests:
  - description: "full-stack (curated framework prompt)"
    metadata:
      arm: full-stack
    vars:
      system_context: file://../../../frameworks/choose-an-effective-visual/prompt.md
      task_prompt: "\n\n---\n\nLet's run Choose an Effective Visual for a chart in my app. I'll answer step by step. Here's what I've answered so far, including the comparison."
      situation: &situation |
        The app is a personal health log. Each day the user rates six
        symptoms from 0 to 10 (headache, flushing, itching, fatigue, stomach,
        sleep), and logs what they ate. The chart is on the app's summary
        page, viewed on a phone. The audience is the user themself, and
        sometimes their doctor at an appointment. What they need to see:
        whether things got better after they started a low-histamine diet
        six weeks ago. I have 90 days of daily ratings. Right now the page
        shows a pie chart of the average rating for each symptom.

        The comparison is over time: the daily ratings across all 90 days,
        so I can see the trend and where it changed after the diet started.
        Not just two averages. I want all six symptoms on the page. So which
        chart should it be?

  - description: "vanilla baseline"
    metadata:
      arm: vanilla
    vars:
      system_context: ""
      task_prompt: "Help me pick a chart for my app. I'll answer step by step. Here's what I've answered so far, including the comparison."
      situation: *situation

  - description: "aware-but-unaided (names expert in prompt)"
    metadata:
      arm: aware
    vars:
      system_context: ""
      task_prompt: "You are Cole Nussbaumer Knaflic, author of storytelling with data. Let's run Choose an Effective Visual for a chart in my app. I'll answer step by step. Here's what I've answered so far, including the comparison."
      situation: *situation
