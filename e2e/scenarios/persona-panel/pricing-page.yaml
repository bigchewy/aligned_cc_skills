# e2e/scenarios/persona-panel/pricing-page.yaml
# Three paired comparisons: full-stack vs. vanilla vs. aware-but-unaided
# System context is embedded in the prompt (file:// resolves in prompt vars,
# not in provider config).

description: "Persona-panel: SaaS pricing page critique"

providers:
  - id: anthropic:messages:claude-sonnet-4-20250514
    config:
      temperature: 0
      max_tokens: 3000

prompts:
  - "{{system_context}}{{task_prompt}}\n\n{{content}}"

defaultTest:
  assert:
    - type: llm-rubric
      value: |
        Score 1-5 on SPECIFICITY: Does the response reference concrete
        elements from the pricing page (specific plan names, price points,
        feature limits, FAQ answers) rather than giving generic advice?
        Generic advice ("add social proof", "clarify pricing") scores 1-2.
        Insights tied to specific content elements with reasoning score 4-5.
      weight: 2
    - type: llm-rubric
      value: |
        Score 1-5 on PERSPECTIVE DIVERSITY: Does the response surface
        multiple distinct viewpoints (e.g., budget-conscious startup vs.
        enterprise buyer vs. technical evaluator), or does it collapse
        to one generic perspective?
      weight: 2
    - type: llm-rubric
      value: |
        Score 1-5 on ACTIONABILITY: Could someone take these
        observations and make specific changes to the pricing page?
        Vague suggestions score 1-2. Concrete recommended changes
        with rationale score 4-5.
      weight: 1
    - type: llm-rubric
      value: |
        Score 1-5 on METHODOLOGY ACCURACY: If the response claims to
        follow a framework or methodology, does it follow it correctly?
        Deduct for hallucinated steps, wrong sequencing, or
        misattributed concepts. Score 5 if no methodology is claimed.
      weight: 1

tests:
  - description: "full-stack (advisor context + persona instructions)"
    vars:
      system_context: file://../../../advisors/prompts/april-dunford.md
      task_prompt: "\n\n---\n\nEvaluate the content below from multiple distinct buyer perspectives. For each persona, be concrete -- reference specific elements in the content. Provide each persona's unique viewpoint based on their role, psychology, and priorities. Structure your output with clear persona headers.\n\nEvaluate this pricing page for effectiveness:"
      content: file://../../fixtures/sample-pricing-page.md

  - description: "vanilla baseline"
    vars:
      system_context: ""
      task_prompt: "Review this pricing page and provide detailed feedback:"
      content: file://../../fixtures/sample-pricing-page.md

  - description: "aware-but-unaided (describes persona panel in prompt)"
    vars:
      system_context: ""
      task_prompt: "Act as a panel of 5 distinct buyer personas and evaluate this pricing page from each perspective separately. Provide specific, differentiated feedback from each persona:"
      content: file://../../fixtures/sample-pricing-page.md
