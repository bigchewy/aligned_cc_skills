# e2e/scenarios/use-skill/always-ask-routing.yaml
# Validates that the brainstorming router asks for the mode only when it isn't
# confident: it names the mode and proceeds on a clear single-mode request, presents
# the 3-way picker on ambiguous or mismatched requests, skips it for same-mode repeat,
# re-asks for mode changes, and respects explicit --mode flags. (The file keeps its
# old name so trigger-map entries still point at it.)

description: "Skill: brainstorming confident routing discipline"

providers:
  - file://../../providers/claude-login.yaml

prompts:
  - "{{skill_prompt}}\n\n---\n\nScenario: {{scenario_description}}\n\nUser says: {{user_input}}\n\nHow does the brainstorming router respond? If it would ask an AskUserQuestion, write the question out in full with every option label, and mark the pre-selected option."

defaultTest:
  options:
    provider: file://../../providers/claude-login.yaml
    rubricPrompt: file://../../providers/rubric-prompt.txt
  assert:
    - type: llm-rubric
      value: |
        Score 1-5 on ROUTING CORRECTNESS: Given the scenario description,
        does the response ask for the mode only when it isn't confident?
        (a) Ambiguous first request (could be more than one mode) → presents picker = 5
        (g) Clear single-mode request whose mode fits everything asked →
            names the mode in one line and proceeds without the picker = 5
        (h) Request that asks for something the detected mode excludes →
            does not silently run that mode; picks the mode that fits or presents picker = 5
        (b) Same-mode repeat → skips picker, proceeds = 5
        (c) Different-mode re-invoke → re-presents picker = 5
        (d) Explicit --mode flag → skips picker = 5
        (e) Uncertain session state → falls back to presenting the picker = 5
        (f) Retired mode name (business, planning) → says that mode no longer
            exists and presents the 3-way picker = 5
        Whenever the picker is presented, the skill requires the auto-detected
        mode to be pre-selected; pre-selecting is correct, not a fault.
        Incorrect behavior for the scenario = 1.
      weight: 3

tests:
  - description: "always-ask-a: ambiguous first request presents picker"
    metadata:
      arm: single
    vars:
      skill_prompt: file://../../../skills/brainstorming/SKILL.md
      scenario_description: "Fresh session, no prior brainstorm context"
      user_input: "Help me plan out what to build next quarter"

  - description: "always-ask-g: clear single-mode request proceeds without picker"
    metadata:
      arm: single
    vars:
      skill_prompt: file://../../../skills/brainstorming/SKILL.md
      scenario_description: "Fresh session, no prior brainstorm context"
      user_input: "Write a positioning brief for our new analytics product, using April Dunford's framework"

  - description: "always-ask-h: request needs something the detected mode excludes"
    metadata:
      arm: single
    vars:
      skill_prompt: file://../../../skills/brainstorming/SKILL.md
      scenario_description: "Fresh session. Roadmap mode excludes advisor panels and produces only a spawn-list of brainstorm prompts."
      user_input: "Break the launch of our second site into pieces, convene my product and architecture advisors on it, and put the plan into Asana with subtasks"

  - description: "always-ask-b: same-mode repeat skips picker"
    metadata:
      arm: single
    vars:
      skill_prompt: file://../../../skills/brainstorming/SKILL.md
      scenario_description: "User already selected Roadmap mode this session; now adds a follow-up"
      user_input: "Actually, also add the authentication service to the roadmap"

  - description: "always-ask-c: different-mode re-invoke re-presents picker"
    metadata:
      arm: single
    vars:
      skill_prompt: file://../../../skills/brainstorming/SKILL.md
      scenario_description: "User was in Roadmap mode; now asks something clearly Research-shaped"
      user_input: "Let's switch — compare the leading frameworks for onboarding surveys"

  - description: "always-ask-d: explicit --mode flag skips picker"
    metadata:
      arm: single
    vars:
      skill_prompt: file://../../../skills/brainstorming/SKILL.md
      scenario_description: "User supplies explicit mode flag"
      user_input: "--mode authoring: draft the launch memo for the pilot"

  - description: "always-ask-e: session-marker uncertainty falls through"
    metadata:
      arm: single
    vars:
      skill_prompt: file://../../../skills/brainstorming/SKILL.md
      scenario_description: "Ambiguous session state — prior mode marker not conclusive"
      user_input: "Let's brainstorm something new"

  - description: "always-ask-f: error path wrong-mode re-invoke"
    metadata:
      arm: single
    vars:
      skill_prompt: file://../../../skills/brainstorming/SKILL.md
      scenario_description: "User explicitly invokes a retired mode name (business or planning)"
      user_input: "Start a business mode brainstorm on our pricing strategy"
