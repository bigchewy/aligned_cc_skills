# e2e/scenarios/use-skill/use-framework-backward-compat.yaml
# Validates that direct invocation of /aligned:use-framework produces identical
# behavior to pre-refactor. The skill now delegates to _shared/framework-runner.md
# but user-facing behavior must be unchanged.

description: "Skill: use-framework direct invocation backward compat"

providers:
  - file://../../providers/claude-login.yaml

prompts:
  - "{{skill_prompt}}\n\n---\n\n{{runner_prompt}}\n\n---\n\n{{framework_prompt}}\n\n---\n\nThe user directly invokes: /aligned:use-framework {{framework_name}}\n\nUser context: {{user_context}}\n\nHow does the skill respond?"

defaultTest:
  options:
    provider: file://../../providers/claude-login.yaml
    rubricPrompt: file://../../providers/rubric-prompt.txt
  assert:
    - type: llm-rubric
      value: |
        Score 1-5 on DIRECT INVOCATION BEHAVIOR: Does the response behave
        as if the user invoked use-framework directly (not through brainstorming)?
        It should: (1) run the named framework, (2) start with an intake gate,
        (3) present WAIT points, (4) NOT present the 4-way brainstorming picker.
        Presenting the brainstorming picker = 1. Clean direct framework
        execution = 5.
      weight: 3
    - type: llm-rubric
      value: |
        Score 1-5 on INTAKE GATE PRESENT: Does the response begin by asking
        clarifying intake questions before running the framework body?
        Skipping intake = 2. Intake questions present = 5.
      weight: 2

tests:
  - description: "use-framework-direct: positioning framework direct invoke"
    metadata:
      arm: single
    vars:
      skill_prompt: file://../../../skills/use-framework/SKILL.md
      runner_prompt: file://../../../skills/_shared/framework-runner.md
      framework_prompt: file://../../../frameworks/5-components-positioning/prompt.md
      framework_name: "5-components-positioning"
      user_context: "I want to position my B2B SaaS product for mid-market buyers"
