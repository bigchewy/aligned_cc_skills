# e2e/scenarios/use-skill/deck-routing.yaml
# Validates that "deck" keyword triggers Authoring pre-selection in the 3-way picker.
# Design: "deck", "presentation", "pitch deck", "memo", "battle card" are all
# Authoring keyword signals per SKILL.md keyword expansion (Task 20 amendment).

description: "Skill: brainstorming deck keyword routes to Authoring"

providers:
  - file://../../providers/claude-login.yaml

prompts:
  - "{{skill_prompt}}\n\n---\n\nUser says: {{user_input}}\n\nPresent the 3-way picker question, written out in full with every option label as you would pass it to AskUserQuestion, and indicate which option best fits this request."

defaultTest:
  options:
    provider: file://../../providers/claude-login.yaml
    rubricPrompt: file://../../providers/rubric-prompt.txt
  assert:
    - type: llm-rubric
      value: |
        Score 1-5 on AUTHORING PRE-SELECTION: Does the response present
        the 3-way picker AND indicate that "Write a document" / Authoring
        is the best fit for this request? Presenting picker without
        highlighting Authoring = 3. Presenting picker with Authoring
        highlighted or pre-selected = 5.
      weight: 3
    - type: llm-rubric
      value: |
        Score 1-5 on PICKER COMPLETENESS: Does the response present all three
        picker labels ("Write a document", "Synthesize research",
        "Break a big intent into a queue of brainstorms")? Missing any = 1.
        All three present = 5.
      weight: 2

tests:
  - description: "deck-routing: deck for client"
    metadata:
      arm: single
    vars:
      skill_prompt: file://../../../skills/brainstorming/SKILL.md
      user_input: "I need to build a deck for a client"
