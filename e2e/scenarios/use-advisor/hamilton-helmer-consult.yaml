# e2e/scenarios/use-advisor/hamilton-helmer-consult.yaml
# Quick-consult eval for Hamilton Helmer (benefit and barrier / materiality / power progression / counter-positioning)
# Paired comparison: full-stack vs. vanilla vs. aware-but-unaided

description: "Advisor: Hamilton Helmer early-stage moat consult (recipe app)"

providers:
  - file://../../providers/claude-login.yaml

prompts:
  - "{{system_context}}{{task_prompt}}"

defaultTest:
  options:
    provider: file://../../providers/claude-login.yaml
    rubricPrompt: file://../../providers/rubric-prompt.txt
  assert:
    - type: llm-rubric
      value: |
        Score 1-5 on METHOD SPECIFICITY: Does the response use Hamilton
        Helmer's actual tools? It should test the claimed advantages for a
        benefit (lower cost or higher price) and a barrier (why a capable
        competitor can't copy it), ask whether each effect is material
        (network effects vs. network economies), and place the company in a
        stage of the power progression (origination, takeoff, stability),
        noting that branding comes late. Generic moat advice ("build a
        community", "focus on brand", "create a flywheel") with none of
        these scores 1-2.
      weight: 2
    - type: llm-rubric
      value: |
        Score 1-5 on THE SPECIFIC SITUATION: The founder has 1,200 paying
        subscribers, claims network effects (each recipe brings 30 new
        viewers), a brand, and a house AI video style, and a big cooking site
        could add the feature. Does the response (a) say the video
        style and the product can be copied (a treadmill, not Power),
        (b) say the brand claim is too early at this stage, (c) treat the
        viewer network as an effect whose materiality is unproven, and
        (d) ask why the cooking site would not copy them, i.e. whether
        copying would hurt its existing business (counter-positioning)?
        Missing two or more scores 1-2.
      weight: 2
    - type: llm-rubric
      value: |
        Score 1-5 on VOICE CONSISTENCY: Does the response sound like
        Hamilton Helmer: calm, courteous, conceding what is true before
        drawing a finer distinction, marking uncertainty, using "castle and
        not a shack", "treadmill", "material"? Hype ("massive moat",
        "unstoppable flywheel") or a harsh dismissive tone scores 1-2.
        Invented quotes attributed to him score 1. These lines are real and
        not invented: "Power requires a benefit and a barrier", "So benefit
        and a barrier, we call it the to be or not to be test.", "you have
        to have a pretty good understanding of why it's a castle and not a
        shack.", "You're on a treadmill and if you stop running on that
        treadmill, you get creamed, but it's not power.", "That's not power,
        that you paid for it.", "almost every startup that you want to deal
        with starts with counter positioning", "Yeah, it's not an impact,
        it's a material impact."
      weight: 1
    - type: llm-rubric
      value: |
        Score 1-5 on HONEST SCOPE: The founder also asks for a growth plan
        to get the next 10,000 subscribers. Does the response say go-to-market and
        growth aren't Helmer's method and point elsewhere, instead of
        inventing a Helmer growth playbook? And does it allow "no Power yet"
        as an honest answer rather than inventing a moat to be encouraging?
        Inventing a Helmer growth framework or declaring a moat scores 1-2.
      weight: 1

tests:
  - description: "full-stack (curated advisor prompt) — 1,200 subscribers, claims network effects, brand, AI video style"
    metadata:
      arm: full-stack
    vars:
      system_context: file://../../../advisors/prompts/hamilton-helmer.md
      task_prompt: "\n\n---\n\nI run a recipe app where home cooks upload family recipes and we turn each one into a short step-by-step cooking video. We have 1,200 paying subscribers at $6 a month. My investor deck says we have three moats: network effects (each uploaded recipe brings in about 30 new viewers, and some become subscribers), our brand, and our house AI video style that nobody else has. A big cooking site like NYT Cooking could add something like this. Are these real moats? And can you give me a growth plan to get to the next 10,000 subscribers?"

  - description: "vanilla baseline"
    metadata:
      arm: vanilla
    vars:
      system_context: ""
      task_prompt: "I run a recipe app where home cooks upload family recipes and we turn each one into a short step-by-step cooking video. We have 1,200 paying subscribers at $6 a month. My investor deck says we have three moats: network effects (each uploaded recipe brings in about 30 new viewers, and some become subscribers), our brand, and our house AI video style that nobody else has. A big cooking site like NYT Cooking could add something like this. Are these real moats? And can you give me a growth plan to get to the next 10,000 subscribers?"

  - description: "aware-but-unaided (names expert in prompt)"
    metadata:
      arm: aware
    vars:
      system_context: ""
      task_prompt: "You are Hamilton Helmer, author of 7 Powers. I run a recipe app where home cooks upload family recipes and we turn each one into a short step-by-step cooking video. We have 1,200 paying subscribers at $6 a month. My investor deck says we have three moats: network effects (each uploaded recipe brings in about 30 new viewers, and some become subscribers), our brand, and our house AI video style that nobody else has. A big cooking site like NYT Cooking could add something like this. Are these real moats? And can you give me a growth plan to get to the next 10,000 subscribers?"
