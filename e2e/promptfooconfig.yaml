# e2e/promptfooconfig.yaml
# Master config — aggregates all MVE scenarios
# Run: npx promptfoo eval (from e2e/ directory)
# Run single: npx promptfoo eval -c scenarios/persona-panel/pricing-page.yaml

# Judge LLM configuration — pinned for reproducibility
# Judge variance must not exceed the 0.5-point regression threshold
defaultTest:
  options:
    provider:
      id: anthropic:messages:claude-sonnet-4-20250514
      config:
        temperature: 0
    retry: 2

# Top-level provider required by promptfoo schema validation.
# Each scenario overrides with its own provider + system prompt configuration.
providers:
  - id: anthropic:messages:claude-sonnet-4-20250514
    config:
      temperature: 0
      max_tokens: 3000

# Import all MVE scenarios
scenarios:
  - file://scenarios/persona-panel/pricing-page.yaml
  - file://scenarios/use-framework/5-components-positioning.yaml
  - file://scenarios/use-advisor/april-dunford-blog-critique.yaml
  - file://scenarios/use-skill/brainstorming-positioning.yaml
  - file://scenarios/use-advisor/contextual-recommendation.yaml
  - file://scenarios/use-framework/contextual-recommendation.yaml
  - file://scenarios/use-advisor/jacco-van-der-kooij-consult.yaml
  - file://scenarios/use-framework/bowtie-funnel.yaml
  - file://scenarios/use-advisor/matt-dixon-consult.yaml
  - file://scenarios/use-framework/jolt-effect.yaml
  - file://scenarios/use-advisor/trish-bertuzzi-consult.yaml
  - file://scenarios/use-framework/6-elements-sdr.yaml
  - file://scenarios/use-advisor/julie-yoo-consult.yaml
  - file://scenarios/use-framework/5-gtm-motions-digital-health.yaml
