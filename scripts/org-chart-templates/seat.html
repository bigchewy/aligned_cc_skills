<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&amp;family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap narrow">
  <header>
    <nav class="crumbs" aria-label="Back to the chart">{{crumbs}}</nav>
    <h1>{{title}}</h1>
    <div class="meta"><span>{{dept}}</span>{{headcount}}{{pill}}</div>
    <p class="does">{{does}}</p>
  </header>
{{body}}
  <nav class="pager" aria-label="Other seats">
{{pager}}
  </nav>
</div>
<script>
document.addEventListener("click", function (event) {
  var button = event.target.closest("button.copy");
  if (!button) return;
  var code = button.parentNode.querySelector("code");
  var text = code.textContent;
  function show(label) {
    button.textContent = label;
    setTimeout(function () { button.textContent = "Copy"; }, 1500);
  }
  function selectText() {
    var range = document.createRange();
    range.selectNodeContents(code);
    var selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    show("Selected");
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { show("Copied"); }, selectText);
  } else {
    selectText();
  }
});
</script>
</body>
</html>
