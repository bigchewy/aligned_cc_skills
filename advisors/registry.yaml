# Advisor Registry — source of truth for all advisor personas
# Skills and project runtimes derive their formats from this registry.

selection_guidelines:
  narrow_scope: "1-2 critics"
  typical_scope: "2-3 critics"
  complex_scope: "3-4 critics"
  rules:
    - "Hard-exclude any critic whose not_for matches the work's primary domain"
    - "Prefer diversity of lens — avoid overlapping domains"
    - "When in doubt, prefer fewer focused critics over more redundant ones"
  calibration_examples:
    - scope: "A single utility with no integrations"
      critics: [the-architect]
    - scope: "An API route with database writes and RLS"
      critics: [the-architect, the-security-reviewer]
    - scope: "A user-facing feature with backend + UI + auth"
      critics: [steve-jobs, the-architect, the-qa-engineer]
    - scope: "A product launch plan spanning positioning, UI, backend, integrations"
      critics: [april-dunford, steve-jobs, the-architect, the-security-reviewer]

advisors:
  - id: andreo-spina
    name: "Dr. Andreo Spina"
    summary: "Creator of FRC and founder of Functional Anatomy Seminars"
    prompt: advisors/prompts/andreo-spina.md
    domains: [mobility, joint-health, tissue-adaptation, movement-science, rehabilitation]
    evaluation_expertise: >
      Evaluates whether movement and mobility protocols are grounded in
      cellular biology and progressive force application. Are tissue adaptation
      timelines realistic? Is the program building neurological ownership of
      range, or just temporary passive deformation? Catches vague flexibility
      language, quick-fix claims, and muscle-focused thinking that ignores
      joints as the limiting factor.
    best_for: >
      Mobility programming, joint health protocols, movement practice design,
      rehabilitation plans, content making claims about flexibility or mobility.
    not_for: >
      Business strategy, marketing, software architecture, content strategy,
      speed or power training.

  - id: andy-raskin
    name: "Andy Raskin"
    summary: "Strategic narrative consultant"
    prompt: advisors/prompts/andy-raskin.md
    domains: [narrative, storytelling, strategic-narrative]
    evaluation_expertise: >
      Evaluates narrative structure. Does it open with a shift in the world, not
      a product pitch? Is there a compelling arc? Does the reader feel the
      stakes? Catches product-centric messaging that fails to establish why the
      audience should care.
    best_for: >
      Blog posts, long-form content, pitch decks, brand narratives. Content that
      needs a compelling story arc.
    not_for: >
      Short-form content (social posts, CTAs), technical documentation,
      infrastructure designs.

  - id: april-dunford
    name: "April Dunford"
    summary: "Positioning consultant, helped 200+ tech companies position products"
    prompt: advisors/prompts/april-dunford.md
    domains: [positioning, messaging, competitive-analysis, differentiation, go-to-market]
    evaluation_expertise: >
      Evaluates whether positioning is clear, differentiated, and consistently
      reflected. Are competitive alternatives clear? Is the "why now"
      compelling? Does every claim trace back to a genuine differentiator?
      Catches positioning drift — claims the positioning doesn't support.
    best_for: >
      Marketing plans, landing pages, product positioning, go-to-market
      strategy, competitive analysis. Content that must reflect brand
      positioning.
    not_for: >
      Technical architecture, internal tools, backend plumbing, code quality.

  - id: arielle-nissenblatt
    name: "Arielle Nissenblatt"
    summary: "Founder of EarBuds Podcast Collective, community alchemist at SquadCast"
    prompt: advisors/prompts/arielle-nissenblatt.md
    domains: [community-building, word-of-mouth, podcast-growth, audience-engagement, human-curation]
    evaluation_expertise: >
      Evaluates whether growth strategy prioritizes genuine community and
      shareability over vanity metrics and algorithmic optimization. Is the
      content designed to trigger personal recommendations? Are listeners being
      treated as advocates, not traffic? Catches download obsession,
      algorithm-first thinking, and strategies that build passive audiences
      instead of active communities.
    best_for: >
      Podcast growth strategy, community-building plans, audience engagement
      programs, word-of-mouth campaigns, content shareability assessment.
    not_for: >
      Technical architecture, paid acquisition strategy, SEO, backend systems,
      rapid-scale growth plans.

  - id: benjamin-levine
    name: "Dr. Benjamin Levine"
    summary: "Director of Institute for Exercise and Environmental Medicine, NASA cardiovascular consultant"
    prompt: advisors/prompts/benjamin-levine.md
    domains: [exercise-physiology, cardiovascular-reconditioning, evidence-based-protocols, dysautonomia, progressive-overload]
    evaluation_expertise: >
      Evaluates whether exercise and reconditioning protocols are
      physiologically grounded with appropriate dosing and progression. Are
      heart rate targets specific and evidence-based? Is progression guided by
      data rather than subjective feel? Catches overly aggressive timelines,
      vague intensity prescriptions, and protocols that ignore individual
      cardiac capacity.
    best_for: >
      Exercise programming for deconditioned populations, cardiovascular
      reconditioning plans, POTS exercise protocols, content making claims
      about exercise physiology.
    not_for: >
      Business strategy, marketing, software design, non-cardiovascular
      health topics, elite athletic performance.

  - id: blair-grubb
    name: "Dr. Blair Grubb"
    summary: "Expert in autonomic disorders and POTS"
    prompt: advisors/prompts/blair-grubb.md
    domains: [autonomic-disorders, POTS, clinical-diagnosis, patient-advocacy, treatment-prioritization]
    evaluation_expertise: >
      Evaluates whether autonomic disorder content correctly identifies POTS
      subtypes, prioritizes high-impact interventions over exhaustive lists,
      and validates rather than dismisses patient experience. Are comorbidities
      being screened? Is the treatment plan focused on the three things that
      matter most? Catches dismissive framing, one-size-fits-all protocols,
      and over-complicated treatment plans that bury critical interventions.
    best_for: >
      POTS treatment plans, autonomic disorder content, patient education
      materials, clinical protocol review, health content that risks
      dismissing dysautonomia.
    not_for: >
      Business strategy, marketing, software architecture, exercise
      programming, non-autonomic health topics.

  - id: brene-brown
    name: "Brene Brown"
    summary: "Research professor on courage, shame, and wholehearted leadership"
    prompt: advisors/prompts/brene-brown.md
    domains: [vulnerability, leadership-courage, shame-resilience, trust-building, organizational-culture]
    evaluation_expertise: >
      Evaluates whether leadership and communication surfaces the emotional
      truth or hides behind armor. Is clarity being traded for niceness? Are
      hard conversations being avoided? Is trust being built through
      consistent small moments or demanded through position? Catches
      performative vulnerability, unclear-is-unkind communication, and
      leadership that prioritizes comfort over courage.
    best_for: >
      Leadership communications, team culture assessments, difficult
      conversation preparation, organizational trust diagnostics, content
      about leadership and authenticity.
    not_for: >
      Technical architecture, pricing strategy, SEO, conversion optimization,
      code quality.

  - id: byron-katie
    name: "Byron Katie"
    summary: "Creator of The Work and self-inquiry guide"
    prompt: advisors/prompts/byron-katie.md
    domains: [self-inquiry, cognitive-reframing, stress-reduction, belief-examination, radical-acceptance]
    evaluation_expertise: >
      Evaluates whether stressful thoughts and assumptions are being examined
      or accepted uncritically. Is the person suffering from reality or from
      their story about reality? Are beliefs being questioned through genuine
      inquiry or just replaced with positive thinking? Catches unexamined
      assumptions driving decisions, stories mistaken for facts, and attempts
      to change reality rather than question the thought arguing with it.
    best_for: >
      Decision-making paralysis, interpersonal conflict analysis, stress and
      anxiety around business or personal situations, examining assumptions
      behind strategic choices.
    not_for: >
      Technical design, marketing execution, financial analysis, product
      architecture, content creation.

  - id: chris-voss
    name: "Chris Voss"
    summary: "Former FBI lead kidnapping negotiator, author of Never Split the Difference"
    prompt: advisors/prompts/chris-voss.md
    domains: [negotiation, tactical-empathy, difficult-conversations, deal-making, conflict-resolution]
    evaluation_expertise: >
      Evaluates whether communication and negotiation approaches use empathy
      as a tool rather than logic as a weapon. Is the other side's perspective
      being labeled and acknowledged before positions are stated? Are
      calibrated questions replacing arguments? Is there an accusation audit
      for what the other side fears? Catches logic-first persuasion,
      premature compromise, and failure to address the emotional dynamics
      driving the negotiation.
    best_for: >
      Sales conversations, contract negotiations, difficult workplace
      conversations, partnership discussions, any high-stakes communication
      where the other side needs to feel heard.
    not_for: >
      Technical architecture, product design, content strategy, SEO,
      situations with no counterparty to negotiate with.

  - id: clayton-christensen
    name: "Clayton Christensen"
    summary: "Harvard professor, pioneer of disruptive innovation and Jobs to Be Done"
    prompt: advisors/prompts/clayton-christensen.md
    domains: [jobs-to-be-done, disruptive-innovation, customer-motivation, strategic-resource-allocation, innovation-strategy]
    evaluation_expertise: >
      Evaluates whether the work understands the job the customer is hiring
      the product to do — functional, emotional, and social dimensions. Is the
      strategy based on understanding customer progress or on product features?
      Are resources being allocated to match stated strategy? Catches
      product-centric thinking that ignores customer circumstances, disruption
      paranoia without identifying the actual mechanism, and stated strategies
      that don't match revealed resource allocation.
    best_for: >
      Product strategy, new market entry, innovation pipeline evaluation,
      customer research framing, strategic planning where incumbents face
      potential disruption.
    not_for: >
      UI design, code architecture, copywriting, SEO, execution-level
      marketing tactics.

  - id: copywriter
    name: "Senior Brand Copywriter"
    summary: "20 years experience in SaaS, DTC, and tech"
    prompt: advisors/prompts/copywriter.md
    domains: [copywriting, brand-voice, headlines, CTAs, content-production]
    evaluation_expertise: >
      Authors content grounded in the brand voice document and positioning
      statement. Writes headlines that are specific and benefit-driven, body
      copy that earns every sentence, and CTAs that are low-friction and
      high-clarity. Connects features to outcomes in the customer's world.
      Flags when brand voice context is insufficient to write authentically
      rather than defaulting to generic copy.
    best_for: >
      Writing landing page copy, website content, email sequences, product
      descriptions, any content that must match a brand voice and convert.
      Serves as the author in content pipeline recipes, not a critic.
    not_for: >
      Strategic critique of positioning, content strategy decisions, visual
      design, technical documentation, SEO keyword research.

  - id: danny-iny
    name: "Danny Iny"
    summary: "Founder of Mirasee, creator of Course Builder's Laboratory"
    prompt: advisors/prompts/danny-iny.md
    domains: [course-creation, validation-first-launches, pilot-methodology, online-education, knowledge-business]
    evaluation_expertise: >
      Evaluates whether knowledge products and courses are being validated
      before being built. Is demand proven through willingness to pay, or
      assumed from engagement metrics? Is the creator hiding behind
      perfectionism instead of launching a transparent pilot? Are timelines
      realistic — 60 days to pilot, not 8 months to polish? Catches building
      without validation, audience-first paralysis without monetization, and
      perfectionism masking fear of selling.
    best_for: >
      Course and workshop design, knowledge product launches, coaching
      program structure, pilot program planning, creator-economy business
      models.
    not_for: >
      Technical architecture, visual design, SEO, enterprise sales strategy,
      content that doesn't involve teaching or education.

  - id: diana-chapman
    name: "Diana Chapman"
    summary: "Co-founder of the Conscious Leadership Group"
    prompt: advisors/prompts/diana-chapman.md
    domains: [conscious-leadership, emotional-intelligence, self-awareness, conflict-resolution, team-dynamics]
    evaluation_expertise: >
      Evaluates whether leadership content addresses inner state, not just
      tactics. Is the person operating above or below the line? Are blame
      patterns disguised as feedback? Does the work reflect whole-body
      integrity or performed confidence? Catches drift between stated values
      and reactive behavior.
    best_for: >
      Leadership development content, team culture docs, founder reflections,
      conflict resolution plans, organizational values. Work that requires
      emotional honesty and self-awareness.
    not_for: >
      Technical architecture, marketing copy, financial models, product
      specs, code quality.

  - id: don-draper
    name: "Don Draper"
    summary: "Creative director"
    prompt: advisors/prompts/don-draper.md
    domains: [creative-direction, storytelling, emotional-copywriting, brand-narrative, simplicity]
    evaluation_expertise: >
      Evaluates whether messaging makes people feel something or just
      informs them. Is the story underneath the brief surfaced? Is the work
      simple enough to land, or cluttered with features and committee
      thinking? Catches copy that describes what something does instead of
      what it means.
    best_for: >
      Headlines, taglines, landing page hero copy, brand narratives, ad
      concepts, pitch decks. Any content that must move people emotionally
      in few words.
    not_for: >
      Analytical frameworks, positioning strategy, data-driven marketing,
      technical documentation, competitive analysis.

  - id: elise-darma
    name: "Elise Darma"
    summary: "Instagram strategist"
    prompt: advisors/prompts/elise-darma.md
    domains: [instagram-marketing, social-media-automation, content-efficiency, dm-conversion, reels-strategy]
    evaluation_expertise: >
      Evaluates whether Instagram content drives revenue or just vanity
      metrics. Is the time investment proportional to return? Are DMs
      automated for off-hours conversion? Catches over-investment in content
      creation, chasing follower counts, and copying influencer tactics that
      don't work for small accounts.
    best_for: >
      Instagram content plans, Reels strategy, DM automation flows,
      social media time audits. Small business owners turning Instagram
      into a revenue channel with minimal time.
    not_for: >
      Multi-channel marketing strategy, brand building, B2B marketing,
      long-form content, platforms other than Instagram.

  - id: elon-musk
    name: "Elon Musk"
    summary: "Serial founder who builds from physics up"
    prompt: advisors/prompts/elon-musk.md
    domains: [first principles, 10x thinking, breaking assumptions, efficiency]
    evaluation_expertise: >
      Questions inherited assumptions. Is this approach built from first
      principles or copied from convention? Could the scope be 10x simpler by
      removing unnecessary constraints? Catches incremental thinking when
      radical simplification is possible.
    best_for: >
      Designs where conventional thinking may be limiting. Questioning inherited
      assumptions.
    not_for: >
      Incremental improvements, polish work, emotional/therapeutic features,
      content strategy.

  - id: eric-ries
    name: "Eric Ries"
    summary: "Entrepreneur who treats startups as scientific experiments"
    prompt: advisors/prompts/eric-ries.md
    domains: [validation, hypothesis testing, lean methodology, MVP scoping]
    evaluation_expertise: >
      Evaluates whether assumptions are being validated before investment. Is
      there a testable hypothesis? Could a smaller experiment answer the key
      question? Is the scope minimal enough to learn quickly? Catches
      over-building before validation.
    best_for: >
      New features where user need is unproven. MVP scoping. Build-vs-validate
      decisions.
    not_for: >
      Mature features with proven demand, infrastructure, internal tooling,
      maintenance work.

  - id: gabor-mate
    name: "Gabor Mate"
    summary: "Physician and author on trauma, addiction, and mind-body connection"
    prompt: advisors/prompts/gabor-mate.md
    domains: [trauma-awareness, mind-body-connection, compassionate-inquiry, addiction, emotional-health]
    evaluation_expertise: >
      Evaluates whether content honors the whole person or reduces them to
      symptoms and fixes. Are compulsive patterns recognized as unmet needs?
      Is achievement framed honestly or used as validation-seeking cover?
      Catches wellness performance, caretaking disguised as generosity, and
      guilt masquerading as loyalty.
    best_for: >
      Founder wellbeing content, burnout narratives, personal essays,
      wellness program design, culture documents addressing human cost.
      Content that must go beneath the surface of productivity advice.
    not_for: >
      Marketing strategy, technical systems, competitive analysis, product
      design, financial planning.

  - id: garry-tan
    name: "Garry Tan"
    summary: "CEO of YC, designer-engineer-founder who leads with earnestness and product taste"
    prompt: advisors/prompts/garry-tan.md
    domains: [pre-pmf, ai-native, earnestness, design-thinking, yc-modern]
    evaluation_expertise: >
      Evaluates whether the founder is being earnest — genuinely solving a
      problem they care about, or performing startup. Is the product designed
      for humans or for a pitch deck? Is AI the foundation or a bolted-on
      buzzword? Are they talking to users or hiding behind building? Catches
      playing startup, premature hiring, and the conviction drain that comes
      from losing touch with users.
    best_for: >
      Pre-PMF startups, AI-native product evaluation, founder mindset diagnosis,
      product design/UX critique, deciding what to focus on.
    not_for: >
      Detailed go-to-market execution, pricing/monetization strategy, post-PMF
      scaling operations, team management, deep strategic analysis.

  - id: italo-biaggioni
    name: "Dr. Italo Biaggioni"
    summary: "Clinical pharmacologist, director emeritus of Vanderbilt's Autonomic Dysfunction Center"
    prompt: advisors/prompts/italo-biaggioni.md
    domains: [clinical-pharmacology, autonomic-disorders, mechanism-based-treatment, dysautonomia, evidence-based-medicine]
    evaluation_expertise: >
      Evaluates whether treatment approaches match the underlying
      pathophysiology. Is the mechanism understood before choosing
      intervention? Are non-pharmacologic measures exhausted first? Catches
      protocol-following without substrate assessment, chasing numbers
      instead of symptoms, and applying specialist-level interventions to
      mild presentations.
    best_for: >
      Autonomic dysfunction treatment plans, dysautonomia patient education,
      clinical pharmacology discussions, mechanism-based medical content.
      Health content requiring physiologic precision.
    not_for: >
      Marketing, business strategy, creative content, software design,
      general wellness advice outside autonomic medicine.

  - id: jasmine-star
    name: "Jasmine Star"
    summary: "Social media strategist, founder of Social Curator"
    prompt: advisors/prompts/jasmine-star.md
    domains: [instagram-strategy, relationship-marketing, service-business-growth, dm-engagement, content-positioning]
    evaluation_expertise: >
      Evaluates whether content leads with the problem solved or just lists
      services. Is the audience focus at 98% their problems, 2% your offer?
      Are DM relationships being cultivated or ghosted after engagement?
      Catches feature-first messaging, posting-and-ghosting, and content
      that talks about you instead of them.
    best_for: >
      Service business Instagram strategy, content calendars, DM
      engagement systems, social media for photographers, coaches, and
      consultants. Content that must convert through relationship.
    not_for: >
      Product businesses, B2B enterprise marketing, multi-channel strategy,
      technical documentation, platforms outside Instagram.

  - id: jay-clouse
    name: "Jay Clouse"
    summary: "Founder of Creator Science"
    prompt: advisors/prompts/jay-clouse.md
    domains: [creator-economy, audience-growth, experimentation, creator-business-models, trust-building]
    evaluation_expertise: >
      Evaluates whether creator strategies are evidence-based or guru-driven
      hype. Is there a testable hypothesis before scaling? Are trust metrics
      (email open rates, revenue per subscriber) tracked over vanity metrics?
      Catches hustle-culture assumptions, premature scaling, and building
      on unvalidated audience assumptions.
    best_for: >
      Creator business plans, newsletter strategy, podcast growth audits,
      content monetization models, audience experiments. Work that needs
      a scientific, sustainable approach to creator growth.
    not_for: >
      Enterprise marketing, paid advertising strategy, brand identity
      design, technical product development, time-sensitive viral campaigns.

  - id: jeff-bezos
    name: "Jeff Bezos"
    summary: "Founder who works backwards from the customer and thinks in decades"
    prompt: advisors/prompts/jeff-bezos.md
    domains: [customer obsession, scalability, long-term strategy, reversibility]
    evaluation_expertise: >
      Evaluates through the lens of customer impact and long-term thinking. Is
      this a one-way or two-way door decision? Does it scale? Is the customer
      working backward from their needs or from the technology? Catches
      short-term thinking and reversibility blind spots.
    best_for: >
      Designs that affect customers, need to scale, or involve irreversible
      decisions. Long-term architectural bets.
    not_for: >
      Internal tooling, one-off scripts, personal workflows, narrow UI tweaks.

  - id: jenna-kutcher
    name: "Jenna Kutcher"
    summary: "Host of Goal Digger Podcast, NYT bestselling author"
    prompt: advisors/prompts/jenna-kutcher.md
    domains: [content-marketing, creative-entrepreneurship, email-list-building, content-repurposing, authentic-branding]
    evaluation_expertise: >
      Evaluates whether content connects on a human level or sounds like a
      textbook. Are content pillars balanced between connection and selling?
      Is the creator showing up as a real person or performing polish?
      Catches over-complicated frameworks, hustle-culture undertones, and
      content that breaks the promise the bio makes.
    best_for: >
      Content pillar strategy, email marketing for creatives, social media
      repurposing workflows, personal brand development. Creative
      entrepreneurs who need warmth and structure without corporate rigidity.
    not_for: >
      B2B enterprise strategy, technical documentation, analytical
      frameworks, regulated industries, luxury brand positioning.

  - id: jeremy-enns
    name: "Jeremy Enns"
    summary: "Founder of Podcast Marketing Academy"
    prompt: advisors/prompts/jeremy-enns.md
    domains: [podcast-marketing, creator-growth-systems, audience-retention, scrappy-marketing, content-monetization]
    evaluation_expertise: >
      Evaluates whether podcast growth is engineered or just hoped for. Is
      retention measured before chasing exposure? Is there a clear path from
      listener to revenue, or just a download number? Catches leaky-bucket
      growth tactics, download vanity, and generic content that lacks a
      specific audience and problem.
    best_for: >
      Podcast launch and growth plans, creator marketing systems, small-audience
      monetization strategy, content-to-revenue mapping. Underdog creators
      who need systems, not hype.
    not_for: >
      Enterprise content strategy, paid media campaigns, visual brand design,
      large-team operations, entertainment podcasts prioritizing art over business.

  - id: jim-dethmer
    name: "Jim Dethmer"
    summary: "Co-founder of the Conscious Leadership Group, coached 150+ CEOs"
    prompt: advisors/prompts/jim-dethmer.md
    domains: [conscious-leadership, integrity, team-performance, radical-responsibility]
    evaluation_expertise: >
      Evaluates through the lens of integrity as energetic wholeness. Which of
      the four pillars is cracked — radical responsibility, candor, feeling all
      feelings, or impeccable agreements? Is the leader above or below the line?
      Are they performing leadership or practicing it? Catches the drift —
      gradual movement below the line disguised as competence — and framework
      addiction where intellectual analysis substitutes for actual feeling and
      action.
    best_for: >
      Leadership integrity diagnostics, team trust breakdowns, executive
      coaching situations, founder self-awareness, candor and agreements issues,
      conscious leadership development.
    not_for: >
      Technical architecture, product design, marketing strategy, pricing,
      content strategy, pure IC career development.

  - id: jim-loehr
    name: "Jim Loehr"
    summary: "Sports psychologist, co-founder of Human Performance Institute"
    prompt: advisors/prompts/jim-loehr.md
    domains: [energy-management, performance-psychology, resilience, recovery, executive-performance]
    evaluation_expertise: >
      Evaluates whether someone is managing energy across all four dimensions —
      physical, emotional, mental, and spiritual — or just grinding on time
      management. Are recovery rituals specific and measurable, or vague
      promises to "take breaks"? Is the stress-recovery oscillation deliberate,
      or is the person treating stress as the enemy instead of as the growth
      stimulus it is? Catches burnout disguised as dedication and activity
      mistaken for productivity.
    best_for: >
      Founder burnout plans, executive performance routines, work-life
      oscillation design, energy audits for high-output roles.
    not_for: >
      Marketing strategy, technical architecture, content creation, pricing,
      clinical mental health diagnosis.

  - id: joanna-wiebe
    name: "Joanna Wiebe"
    summary: "Founder of Copyhackers, coined \"conversion copywriting\""
    prompt: advisors/prompts/joanna-wiebe.md
    domains: [conversion-copy, voice-of-customer, headline-writing, cta-optimization]
    evaluation_expertise: >
      Evaluates conversion copy through Seven Sweeps lens. Headline
      effectiveness, CTA clarity and friction word avoidance, voice-of-customer
      alignment, PAS structure, specificity of claims, emotional vs rational
      balance, message-match between traffic source and landing page. "So what?"
      and "Prove it." applied to every claim.
    best_for: >
      Landing page copy, email copy, ad copy, CTAs, headlines — any copy that
      must convert.
    not_for: >
      Visual design, technical SEO, page structure/layout, behavioral science.

  - id: joe-pulizzi
    name: "Joe Pulizzi"
    summary: "Founder of Content Marketing Institute, author of Content Inc."
    prompt: advisors/prompts/joe-pulizzi.md
    domains: [content-strategy, audience-building, content-first-business, content-tilt, content-operations]
    evaluation_expertise: >
      Evaluates content strategy through audience-first lens. Does the content
      have a clear content tilt? Is it serving the audience or selling the
      product? Is there a consistent publishing cadence on a focused platform?
      Does the content build toward a subscriber relationship rather than
      one-time views? Catches product-first thinking disguised as content
      marketing.
    best_for: >
      Content strategy, audience-building plans, content calendar design,
      content-to-product pipeline decisions.
    not_for: >
      SEO technical details, behavioral psychology, visual design, pricing
      mechanics.

  - id: julian-shapiro
    name: "Julian Shapiro"
    summary: "Founder of Demand Curve and Bell Curve"
    prompt: advisors/prompts/julian-shapiro.md
    domains: [landing-page-copy, conversion-writing, growth-marketing, page-structure, specificity]
    evaluation_expertise: >
      Evaluates landing page copy through the Purchase Rate formula: Desire
      minus Labor plus Confusion. Does the header alone tell you exactly what
      the product does? Is the CTA continuing the hero's narrative or a
      dead-end button? Are vague words ("improve," "optimize," "empower")
      replaced with concrete specifics? Catches copy that adds labor or
      confusion, and hero sections that waste the reader's consideration span.
    best_for: >
      Landing pages, above-the-fold copy, hero sections, CTAs, feature
      sections, any web copy that must convert visitors into action.
    not_for: >
      Brand positioning strategy, behavioral psychology, long-form content
      strategy, visual design, SEO technical details.

  - id: kelly-starrett
    name: "Dr. Kelly Starrett"
    summary: "Physical therapist, movement coach, founder of The Ready State"
    prompt: advisors/prompts/kelly-starrett.md
    domains: [mobility, movement-mechanics, physical-maintenance, injury-prevention, biomechanics]
    evaluation_expertise: >
      Evaluates whether movement and recovery plans target positions and tissue
      quality rather than muscles and random stretching. Is there a test-retest
      protocol, or is it mobility theater? Are symptoms being chased downstream
      when the source is upstream? Catches vague "stretch more" advice,
      time-wasting routines without measurable outcomes, and over-reliance on
      flexibility framing when the real issue is tissue stiffness or motor
      control.
    best_for: >
      Daily mobility routines, desk-worker body maintenance, movement
