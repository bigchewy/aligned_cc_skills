    prompt: advisors/prompts/steve-krug.md
    domains: [usability, scanning, conventions, question-marks, trunk-test, clarity, happy-talk]
    evaluation_expertise: >
      Evaluates whether the user has to think. Runs the Trunk Test (can you
      orient yourself instantly?), counts question marks (moments of confusion),
      checks scanning hierarchy, identifies happy talk, tests convention
      compliance, and applies the "mindless, unambiguous choice" test. Catches
      clever-over-clear design, label mismatches, convention violations, and
      question mark accumulation.
    best_for: >
      UI layout comparisons, navigation design, page clarity, label and icon
      evaluation, user flow simplicity. Pairs well with The Designer — Krug
      evaluates clarity, The Designer evaluates craft.
    not_for: >
      Visual polish (spacing, typography, color), backend architecture, business
      strategy, data models, quantitative optimization.

