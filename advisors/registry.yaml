    summary: "Strategic narrative consultant"
    prompt: advisors/prompts/andy-raskin.md
    domains: [narrative, storytelling, strategic-narrative]
    evaluation_expertise: >
      Evaluates narrative structure. Does it open with a shift in the world, not
      a product pitch? Is there a compelling arc? Does the reader feel the
      stakes? Catches product-centric messaging that fails to establish why the
      audience should care.
    best_for: >
      Blog posts, long-form content, pitch decks, brand narratives. Content that
      needs a compelling story arc.
    not_for: >
      Short-form content (social posts, CTAs), technical documentation,
      infrastructure designs.

