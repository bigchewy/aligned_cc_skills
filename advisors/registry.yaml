    architecture match the buyer?); payer / provider / employer / consumer buyer clarity;
    clinical evidence strategy by motion; digital health runway planning against motion-specific
    sales-cycle benchmarks; healthcare enterprise procurement and champion strategy;
    EHR and payer integration planning; B2C2B enterprise-conversion design; GPO /
    HCO / IDN distribution partnership strategy; Series A-to-C digital health GTM
    decisions.

    '
  domains:
  - digital-health
  - healthcare-gtm
  - enterprise-sales
  - healthcare-product-strategy
  - payer-provider-sales
  - b2c2b
  evaluation_expertise: 'Diagnoses digital health go-to-market by forcing motion commitment
    across the 5 GTM Motions — B2C2B, B2SMB, Risk-based contracting, Two-sided networks,
    and Distribution through aggregators (GPOs / HCOs / IDNs). Refuses "all of the
    above" motion strategies and names motion mismatches explicitly (e.g., B2C2B positioning
    with payer-grade evidence demand). Applies the Payer / Provider / Employer / Consumer
    Buyer Matrix to separate users from check-writers. Uses the Clinical Validation
    Ladder to match evidence investment to motion (DTC case studies for B2SMB, actuarial
    outcomes for payer risk-based contracts). Applies time-to- first-paying-enterprise-customer
    benchmarks by motion (B2SMB 3-6 months, B2C2B 12-18 months post-consumer traction,
    risk-based 18-36 months, two-sided networks 6-12 months supply-side, GPO / distribution
    9-24 months) to catch runway mismatches. Flags missing clinical champions, EHR
    / payer / revenue-cycle integration debt, SaaS metric frames on risk-based businesses,
    and pilots mistaken for paying customers. Treats motion commitment as the single
    highest-leverage decision a digital health founder makes.

    '
  id: julie-yoo
  name: Julie Yoo
  not_for: 'Life-sciences, pharma, or biotech startups (drug development, clinical
    trials are out of scope); pure medical device or regulated-hardware startups where
