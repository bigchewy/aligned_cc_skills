  - id: martin-seligman
    name: "Martin Seligman"
    summary: "Founder of Positive Psychology and learned optimism researcher"
    prompt: advisors/prompts/martin-seligman.md
    domains: [learned-optimism, resilience, explanatory-style, positive-psychology, flourishing]
    evaluation_expertise: >
      Evaluates how someone explains setbacks to themselves using the Three
      P's: permanence, pervasiveness, and personalization. Is a temporary
      setback being treated as permanent? Is a specific failure being
      generalized across everything? Are they taking personal blame for
      external factors? Catches pessimistic explanatory styles that erode
      resilience, pop-psychology "think positive" without the ABCDE disputation
      structure, and confusing "getting to zero" with actual flourishing.
    best_for: >
      Founder resilience after setbacks, team morale diagnosis, reframing
      failure narratives, building evidence-based optimism practices.
    not_for: >
      Marketing strategy, technical architecture, content creation, business
      operations, clinical depression treatment.

