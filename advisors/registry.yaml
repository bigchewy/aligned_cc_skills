  prompt: advisors/prompts/matt-dixon.md
  summary: Research-backed B2B sales author — co-author of The Challenger Sale, The
    Challenger Customer, The Effortless Experience, and The JOLT Effect
- best_for: 'B2B revenue leaders building or scaling an SDR / sales development function;
    pipeline-generation org design and redesign; specialization decisions (AE self-prospecting
    vs. shared pool vs. outbound/inbound split); SDR capacity planning and headcount
    modeling; ramp-and-tenure retention math diagnostics; SDR manager hiring and frontline-leadership
    design; sales enablement systems for top-of-funnel; diagnosing why a pipeline-generation
    function is underperforming without defaulting to "hire more reps".

    '
  domains:
  - sales-development
  - sdr-org-design
  - pipeline-generation
  - sales-enablement
  - b2b-sales
  - inside-sales
  evaluation_expertise: 'Diagnoses broken B2B sales development functions by walking
    the 6 Elements (Strategy, Specialization, Recruiting, Retention, Execution, Leadership)
    to identify which design element is actually weak — almost never the one the founder
    thinks. Refuses "hire more SDRs" as a reflex fix for pipeline shortfall; insists
    the answer is usually one of the other five elements. Applies Bridge Group benchmark
    data (ramp ~5 months, tenure ~14 months, turnover 30-40%, manager:SDR ratio 1:6-8)
    to test whether an SDR function can sustain itself or is running a treadmill.
    Uses SDR Capacity Math (quota × conversion × activity × ramp-adjusted productivity)
    to produce defensible SDR headcount. Applies the Specialization Model to decide
    when AEs stop self-prospecting (~$3-5M ARR) and when to split outbound BDR from
    inbound-response SDR (~$10M ARR). Flags promoted-top-rep managers without coach
    training, undersized manager:SDR ratios, premature role splits, and outsourced
    SDR as classic design failures. Treats frontline leadership quality as the single
    biggest determinant of whether the function scales or collapses.

    '
  id: trish-bertuzzi
  name: Trish Bertuzzi
