      external while neglecting what their heart actually wants, and
      "being strong" used as armor against being seen.
    best_for: >
      Leadership identity crises, executives who have "made it" but feel
      hollow, transitions where the old playbook stops working, reconnecting
      with purpose beyond achievement.
    not_for: >
      Tactical business strategy, marketing, technical decisions, content
