  - id: the-architect
    name: "The Architect"
    summary: "Senior systems thinker who evaluates designs against the codebase"
    prompt: advisors/prompts/the-architect.md
    domains: [codebase alignment, patterns, module boundaries, integration risk, blast radius]
    evaluation_expertise: >
      Evaluates whether the work aligns with existing codebase patterns and
      respects module boundaries. Are architectural assumptions verified against
      actual code? Is the blast radius understood? Catches pattern violations,
      hidden dependencies, and integration risks.
    best_for: >
      Technical designs that must integrate with existing code. Architecture
      decisions. Designs touching multiple modules.
    not_for: >
      Business strategy, marketing, content, positioning. Designs with no code
      changes.

  - id: the-designer
    name: "The Designer"
    summary: "Senior visual and interaction designer who evaluates UI craft quality"
    prompt: advisors/prompts/the-designer.md
    domains: [visual hierarchy, spacing, typography, color contrast, responsiveness, design tokens, component consistency, accessibility]
    evaluation_expertise: >
      Evaluates visual craft and design system compliance. Is the hierarchy
      clear? Are spacing and typography consistent with the design system? Is
      color contrast accessible? Are components reused correctly? Catches visual
      inconsistencies, accessibility violations, and design system drift.
    best_for: >
      Designs with UI changes, mockup review, design system compliance, layout
      decisions, responsive behavior. Pairs well with Steve Jobs (product
      vision) — The Designer evaluates craft, Jobs evaluates focus.
    not_for: >
      Backend architecture, business strategy, data models, API design, content
      strategy.

  - id: the-devex-engineer
    name: "The DevEx Engineer"
    summary: "Developer experience obsessive who evaluates tools by how they feel"
    prompt: advisors/prompts/the-devex-engineer.md
    domains: [developer ergonomics, maintainability, onboarding, tooling, CI/CD, DX]
    evaluation_expertise: >
      Evaluates developer experience impact. Is the code maintainable by someone
      who didn't write it? Are the APIs ergonomic? Is the tooling intuitive?
      Catches poor DX, undocumented conventions, and maintenance burden.
    best_for: >
      Tooling designs, skill/agent architecture, CI/CD pipelines, developer
      workflows, SDK design.
    not_for: >
      User-facing product features, business strategy, marketing, content.

  - id: the-pm
    name: "The PM"
    summary: "Product leader who evaluates features through user value lens"
    prompt: advisors/prompts/the-pm.md
    domains: [product value, prioritization, user problems, scope control, success criteria]
    evaluation_expertise: >
      Evaluates whether the work solves a real user problem and has clear
      success criteria. Are must-haves separated from nice-to-haves? Is scope
      controlled? Are there features that don't connect to user needs? Catches
      scope creep and missing success metrics.
    best_for: >
      Any design with user-facing changes. Scope control. Ensuring clear success
      criteria. Separating must-haves from nice-to-haves.
    not_for: >
      Pure infrastructure with no user impact. Designs where the user need is
      already well-established and validated.

  - id: the-qa-engineer
    name: "The QA Engineer"
    summary: "Edge-case hunter who assumes everything will break"
    prompt: advisors/prompts/the-qa-engineer.md
    domains: [edge cases, failure modes, testing, reliability, error handling]
    evaluation_expertise: >
      Evaluates failure modes and edge cases. What happens when things go wrong?
      Are error paths tested? Is the happy path the only path considered?
      Catches missing error handling, untested boundaries, and reliability gaps.
    best_for: >
      Designs where reliability matters. Anything touching auth, data, payments.
      Designs that need clear test strategies.
    not_for: >
      Early ideation, positioning, strategy, brainstorms where the concept is
      still forming.

  - id: the-security-reviewer
    name: "The Security Reviewer"
    summary: "Security engineer who sees every input as hostile"
    prompt: advisors/prompts/the-security-reviewer.md
    domains: [authentication, data exposure, injection, OWASP, API security, access control]
    evaluation_expertise: >
      Evaluates security surface. Is authentication handled correctly? Are there
      injection vectors? Is user data exposed? Are API endpoints properly
      authorized? Catches OWASP top 10 vulnerabilities, missing access controls,
      and data exposure risks.
    best_for: >
      Designs touching authentication, user data, APIs, external integrations,
      RLS policies, secrets management.
    not_for: >
      UI-only changes, content strategy, marketing, internal tools with no auth
      surface.

